<title>Engineering Control Tower · Collettore</title>
<style>:root {
  --sfondo: #f5f6f8; --carta: #fff; --testo: #1c2230; --tenue: #5b6475; --bordo: #d9dde4;
  --primario: #1f5fbf; --allarme: #b3261e; --avviso: #a15c00; --ok: #2e7d4f; --raggio: 8px;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--testo); background: var(--sfondo); min-width: 1280px; }
button, input, select, textarea { font: inherit; }
button { padding: 5px 12px; border: 1px solid var(--bordo); border-radius: 6px; background: var(--carta); color: var(--testo); cursor: pointer; }
button:hover { border-color: var(--primario); }
button.primario { background: var(--primario); border-color: var(--primario); color: #fff; }
button.pericolo { color: var(--allarme); border-color: var(--allarme); }
button:disabled { opacity: .5; cursor: default; }
button.link { border: 0; padding: 0; background: none; color: var(--primario); font-weight: 600; }
code { background: #eef0f4; padding: 1px 4px; border-radius: 4px; }

.iniziale { max-width: 640px; margin: 80px auto; background: var(--carta); padding: 32px; border-radius: 12px; border: 1px solid var(--bordo); }
.scelte-iniziali { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.scelte-iniziali button, .bottone { padding: 10px 14px; text-align: left; }
.bottone { border: 1px solid var(--bordo); border-radius: 6px; cursor: pointer; }

.barra { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #16233b; color: #fff; position: sticky; top: 0; z-index: 2; }
.marchio { font-weight: 700; font-size: 16px; letter-spacing: .3px; }
.viste { display: flex; gap: 4px; }
.viste button { background: transparent; color: #cfd8ea; border-color: transparent; }
.viste button.attiva { background: #2c3d5e; color: #fff; }
#cerca { width: 240px; padding: 5px 10px; border-radius: 6px; border: 0; }
.destra { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.stato-salvataggio { color: #a9d3b8; font-size: 13px; }
.stato-salvataggio.sporco { color: #ffd38a; }
.avviso-demo { color: #ffd38a; }
#conflitti { background: var(--avviso); color: #fff; border-color: var(--avviso); }
.sottobarra { display: flex; align-items: center; gap: 6px; padding: 8px 20px; background: var(--carta); border-bottom: 1px solid var(--bordo); }
.sottobarra .utente { margin-left: auto; }
.fonte-dati { color: var(--tenue); font-size: 12px; margin-left: 12px; }

#vista { padding: 16px 20px 60px; }
.testata-vista { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.testata-vista h1 { font-size: 22px; margin: 0; }
.meta { color: var(--tenue); font-size: 12.5px; }
.conta { color: var(--tenue); font-weight: 400; }
.vuoto { color: var(--tenue); font-style: italic; margin: 4px 0; }

.settimanale { display: flex; flex-direction: column; gap: 14px; }
.stream { background: var(--carta); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: 12px 16px; }
.stream h3 { margin: 0 0 8px; font-size: 16px; }
.blocchi { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.blocco h4 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--tenue); }
.blocco.allarme h4 { color: var(--allarme); }
.voci { list-style: none; margin: 0; padding: 0; }
.riga-voce { padding: 4px 0; border-bottom: 1px solid #eef0f3; }
.riga-voce .meta { display: block; }
.scaduta { color: var(--allarme); font-weight: 600; }
.data { color: var(--tenue); font-variant-numeric: tabular-nums; margin-right: 4px; }

.badge { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 10px; background: #e8ebf0; color: #384152; }
.stato-bloccata { background: #fbe1df; color: var(--allarme); }
.stato-in-corso { background: #e1ecfb; color: #174a95; }
.stato-chiusa { background: #e2f3e8; color: var(--ok); }

.schede { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.scheda.attiva { background: var(--primario); color: #fff; border-color: var(--primario); }
.prodotto, .progetto { background: var(--carta); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: 14px 18px; margin-bottom: 14px; }
.prodotto h2, .progetto h2 { margin: 0; font-size: 18px; }
.colonne { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin: 12px 0; }
.condiviso { font-size: 12px; color: var(--avviso); margin-left: 6px; }
.milestone { display: flex; gap: 18px; padding: 0; list-style: none; margin: 8px 0; }
.milestone li { padding: 3px 10px; border-radius: 6px; background: #e1ecfb; }
.milestone li.passata { background: #eef0f3; color: var(--tenue); }

.matrice { border-collapse: collapse; background: var(--carta); border: 1px solid var(--bordo); }
.matrice th, .matrice td { padding: 6px 12px; border-bottom: 1px solid #eef0f3; text-align: left; }
.matrice thead th { background: #eef1f6; font-size: 12.5px; }
.matrice td.presente { color: var(--primario); text-align: center; font-size: 18px; }
.matrice td.assente { color: #c3c8d1; text-align: center; }
.matrice td.num { text-align: right; }

dialog { border: 1px solid var(--bordo); border-radius: 12px; padding: 20px 24px; width: 760px; max-height: 88vh; }
dialog::backdrop { background: rgba(20, 28, 45, .45); }
dialog h2 { margin-top: 0; }
.griglia-campi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.campo { display: flex; flex-direction: column; gap: 3px; }
.campo textarea, .campo[data-campo="titolo"], .campo[data-campo="testo"], .campo[data-campo="descrizione"] { grid-column: 1 / -1; }
.etichetta { font-weight: 600; font-size: 12.5px; }
.obbl { color: var(--allarme); }
.campo input, .campo select, .campo textarea { padding: 5px 8px; border: 1px solid var(--bordo); border-radius: 6px; }
.scelte { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.errore-campo { color: var(--allarme); font-size: 12px; min-height: 0; }
.errori { color: var(--allarme); }
.errori ul { margin: 4px 0 10px; }
.azioni-form { display: flex; gap: 8px; margin-top: 16px; }
.scheda-voce .tipo { color: var(--tenue); margin: 0; text-transform: uppercase; font-size: 12px; letter-spacing: .4px; }
.campi th { text-align: left; color: var(--tenue); font-weight: 600; padding: 3px 14px 3px 0; vertical-align: top; }

#messaggi { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.messaggio { background: #16233b; color: #fff; padding: 10px 14px; border-radius: 8px; max-width: 420px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.messaggio.errore { background: var(--allarme); }
.messaggio.avviso { background: var(--avviso); }
body { min-width: 0; background: #eef2f7; }
.barra, .sottobarra, .viste, .destra { flex-wrap: wrap; }
.barra { background: #0d1729; gap: 10px 20px; }
.barra .marchio { color: #87e4cf; }
#vista { overflow-x: auto; }
.pmo { max-width: 1480px; margin: auto; display: grid; gap: 18px; color: #14243a; }
.pmo-hero { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 22px; padding: clamp(24px, 4vw, 58px); border-radius: 22px; color: white; background: radial-gradient(ellipse at top right, #155465, transparent 66%), linear-gradient(135deg,#0c162a,#172e4b); }
.pmo-hero h1 { margin: 4px 0 10px; font-size: clamp(2rem, 5vw, 4.5rem); line-height: 1; letter-spacing: -.055em; }
.pmo-hero p { margin: 0; color: #d1e3f1; }
.pmo-hero .pmo-eyebrow { color: #87e4cf; font-size: .78em; font-weight: 750; letter-spacing: .19em; }
.pmo-controls, .pmo-deck { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pmo-controls button { border: 0; background: #87e4cf; color: #0c2230; font-weight: 700; }
.pmo-controls input { color-scheme: dark; background: #172e4b; color: white; border: 1px solid #8196aa; border-radius: 6px; padding: 4px; }
.pmo-kpis, .pmo-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,220px),1fr)); gap: 14px; }
.pmo-kpi, .pmo-panel { border: 1px solid #d9e2ed; border-radius: 16px; padding: 20px; background: #fff; box-shadow: 0 5px 18px #1836580a; }
.pmo-kpi { text-align: left; border-top: 4px solid #14756d; }
.pmo-kpi.attenzione { border-top-color: #ba483a; }
.pmo-kpi[aria-pressed="true"] { background: #e2f3f0; }
.pmo-kpi strong { display: block; font-size: 2.8em; line-height: 1.08; letter-spacing: -.045em; }
.pmo-kpi span { font-weight: 650; }
.pmo-panel { min-width: 0; overflow-wrap: anywhere; }
.pmo-panel h2 { margin: 0 0 12px; font-size: 1.22em; }
.pmo-stream { border-top: 1px solid #e3e9f0; padding: 8px 0; }
.pmo-stream summary { cursor: pointer; }
.pmo-stream progress { margin: 0 10px; width: clamp(64px, 15vw, 180px); accent-color: #14756d; }
.pmo-roadmap { padding: 0; margin: 0; list-style: none; }
.pmo-roadmap li { display: flex; gap: 16px; padding: 10px; border-left: 3px solid #14756d; border-bottom: 1px solid #e3e9f0; }
.pmo-roadmap time { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.pmo-deck [aria-current="step"] { background: #163853; color: #fff; }
body.pmo-meeting .barra, body.pmo-meeting .sottobarra { display: none; }
body.pmo-meeting .pmo { font-size: clamp(16px, 1.6vw, 24px); }
.pmo-warning { border-left: 5px solid #a65b0b; }
.pmo-warning-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.pmo-warning-header h2 { margin: 0; }
.pmo-warning-header h2 span { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #fff0d8; color: #754006; }
.pmo-warning-header button { background: #fff4df; color: #623703; border-color: #dfbc83; font-weight: 700; }
.pmo-warning-list { list-style: none; padding: 0; margin: 14px 0 0; }
.pmo-warning-list li { border-top: 1px solid #e9e1d5; padding: 10px 0; font-weight: 650; }
.pmo-warning-list .meta { font-weight: 400; }
.pmo-controls .pmo-alert-button { background: #ffe0a6; color: #623703; }
.pmo-avvisi li { border-top: 1px solid #e9e1d5; padding: 10px 0; overflow-wrap: anywhere; }
.pmo-avvisi li p { margin: 4px 0 0; white-space: pre-wrap; }
.pmo-guida { grid-template-columns: repeat(auto-fit,minmax(min(100%,365px),1fr)); }
.pmo-guida p:last-child { margin-bottom: 0; }
.pmo-stream-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,340px),1fr)); gap: 14px; align-items: start; }
.pmo-stream-card summary { cursor: pointer; }
.pmo-stream-card summary strong { color: #163853; }
.pmo-stream-card summary span { display: block; margin-top: 6px; color: #42556c; font-size: .82em; }
.pmo-accesso { display: grid; justify-items: start; gap: 12px; max-width: 560px; }
.pmo-accesso p { margin: 0; }
.pmo-accesso label { display: grid; gap: 4px; }
.pmo-accesso input { padding: 8px; border: 1px solid #8196aa; border-radius: 6px; }
.pmo-accesso [role="alert"] { color: #9c3028; }
.pmo-team-voci li { display: flex; justify-content: space-between; align-items: start; gap: 8px; flex-wrap: wrap; }
.pmo-team-voci button[aria-pressed="true"] { background: #e2f3f0; border-color: #18796f; }
.pmo-deck [aria-current="page"] { background: #163853; color: #fff; }
body.pmo-meeting { background: #dfe8f3; }
body.pmo-meeting .pmo-hero { padding: clamp(20px, 3vw, 48px); }
body.pmo-meeting .pmo-deck { padding: 8px; border-radius: 12px; background: #f7faff; }
@media (max-width: 760px) { .barra { position: static; } #vista { padding: 12px 12px 36px; } .iniziale { margin: 20px 12px; } }
</style>
