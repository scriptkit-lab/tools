# seq_collaudo.conf — collaudo di 5 minuti per verificare comandi e ripristino sulla colonnina.
# Uso: sh /home/root/test/prova_schermo.sh --seq collaudo   (subito)   oppure   --tra 2 collaudo
# I dati vanno in una cartella separata, così il collaudo non entra nei riferimenti delle prove vere.
DIR=/home/root/test/collaudo
STEPS="
Riferimento;rif;60;0;0
Carica 1;carica;60;1;0
Misura 1;misura;60;0;1
Carica 2;carica;60;1;0
Misura 2;misura;60;0;1
"
# condizioni di partenza allentate: sei presente tu
MIN_UPTIME_H=0
REST_MIN=0
STABLE_MIN=0
USER_OK=
AUX_MAX=60
TEMP_MAX=60
WATCHDOG_MARGIN_MIN=5
