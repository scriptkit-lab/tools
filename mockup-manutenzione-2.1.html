<!doctype html>

<title>Manutenzione 2.1 · mockup</title>
<style>
:root{--side:#212529;--side2:#343a40;--top:#1b1e21;--bg:#f2f3f5;--card:#fff;--line:#dee2e6;--ink:#212529;--mute:#6c757d;
--blue:#007bff;--green:#28a745;--red:#dc3545;--yellow:#ffc107;--gray:#adb5bd}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#top{height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:5}
#top .brand{font-weight:700;font-size:18px;letter-spacing:.3px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700}
.bg-red{background:var(--red);color:#fff}.bg-yel{background:var(--yellow);color:#212529}.bg-grn{background:var(--green);color:#fff}.bg-gry{background:#6c757d;color:#fff}
#clock{flex:1;text-align:center;color:#ffffff99}
#wrap{display:flex;min-height:calc(100vh - 56px)}
#side{width:230px;background:var(--side);padding:8px 0;flex-shrink:0}
#side a{display:flex;align-items:center;gap:10px;color:#ffffff99;text-decoration:none;padding:12px 18px;font-size:15px}
#side a:hover{color:#fff}#side a.on{color:#fff;background:var(--side2)}
#side .sec{color:#ffffff55;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:14px 18px 4px}
#side hr{border:0;border-top:1px solid #ffffff22;margin:8px 14px}
#side .ic{width:18px;text-align:center}
#main{flex:1;padding:16px 22px;min-width:0}
.crumb{background:#e9ecef;border-radius:4px;padding:10px 14px;margin-bottom:16px;color:var(--mute)}
.crumb b{color:var(--blue);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.card>h5{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);background:#f7f7f7;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.card>.bd{padding:12px 16px}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 6px;vertical-align:middle;text-align:left}
.kv td:first-child{color:#343a40;font-size:14px}
.kv td.ind{padding-left:30px}
.lines td{border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute);font-weight:600;border-bottom:2px solid var(--line)}
.led{display:inline-block;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -2px 3px #0003,0 0 0 2px #0001;vertical-align:middle}
.led-green{background:radial-gradient(circle at 35% 35%,#7dff9a,#1e9e45)}.led-red{background:radial-gradient(circle at 35% 35%,#ff9a9a,#c21f2f)}
.led-gray{background:radial-gradient(circle at 35% 35%,#e9ecef,#8c959d)}.led-yellow{background:radial-gradient(circle at 35% 35%,#fff3a3,#d9a400)}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.prog{height:20px;background:#e9ecef;border-radius:4px;overflow:hidden}
.prog>div{height:100%;color:#fff;font-weight:700;font-size:13px;padding-left:6px;line-height:20px;background-image:linear-gradient(45deg,#ffffff26 25%,transparent 25%,transparent 50%,#ffffff26 50%,#ffffff26 75%,transparent 75%);background-size:1rem 1rem}
.btn{display:inline-block;border:1px solid transparent;padding:6px 14px;border-radius:4px;font:inherit;cursor:pointer;text-decoration:none;line-height:1.4}
.btn-p{background:var(--blue);color:#fff}.btn-s{background:#6c757d;color:#fff}.btn-d{background:var(--red);color:#fff}.btn-g{background:var(--green);color:#fff}
.btn-o{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.ctl{display:flex;align-items:center;gap:8px;margin:8px 0}.ctl label{width:150px;color:#343a40}
.flt td{border-bottom:1px solid var(--line);padding:9px 8px}
.flt tr.clk{cursor:pointer}.flt tr.clk:hover td{background:#f1f5fb}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700}
.p-GUASTO{background:#f8d7da;color:#842029}.p-ATTENZIONE{background:#fff3cd;color:#664d03}.p-OK{background:#d1e7dd;color:#0f5132}.p-INFO{background:#e2e3e5;color:#41464b}
.mute{color:var(--mute)}small{color:var(--mute)}
.note{background:#fff3cd;border:1px solid #ffe69c;border-radius:4px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.steps li{padding:8px 10px;border-radius:4px;margin-bottom:6px;background:#e9ecef;list-style:none;display:flex;justify-content:space-between;gap:8px}
.steps{padding:0;margin:0}.steps li.run{background:#cfe2ff}.steps li.pass{background:#d1e7dd}.steps li.fail{background:#f8d7da}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:8px;width:min(1100px,94vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mbody{display:grid;grid-template-columns:340px 1fr;flex:1;min-height:420px;overflow:auto}
.mleft{background:#f7f7f7;padding:16px;border-right:1px solid var(--line)}
.mright{padding:16px}
.mfoot{display:flex}.mfoot button{flex:1;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:0;cursor:pointer;color:#fff}
.part{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center}
.ph{width:90px;height:70px;border-radius:4px;background:repeating-linear-gradient(45deg,#e9ecef,#e9ecef 8px,#f8f9fa 8px,#f8f9fa 16px);display:flex;align-items:center;justify-content:center;font-size:11px;color:#6c757d;text-align:center}
.code{font-family:Consolas,monospace;font-weight:700;background:#e9ecef;padding:1px 6px;border-radius:3px}
.ev td{border-bottom:1px solid var(--line);padding:8px 6px;font-size:14px}
.sumrow{display:flex;gap:18px;margin:4px 0 14px;flex-wrap:wrap}

.man{font-size:12px;text-decoration:none;padding:1px 6px;border:1px solid #9ec5fe;border-radius:3px;background:#e7f1ff;color:#0a58ca;white-space:nowrap}

.dtab td{padding:3px 8px;border:2px solid #fff;background:#eceeef;font-size:14px}.dtab td.dk{width:24%}.dtab td.dv{width:26%}

.chk{display:inline-block;width:16px;height:16px;border:2px solid #6c757d;border-radius:3px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}

.sig{font-size:13px;background:#eef2f7;border-radius:10px;padding:0 6px}
.cbars{table-layout:fixed}.cbars td{padding:4px 6px;font-size:14px}.cb{display:flex;gap:2px;height:14px}.cbg{background:#dc3545;border-radius:0 3px 3px 0;height:14px}.cba{background:#e0a800;border-radius:0 3px 3px 0;height:14px}
.leg{display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--mute)}.leg i{display:inline-block;width:12px;height:10px;vertical-align:middle;border-radius:2px}
.smalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.chart{position:relative;border:1px solid var(--line);border-radius:4px;padding:6px 8px}.ct{display:flex;justify-content:space-between;font-size:13px;color:#343a40}.ct b{font-size:15px}.vbad{color:#842029}

.thr{stroke:#dc3545;stroke-width:1;stroke-dasharray:4 3;opacity:.7}.thl{font-size:10px;fill:#842029}.grid{stroke:#e9ecef}.axl{font-size:10px;fill:#6c757d}
.cx{stroke:#6c757d;stroke-width:1}.cxp{fill:#2a78d6;stroke:#fff;stroke-width:2}.tip{display:none;position:absolute;top:24px;background:#212529;color:#fff;font-size:12px;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap}
.ebars{width:100%;height:auto}.eb{fill:#2a78d6}
.toast{pointer-events:none;position:fixed;right:16px;bottom:16px;background:#212529;color:#fff;padding:10px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:30}
.toast.on{opacity:.95}
@media(max-width:800px){#side{width:62px}#side a span,#side .sec{display:none}.mbody{grid-template-columns:1fr}}
</style>
</head>

const DEF_NAMES={"SCHEDA AUX TESTA":"Scheda PS4GAUX (testa)","VENTOLA TESTA":"Ventola testa","DISPLAY":"Display","CAVO DISPLAY":"Cavo display",
 "LETTORE RFID":"Lettore RFID","MODEM":"Modem 4G","ANTENNA MODEM":"Antenna 4G","ANTITAMPER":"Antitamper","ALIMENTAZIONE":"Alimentazione di rete","ALIMENTATORE 24V":"Alimentatore 24 V"};
const EMPTY_CFG=()=>({names:{},labels:{},msgs:{},manuals:{},codes:{},faultParts:{}});
let CFG=EMPTY_CFG();
try{const x=JSON.parse(localStorage.getItem("manut21cfg")||"null");if(x)CFG=Object.assign(EMPTY_CFG(),x)}catch(e){}
function saveCfg(){try{localStorage.setItem("manut21cfg",JSON.stringify(CFG))}catch(e){toast("Il browser non permette di salvare: usa «Esporta»")}}
function defName(k){return DEF_NAMES[k]||(k.charAt(0)+k.slice(1).toLowerCase())}
function nm(k){return k?(CFG.names[k]||defName(k)):""}
function lbl(v){return CFG.labels[v]||v}
function part(k){const b=PARTS[k];const code=CFG.codes[k]||(b&&b.code);if(!code)return null;return {code,desc:(b&&b.desc)||""}}
function man(alarm){const u=alarm&&CFG.manuals[alarm];if(!u)return"";return `<a class="man" href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">📖 Manuale</a>`}
function faultCode(alarm,comp){return (CFG.faultParts&&CFG.faultParts[alarm])||part(comp)?.code||""}
function codeDesc(code){for(const k of compKeys()){if(part(k)?.code===code)return part(k).desc||nm(k)}return ""}
function fx(alarm,comp){const c=faultCode(alarm,comp);return (c?`<span class="spc" title="Ricambio da usare per ripristinare">🔧 ${esc(c)}</span> `:"")+man(alarm)}
function compKeys(){const ks=new Set();RULES.forEach(r=>{if(r[7]==="S"){ks.add(r[4].replace("{n}","0"));ks.add(r[4].replace("{n}","1"))}else ks.add(r[4])});
  Object.keys(PARTS).forEach(k=>ks.add(k));Object.values(PROCS).forEach(p=>p.onfield.forEach(([k])=>{if(k.includes("{n}")){ks.add(k.replace("{n}","0"));ks.add(k.replace("{n}","1"))}else ks.add(k)}));return [...ks].sort()}
function allVars(){return Object.keys(STATIONS[0].v)}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const m=String(v).match(/-?\d+(?:[.,]\d+)?/);return m?parseFloat(m[0].replace(",",".")):null};
const LOG=[];let MAINT=null;

STATIONS.forEach((s,i)=>{s.cuid="N.22XP22T3QQ1AN0"+(1096+i*37);s.v={};BASE.forEach(([k,v])=>s.v[k]=v);
  for(const n of "01")SOCK.forEach(([k,v])=>s.v[k.replace("{n}",n)]=v);s.v.CUID=s.cuid;Object.assign(s.v,s.over);s.fixed={};
  s.energy=[171605+i*913,127164+i*511];s.chargeT=[0,0];if(s.charge){startCharge(s,0,true)}});

function startCharge(s,n,silent){s.v[`SOCKET ${n} POWER SWITCH`]="CLOSE";s.v[`EVSE TASK ${n} STATUS`]="CHARGING";s.v[`SOCKET ${n} PROXIMITY`]="220 Ohm";
  s.v[`SOCKET TYPE ${n}`]="TYPE2 32A";s.v[`SOCKET ${n} CONTROL PILOT`]="6.02 v.";s.v[`EVSE TASK ${n} SOCKET IN USE`]="SOCKET "+n;s.chargeT[n]=Date.now();
  if(!silent)toast(`Ricarica simulata avviata sulla presa ${n}`)}
function stopCharge(s,n){s.v[`SOCKET ${n} POWER SWITCH`]="OPEN";s.v[`EVSE TASK ${n} STATUS`]="IDLE";s.v[`SOCKET ${n} PROXIMITY`]="65535 Ohm";s.v[`SOCKET TYPE ${n}`]="UNKNOWN";
  s.v[`SOCKET ${n} CONTROL PILOT`]="11.90 v.";s.v[`EVSE TASK ${n} SOCKET IN USE`]="NONE";s.v[`EVSE TASK ${n} END CHARGE RESULT`]="EV_DISCONNECTED";s.chargeT[n]=0;
  ["METER {n} ISTANT POWER SUPPLY","METER {n} CURRENT L1","EVSE {n} CHARGE CURRENT","EVSE {n} MAX CURRENT"].forEach(k=>s.v[k.replace("{n}",n)]=k.includes("POWER")?"0 w":"0.00 A");toast(`Ricarica fermata sulla presa ${n}`)}

/* simulazione viva: piccole variazioni e ricariche in corso */
function tick(){const t=Date.now()/1000;
  STATIONS.forEach((s,i)=>{const j=(a,b)=>(a+b*Math.sin(t/17+i)).toFixed(2);
    s.v["TEMPERATURE"]=j(41.5,0.6)+" c";s.v["CPU-TEMPERATURE"]=(s.id==="rm04"?j(78.4,0.4):j(61.9,1.2))+" c";s.v["AUX TEMPERATURE"]=j(36,0.8)+" C";
    if(!s.over["MAIN POWER VOLTAGE"])s.v["MAIN POWER VOLTAGE"]=j(24.96,0.05)+" v";
    if(s.v["MODEM STATUS"]==="CONNECTED"){const c=Math.round(22+3*Math.sin(t/40+i));s.v["MODEM SIGNAL QUALITY"]=`CSQ=${c} PWR=${-113+2*c}dbm`}
    s.v["AUX LUX"]=String(Math.round(260+40*Math.sin(t/30+i)));
    for(const n of [0,1]){if(s.v[`EVSE TASK ${n} STATUS`]==="CHARGING"){const I=(31.2+0.5*Math.sin(t/7+n)).toFixed(2),P=Math.round(3*230*I);
      s.energy[n]+=P*2/3600;s.v[`METER ${n} CURRENT L1`]=I+" A";s.v[`EVSE ${n} CHARGE CURRENT`]=I+" A";s.v[`EVSE ${n} MAX CURRENT`]="32.00 A";
      s.v[`METER ${n} ISTANT POWER SUPPLY`]=P+" w";s.v[`METER ${n} SESSION ACTIVE ENERGY`]=Math.round((Date.now()-s.chargeT[n])/1000*P/3600)+" wh"}
      s.v[`METER ${n} TOTAL ACTIVE ENERGY`]=Math.round(s.energy[n])+" wh"}});
  const d=new Date(),z=x=>String(x).padStart(2,"0"),dt=`${z(d.getDate())}.${z(d.getMonth()+1)}.${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
  STATIONS.forEach(s=>{s.v["DATE/TIME LINUX"]=dt;for(const n of [0,1]){const c=s.v[`EVSE TASK ${n} STATUS`]==="CHARGING";s.v[`SOCKET ${n} PWM STATUS`]=c?"ON":"";s.v[`EVSE ${n} PHASE NUMBER`]=c?"3":"0"}});
  $("#clock").textContent=d.toLocaleString("it-IT");render(true)}

/* =================================================================== regole */
function check(op,val,ref){if(val==null)return false;const sv=String(val).toUpperCase(),sr=String(ref).toUpperCase();
  if(op==="!=")return sv!==sr;if(op==="=")return sv===sr;if(op==="contiene")return sv.includes(sr);
  if(op==="fuori"){const[lo,hi]=ref.split("|").map(Number),n=num(val);return n!=null&&(n<lo||n>hi)}return false}
function evaluate(s){const out=[];
  RULES.forEach(([v,op,ref,sev,comp,msg,alarm,scope])=>{for(const n of (scope==="S"?["0","1"]:[""])){
    const var_=v.replace("{n}",n),c=comp.replace("{n}",n);let hit;
    if(op==="contattore")hit=s.v[var_]==="CLOSE"&&s.v[`EVSE TASK ${n} STATUS`]!=="CHARGING";else hit=check(op,s.v[var_],ref);
    if(hit&&!s.fixed[c])out.push({sev,comp:c,msg:(scope==="S"?`Presa ${n}: `:"")+(CFG.msgs[alarm]||msg)+` (${s.v[var_]})`,var:var_,alarm,scope:scope==="S"?"SCK"+n:"GLOBAL",n})}});
  const ord={GUASTO:2,ATTENZIONE:1};out.sort((a,b)=>(ord[b.sev]||0)-(ord[a.sev]||0));
  return {esito:out.length?out[0].sev:"OK",an:out}}

   +item("diag","▤","Pagina diagnostica",1)+item("dashboard","◷","Dashboard",1)+item("andamento","📈","Andamento",1)+item("sistema","⚙","System",1)+item("sx","⚡","Left Socket",1)+item("dx","⚡","Right Socket",1)

/* fillTable come nella JPWeb */
function led(c,bl){return `<span class="led led-${c}${bl?" blink":""}"></span>`}
function kv(keys,s){return `<table class="kv">${keys.filter(k=>k in s.v).map(k=>{const v=s.v[k];let cell=esc(v);
  if(/STATUS$|CONNECTION$/.test(k)&&!/USER|EVSE/.test(k))cell=`${led(v==="CONNECTED"?"green":v==="DISABLED"?"gray":"red")} <small>${esc(v)}</small>`;
  else if(/POWER BREAKER|DIFF.BREAKER/.test(k))cell=`${led(v==="CLOSE"?"green":"red")} <small>${esc(v)}</small>`;
  else if(/POWER SWITCH/.test(k))cell=`${led(v==="CLOSE"?"green":"gray")} <small>${esc(v)}</small>`;
  else if(/^AUX (RFID|FAN|HEATER|PANEL) POWER$/.test(k))cell=`${led(v==="ON"?"green":"gray")} <small>${esc(v)}</small>`;
  else if(k==="AUX FAULT")cell=`${led(v==="00000000"?"green":"red")} <small>${esc(v)}</small>`;
  else if(k==="ANTITAMPER OK STATUS")cell=`${led(v==="CLOSED"?"green":"red")} <small>${esc(v)}</small>`;
  else if(k==="MODEM SIGNAL QUALITY"){const c=num(v)||0,p=c===99?0:100*c/31,col=c>22?"#28a745":c>12?"#ffc107":"#dc3545";cell=`<div class="prog"><div style="width:${Math.max(p,8)}%;background-color:${col}">${c}</div></div>`}
  else if(/CHARGE CURRENT|CURRENT L1/.test(k)){const c=num(v)||0;cell=`<div class="prog"><div style="width:${100*c/32}%;background-color:${c>16?"#28a745":c>6?"#ffc107":"#dc3545"}">${esc(v)}</div></div>`}
  return `<tr><td>${esc(lbl(k))}</td><td>${cell}</td></tr>`}).join("")}</table>`}

const fmtT=t=>{const d=new Date(t);return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})};
function andamento(s){const p=series(s),sg=signals(s),sv=new Set(sg.map(x=>x.var));setTimeout(bindCharts,0);
  const vars=Object.keys(LIMITS).filter(k=>p.some(x=>k in x.v)).sort((a,b)=>(sv.has(b)?1:0)-(sv.has(a)?1:0));
  return crumb("Andamento")+`<div class="card"><h5>🔮 Segnali di questa colonnina</h5><div class="bd">${sigList(sg)}</div></div>
  <div class="card"><h5>📈 Andamento <small>${p.length} letture dal ${fmtT(p[0].t)} · linee tratteggiate = soglie delle regole</small></h5><div class="bd"><div class="smalls">${vars.map(k=>lineChart(k,p.filter(x=>k in x.v).map(x=>({t:x.t,y:x.v[k]})),LIMITS[k])).join("")}</div></div></div>
  <div class="cards"><div class="card"><h5>⚡ Energia erogata al giorno</h5><div class="bd">${energyBars(p)}</div></div><div class="card"><h5>🕑 Cronologia</h5><div class="bd">${timeline(p)}</div></div></div>`}
function lineChart(title,pts,lim){const W=360,H=150,L=40,Rr=10,T=12,B=22;const ts=pts.map(p=>p.t),ys=pts.map(p=>p.y);
  let lo=Math.min(...ys),hi=Math.max(...ys);const[l0,h0]=lim||[];[l0,h0].forEach(x=>{if(x!=null&&Math.abs(x-(lo+hi)/2)<(hi-lo+1)*3){lo=Math.min(lo,x);hi=Math.max(hi,x)}});
  if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;const t0=Math.min(...ts),t1=Math.max(...ts);
  const X=t=>L+(W-L-Rr)*(t-t0)/((t1-t0)||1),Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));const path=pts.map((p,i)=>`${i?"L":"M"}${X(ts[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const thr=[[l0,"min"],[h0,"max"]].filter(([x])=>x!=null&&x>=lo&&x<=hi).map(([x,n])=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(x)}" y2="${Y(x)}" class="thr"/><text x="${W-Rr-2}" y="${Y(x)-3}" text-anchor="end" class="thl">${n} ${x}</text>`).join("");
  const ticks=[lo+pad,(lo+hi)/2,hi-pad].map(v=>`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end" class="axl">${+v.toFixed(2)}</text><line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/>`).join("");
  const last=pts[pts.length-1],out=(l0!=null&&last.y<l0)||(h0!=null&&last.y>h0),data=esc(JSON.stringify(pts.map((p,i)=>[X(ts[i]),Y(p.y),fmtT(p.t),+(+p.y).toFixed(2)])));
  return `<div class="chart"><div class="ct"><span>${esc(lbl(title))}</span><b class="${out?"vbad":""}">${+(+last.y).toFixed(2)}</b></div><svg viewBox="0 0 ${W} ${H}" data-pts="${data}"><g>${ticks}${thr}</g><path d="${path}" class="ln"/>
   <circle cx="${X(ts[ts.length-1])}" cy="${Y(last.y)}" r="4" class="lp"/><text x="${L}" y="${H-5}" class="axl">${fmtT(pts[0].t).split(" ")[0]}</text><text x="${W-Rr}" y="${H-5}" text-anchor="end" class="axl">oggi</text>
   <line class="cx" y1="${T}" y2="${H-B}" x1="-10" x2="-10"/><circle class="cxp" r="4" cx="-10" cy="-10"/><rect x="${L}" y="0" width="${W-L-Rr}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>`}
function bindCharts(){$$(".chart svg").forEach(svg=>{const pts=JSON.parse(svg.dataset.pts),tip=svg.parentNode.querySelector(".tip"),cx=svg.querySelector(".cx"),cp=svg.querySelector(".cxp");
  svg.querySelector(".hit").onmousemove=e=>{const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)*360/b.width;let best=pts[0];pts.forEach(p=>{if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p});
    cx.setAttribute("x1",best[0]);cx.setAttribute("x2",best[0]);cp.setAttribute("cx",best[0]);cp.setAttribute("cy",best[1]);tip.style.display="block";tip.innerHTML=`<b>${best[3]}</b> · ${best[2]}`;tip.style.left=Math.min(b.width-150,best[0]*b.width/360)+"px"};
  svg.querySelector(".hit").onmouseleave=()=>{tip.style.display="none";cx.setAttribute("x1",-10);cx.setAttribute("x2",-10);cp.setAttribute("cx",-10)}})}
function energyBars(p){const day={};p.forEach(x=>{const e=ENERGY.reduce((q,k)=>q+(x.v[k]||0),0);const k=new Date(x.t).toISOString().slice(0,10);day[k]=Math.max(day[k]||0,e)});
  const ks=Object.keys(day).sort(),vals=ks.map((k,i)=>i?Math.max(0,(day[k]-day[ks[i-1]])/1000):0).slice(1),kk=ks.slice(1);const mx=Math.max(1,...vals),W=360,H=130,bw=(W-10)/Math.max(1,kk.length);
  return `<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto">${vals.map((v,i)=>`<rect x="${5+i*bw+1}" y="${H-H*v/mx}" width="${Math.max(1,bw-2)}" height="${Math.max(v?2:0,H*v/mx)}" rx="2" fill="#2a78d6"><title>${kk[i].split("-").reverse().join("/")}: ${v.toFixed(1)} kWh</title></rect>`).join("")}
   <text x="5" y="${H+14}" class="axl">${(kk[0]||"").split("-").reverse().join("/")}</text><text x="${W-5}" y="${H+14}" text-anchor="end" class="axl">oggi</text></svg><small>Media ${(vals.reduce((a,b)=>a+b,0)/Math.max(1,vals.length)).toFixed(1)} kWh/giorno</small>`}
function timeline(p){const ev=[];for(let i=1;i<p.length;i++){const a=p[i-1].guasti,b=p[i].guasti,add=[...b].filter(x=>!a.has(x)),rem=[...a].filter(x=>!b.has(x));
    if(add.length||rem.length||p[i].esito!==p[i-1].esito)ev.push({t:p[i].t,da:p[i-1].esito,a:p[i].esito,add,rem})}
  const name=g=>{const[k,n]=g.split("|");return lbl(k)+(n?` (presa ${n})`:"")};
  return ev.length?`<table class="lines">${ev.reverse().slice(0,20).map(e=>`<tr><td style="width:100px"><small>${fmtT(e.t)}</small></td><td>${e.da!==e.a?`<span class="pill p-${e.da}">${e.da}</span> → <span class="pill p-${e.a}">${e.a}</span><br>`:""}${e.add.map(g=>`<div>🔴 compare: ${esc(name(g))}</div>`).join("")}${e.rem.map(g=>`<div>🟢 rientra: ${esc(name(g))}</div>`).join("")}</td></tr>`).join("")}</table>`:'<span class="mute">Nessun cambiamento nello storico.</span>'}

function kit(rs){const need={},spare={};
  rs.forEach(r=>r.an.forEach(a=>{const codes=faultCode(a.alarm,a.comp).split(/[,;]/).map(x=>x.trim()).filter(Boolean);
    const target=a.sev==="GUASTO"?need:spare;
    codes.forEach(c=>{const x=target[c]=target[c]||{code:c,desc:codeDesc(c)||"(descrizione dal catalogo)",qty:0,per:[]};x.qty++;x.per.push(`${r.s.nome}: ${a.msg}`)});
    const k=procKey(a.comp);if(k)PROCS[k].onfield.forEach(([pp])=>{const comp=pp.replace("{n}",a.n||"0"),c=part(comp)?.code;
      if(c&&!codes.includes(c)&&!need[c]){const x=spare[c]=spare[c]||{code:c,desc:codeDesc(c)||nm(comp),qty:1,per:[]};if(!x.per.includes(`${r.s.nome}: eventuale`))x.per.push(`${r.s.nome}: eventuale`)}})}));
  Object.keys(need).forEach(c=>delete spare[c]);return {need:Object.values(need),spare:Object.values(spare)}}
function kitCsv(k){const rows=[["tipo","codice","descrizione","quantita","per"]].concat(k.need.map(x=>["necessario",x.code,x.desc,x.qty,x.per.join(" | ")]),k.spare.map(x=>["di scorta",x.code,x.desc,x.qty,x.per.join(" | ")]));
  return "﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n")}

  $$("[data-prova]").forEach(b=>b.onclick=()=>{const c=b.dataset.prova,o=$("#pr-"+c);o.innerHTML=led("yellow",1);setTimeout(()=>{const ok=!(c==="07"&&s.v["AUX FAN POWER"]==="OFF");
    o.innerHTML=led(ok?"green":"red");$("#provalog").innerHTML=`<div>${new Date().toLocaleTimeString("it-IT")} · comando ${c}: <b>${ok?"PASS":"FAIL"}</b>${c==="06"?` · 12V ${esc(s.v["AUX SUPPLY 12V"])}, 5V ${esc(s.v["AUX SUPPLY 5V"])}, T ${esc(s.v["AUX TEMPERATURE"])}`:""}${c==="07"?" · controllo termico ripristinato (TempContEn=1)":""}</div>`+($("#provalog").innerHTML.includes("Nessuna")?"":$("#provalog").innerHTML)},1500)});
  $("#startm")&&($("#startm").onclick=()=>openMaint(s,$("#selan").value,$("#seltype").value));
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),2600)}

const[p0,s0]=location.hash.slice(1).split("/");tick();buildHistory();R={page:p0||"cruscotto",st:s0||null};render();setInterval(tick,2000);tick();
</script>
