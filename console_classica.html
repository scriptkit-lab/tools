<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manutenzione 2.1</title>
<style>
:root{--side:#212529;--side2:#343a40;--top:#1b1e21;--bg:#f2f3f5;--card:#fff;--line:#dee2e6;--ink:#212529;--mute:#6c757d;--blue:#007bff;--red:#dc3545}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#top{height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:5}
#top .brand{font-weight:700;font-size:18px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700}
.bg-red{background:var(--red);color:#fff}.bg-gry{background:#6c757d;color:#fff}.bg-grn{background:#28a745;color:#fff}.bg-yel{background:#ffc107;color:#212529}
#clock{flex:1;text-align:center;color:#ffffff99}
#wrap{display:flex;min-height:calc(100vh - 56px)}
#side{width:240px;background:var(--side);padding:8px 0;flex-shrink:0}
#side a{display:flex;align-items:center;gap:10px;color:#ffffff99;text-decoration:none;padding:11px 18px}
#side a:hover{color:#fff}#side a.on{color:#fff;background:var(--side2)}
#side .sec{color:#ffffff55;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:14px 18px 4px}
#side hr{border:0;border-top:1px solid #ffffff22;margin:8px 14px}#side .ic{width:18px;text-align:center}
#main{flex:1;padding:16px 22px;min-width:0}
.crumb{background:#e9ecef;border-radius:4px;padding:10px 14px;margin-bottom:16px;color:var(--mute);display:flex;align-items:center;gap:10px}
.crumb b{color:var(--blue);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}.cards .card{margin-bottom:0}
.card>h5{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);background:#f7f7f7;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>.bd{padding:12px 16px}
table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;vertical-align:middle;text-align:left}
.kv td:first-child{color:#343a40;font-size:14px;width:52%}
.lines td{border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute);font-weight:600;border-bottom:2px solid var(--line)}
.led{display:inline-block;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -2px 3px #0003,0 0 0 2px #0001;vertical-align:middle}
.led-green{background:radial-gradient(circle at 35% 35%,#7dff9a,#1e9e45)}.led-red{background:radial-gradient(circle at 35% 35%,#ff9a9a,#c21f2f)}
.led-gray{background:radial-gradient(circle at 35% 35%,#e9ecef,#8c959d)}.led-yellow{background:radial-gradient(circle at 35% 35%,#fff3a3,#d9a400)}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.prog{height:20px;background:#e9ecef;border-radius:4px;overflow:hidden}
.prog>div{height:100%;color:#fff;font-weight:700;font-size:13px;padding-left:6px;line-height:20px}
.btn{display:inline-block;border:1px solid transparent;padding:6px 14px;border-radius:4px;font:inherit;cursor:pointer;text-decoration:none;line-height:1.4}
.btn-p{background:var(--blue);color:#fff}.btn-d{background:var(--red);color:#fff}.btn-g{background:#28a745;color:#fff}.btn-o{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-sm{padding:2px 8px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
.ctl{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}.ctl>label:first-child{width:150px;color:#343a40}
.flt td{border-bottom:1px solid var(--line);padding:9px 8px}.flt tr.clk{cursor:pointer}.flt tr.clk:hover td{background:#f1f5fb}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-GUASTO{background:#f8d7da;color:#842029}.p-ATTENZIONE{background:#fff3cd;color:#664d03}.p-OK{background:#d1e7dd;color:#0f5132}.p-INFO,.p-ATTESA{background:#e2e3e5;color:#41464b}
.mute{color:var(--mute)}small{color:var(--mute)}
.note{background:#fff3cd;border:1px solid #ffe69c;border-radius:4px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.steps{padding:0;margin:0}.steps li{padding:8px 10px;border-radius:4px;margin-bottom:6px;background:#e9ecef;list-style:none;display:flex;justify-content:space-between;gap:8px}
.steps li.run{background:#cfe2ff}.steps li.pass{background:#d1e7dd}.steps li.fail{background:#f8d7da}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20}.modal.on{display:flex}
.mbox{background:#fff;border-radius:8px;width:min(1100px,94vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mbody{display:grid;grid-template-columns:360px 1fr;flex:1;min-height:420px;overflow:auto}
.mleft{background:#f7f7f7;padding:16px;border-right:1px solid var(--line)}.mright{padding:16px}
.mfoot{display:flex}.mfoot button{flex:1;padding:14px;font-size:17px;font-weight:600;border:0;cursor:pointer;color:#fff}
.part{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
.code{font-family:Consolas,monospace;font-weight:700;background:#e9ecef;padding:1px 6px;border-radius:3px}
.spc{font-size:12px;padding:1px 6px;border:1px solid #ffda6a;border-radius:3px;background:#fff8e1;color:#7a5b00;font-family:Consolas,monospace;font-weight:700;white-space:nowrap}
.man{font-size:12px;text-decoration:none;padding:1px 6px;border:1px solid #9ec5fe;border-radius:3px;background:#e7f1ff;color:#0a58ca;white-space:nowrap}
.sumrow{display:flex;gap:18px;margin:4px 0 14px;flex-wrap:wrap;align-items:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}.bar>div{height:100%;background:var(--blue);width:0;transition:width .3s}
.dtab td{padding:3px 8px;border:2px solid #fff;background:#eceeef;font-size:14px}.dtab th{background:#343a40;color:#fff;text-align:center;padding:6px;border:2px solid #fff}
.dtab td.dk{width:24%}.dtab td.dv{width:26%}.dv-GUASTO{background:#f8d7da!important;color:#842029;font-weight:700}.dv-ATTENZIONE{background:#fff3cd!important;color:#664d03;font-weight:700}
.cfgt input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font:inherit;font-size:13px}.cfgt td{padding:4px;border-bottom:1px solid var(--line);font-size:13px}
.edit input{width:100%;padding:4px;border:1px solid var(--line);border-radius:4px;font:inherit}
.chk{display:inline-block;width:16px;height:16px;border:2px solid #6c757d;border-radius:3px}
.empty{padding:30px;text-align:center;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-left:5px solid #2a78d6;border-radius:4px;padding:10px 14px}.kpi-ok{border-left-color:#28a745}.kpi-bad{border-left-color:#dc3545}.kpi-warn{border-left-color:#e0a800}
.kl{font-size:13px;color:var(--mute)}.kv2{font-size:28px;font-weight:700;line-height:1.2}.kv2 small{font-size:15px;color:var(--mute);font-weight:400}.ks{font-size:12px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-left:6px solid #adb5bd;border-radius:4px;padding:8px 10px;cursor:pointer;background:#fff;min-height:108px;display:flex;flex-direction:column;gap:2px}
.tile:hover{box-shadow:0 2px 8px #0002}.t-GUASTO{border-left-color:#dc3545;background:#fff8f8}.t-ATTENZIONE{border-left-color:#e0a800;background:#fffdf4}.t-OK{border-left-color:#28a745}
.tt{display:flex;justify-content:space-between;gap:6px;align-items:center}.tm{font-size:13px;flex:1}.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sig{font-size:13px;background:#eef2f7;border-radius:10px;padding:0 6px}
.cbars{table-layout:fixed}.cbars td{padding:4px 6px;font-size:14px}.cb{display:flex;gap:2px;height:14px}.cbg{background:#dc3545;border-radius:0 3px 3px 0;height:14px}.cba{background:#e0a800;border-radius:0 3px 3px 0;height:14px}
.leg{display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--mute)}.leg i{display:inline-block;width:12px;height:10px;vertical-align:middle;border-radius:2px}
.smalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.chart{position:relative;border:1px solid var(--line);border-radius:4px;padding:6px 8px}.ct{display:flex;justify-content:space-between;font-size:13px;color:#343a40}.ct b{font-size:15px}.vbad{color:#842029}
.chart svg{width:100%;height:auto;display:block}.ln{fill:none;stroke:#2a78d6;stroke-width:2;stroke-linejoin:round}.lp{fill:#2a78d6;stroke:#fff;stroke-width:2}
.thr{stroke:#dc3545;stroke-width:1;stroke-dasharray:4 3;opacity:.7}.thl{font-size:10px;fill:#842029}.grid{stroke:#e9ecef}.axl{font-size:10px;fill:#6c757d}
.cx{stroke:#6c757d;stroke-width:1}.cxp{fill:#2a78d6;stroke:#fff;stroke-width:2}.tip{display:none;position:absolute;top:24px;background:#212529;color:#fff;font-size:12px;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap}
.ebars{width:100%;height:auto}.eb{fill:#2a78d6}
.toast{pointer-events:none;position:fixed;right:16px;bottom:16px;background:#212529;color:#fff;padding:10px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:30;max-width:520px}.toast.on{opacity:.95}
select,input[type=text],input[type=password],input[type=number]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:4px}
@media print{#top,#side,.noprint,.crumb,.note,.toast{display:none!important}#main{padding:0}.card{break-inside:avoid;border:0}body{background:#fff}}
@media(max-width:800px){#side{width:62px}#side a span,#side .sec,#stselbox{display:none}.mbody{grid-template-columns:1fr}}
tr.warn td{background:#fff8e1}details{border:1px solid #dee2e6;border-radius:6px;margin:8px 0;padding:6px 10px}details summary{cursor:pointer;padding:4px 0}
</style>
</head>
<body>
<div id="top"><span class="brand">Manutenzione 2.1</span><span class="badge bg-gry">SOLA LETTURA</span><span id="sshb"></span>
  <span id="clock"></span><small style="color:#ffffff88" id="ver"></small></div>
<div id="wrap"><nav id="side"></nav><main id="main"><div class="empty">Caricamento…</div></main></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const m=String(v).match(/-?\d+(?:[.,]\d+)?/);return m?parseFloat(m[0].replace(",",".")):null};
let S=null,RES={},JOB=null,KIT=null,STAMP=null,SEL=new Set(),R={page:"cruscotto",st:null},MAINT=null,AUTO=false,AUTOT=null,HL=true,CFGF="";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),3500)}
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
  const j=await r.json();if(!r.ok)throw new Error(j.errore||r.status);return j}

/* ---------------------------------------------------------------- nomi, etichette, ricambi, manuali */
const CFG=()=>S.config;
function defName(k){return k?k.charAt(0)+k.slice(1).toLowerCase():""}
function nm(k){return k?(CFG().names[k]||defName(k)):""}
function lbl(v){return CFG().labels[v]||v}
function partOf(comp){const r=(S.ricambi||[]).find(x=>(x.componente||"").toUpperCase()===(comp||"").toUpperCase());return r&&r.codice?{code:r.codice,desc:r.descrizione||""}:null}
function man(url){return url?`<a class="man noprint" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">📖 Manuale</a>`:""}
function fx(a){return (a.ricambio?`<span class="spc" title="Ricambio da usare per ripristinare">🔧 ${esc(a.ricambio)}</span> `:"")+man(a.manuale)}
function procKey(comp){if(!comp)return [null,""];if(S.procedure[comp])return [comp,""];const m=comp.match(/^(.*) PRESA ([01])$/);
  if(m&&S.procedure[m[1]+" PRESA {n}"])return [m[1]+" PRESA {n}",m[2]];return [null,""]}

/* ---------------------------------------------------------------- avvio */
async function loadState(){S=await api("/api/stato");$("#ver").textContent="v"+S.versione;
  const i=S.impostazioni;$("#sshb").innerHTML=i.ssh_attivo?(S.paramiko?(!i.senza_password?'<span class="badge bg-grn">SSH</span>':`<span class="badge bg-yel">SSH: ${i.senza_password} senza password</span>`):'<span class="badge bg-yel">solo pagina di stato</span>'):'';
  if(!SEL.size)S.colonnine.forEach(c=>SEL.add(c.id));if(!R.st&&S.colonnine[0])R.st=S.colonnine[0].id}
function stName(id){const c=S.colonnine.find(x=>x.id===id);return c?(c.nome||c.ip):(RES[id]?.nome||id)}

/* ---------------------------------------------------------------- navigazione */
function go(page,st){R={page,st:st??R.st};location.hash=page+(R.st?"/"+encodeURIComponent(R.st):"");render()}
window.onhashchange=()=>{const[p,s]=location.hash.slice(1).split("/");const st=s?decodeURIComponent(s):R.st;if(p!==R.page||st!==R.st){R={page:p||"cruscotto",st};render()}};
function side(){const item=(p,ic,t)=>`<a href="#" data-p="${p}" class="${R.page===p?"on":""}"><span class="ic">${ic}</span><span>${t}</span></a>`;
  const opts=Object.values(RES).filter(r=>r.id.startsWith("file:")).map(r=>({id:r.id,nome:r.nome})).concat(S.colonnine.map(c=>({id:c.id,nome:c.nome||c.ip})));
  $("#side").innerHTML=item("cruscotto","◉","Cruscotto")+item("flotta","▦","Flotta")+item("report","☰","Report di flotta")+item("registro","📒","Registro manutenzione")
   +`<hr><div class="sec">Colonnina</div><div style="padding:0 14px 6px" id="stselbox"><select id="stsel" style="width:100%;background:#343a40;color:#fff;border-color:#495057">${opts.map(x=>`<option value="${esc(x.id)}" ${x.id===R.st?"selected":""}>${esc(x.nome)}${RES[x.id]?" · "+RES[x.id].esito:""}</option>`).join("")||"<option>nessuna</option>"}</select></div>`
   +item("diag","▤","Pagina diagnostica")+item("dashboard","◷","Dashboard")+item("andamento","📈","Andamento")+item("sistema","⚙","System")+item("conf","🧾","Configurazione")+item("sx","⚡","Left Socket")+item("dx","⚡","Right Socket")
   +item("alarms","🔔","Alarms")+item("prove","♥","Prove AUX")+item("maint","🔧","Maintenance")
   +`<hr>`+item("cfg","✎","Nomi e manuali")+item("imp","⚙","Impostazioni");
  $$("#side a[data-p]").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.p)});
  $("#stsel").onchange=e=>{const pg=["cruscotto","flotta","report","registro","cfg","imp"].includes(R.page)?"diag":R.page;go(pg,e.target.value)}}
const STPAGES=["diag","dashboard","andamento","sistema","conf","sx","dx","alarms","prove","maint"];
function render(){if(!S)return;side();const r=RES[R.st];
  const P={cruscotto,andamento,flotta,report,registro,diag:diagPage,dashboard,sistema,conf:confPage,sx:()=>socket(0),dx:()=>socket(1),alarms,prove,maint,cfg:cfgPage,imp:impPage}[R.page]||cruscotto;
  $("#main").innerHTML=STPAGES.includes(R.page)&&!r?crumb(pageTitle())+noData():P(r);bind();setAuto()}
function pageTitle(){return {andamento:"Andamento",diag:"Pagina diagnostica",dashboard:"Dashboard",sistema:"System",conf:"Configurazione",sx:"Left Socket",dx:"Right Socket",alarms:"Alarms",prove:"Prove AUX",maint:"Maintenance"}[R.page]||""}
function crumb(t){const st=STPAGES.includes(R.page);const r=RES[R.st];
  return `<div class="crumb"><span><b>Home</b> / ${st?esc(stName(R.st))+" / ":""}${t}</span>${st&&r?`<span class="pill p-${r.esito}">${r.esito}</span><small>${esc(r.ip)} · CUID ${esc(r.cuid||"-")} · letta alle ${esc(r.ora||"")}</small>`:""}
   <span style="flex:1"></span>${st&&!String(R.st).startsWith("file:")?`<label class="noprint" style="font-size:13px"><input type="checkbox" id="auto" ${AUTO?"checked":""}> aggiorna ogni ${S.impostazioni.aggiorna_s||10} s</label><button class="btn btn-o btn-sm noprint" id="readnow">↻ Leggi ora</button>`:""}</div>`}
function noData(){return `<div class="card"><div class="bd empty">Nessuna lettura per questa colonnina.<br><br><button class="btn btn-p" id="readnow2">↻ Leggi ora</button></div></div>`}
async function readOne(id){try{const r=await api("/api/diagnosi_una",{id});RES[id]=r;if(R.page!=="andamento")render()}catch(e){toast(e.message)}}
function setAuto(){clearInterval(AUTOT);if(AUTO&&STPAGES.includes(R.page)&&!MAINT&&!String(R.st).startsWith("file:"))AUTOT=setInterval(()=>{if(!MAINT)readOne(R.st)},(S.impostazioni.aggiorna_s||10)*1000)}

/* ---------------------------------------------------------------- tabelle stile JPWeb */
function led(c,bl){return `<span class="led led-${c}${bl?" blink":""}"></span>`}
function kv(keys,r){const v=r.valori||{},mk=r.segni||{};return `<table class="kv">${keys.filter(k=>k in v).map(k=>{const x=v[k];let cell=esc(x);
  if(/STATUS$|CONNECTION$/.test(k)&&!/USER|EVSE|PWM/.test(k))cell=`${led(x==="CONNECTED"?"green":x==="DISABLED"?"gray":"red")} <small>${esc(x)}</small>`;
  else if(/POWER BREAKER|DIFF.BREAKER/.test(k))cell=`${led(x==="CLOSE"?"green":"red")} <small>${esc(x)}</small>`;
  else if(/POWER SWITCH/.test(k))cell=`${led(x==="CLOSE"?"green":"gray")} <small>${esc(x)}</small>`;
  else if(/^AUX (RFID|FAN|HEATER|PANEL) POWER$/.test(k))cell=`${led(x==="ON"?"green":"gray")} <small>${esc(x)}</small>`;
  else if(k==="AUX FAULT")cell=`${led(x==="00000000"?"green":"red")} <small>${esc(x)}</small>`;
  else if(k==="ANTITAMPER OK STATUS")cell=`${led(x==="CLOSED"?"green":"red")} <small>${esc(x)}</small>`;
  else if(k==="AC POWER")cell=`${led(x==="ONLINE"?"green":"red")} <small>${esc(x)}</small>`;
  else if(k==="MODEM SIGNAL QUALITY"){const c=num(x)||0,p=c===99?0:100*c/31,col=c>22?"#28a745":c>12?"#ffc107":"#dc3545";cell=`<div class="prog"><div style="width:${Math.max(p,8)}%;background:${col}">${esc(x)}</div></div>`}
  else if(/CHARGE CURRENT|CURRENT L1/.test(k)){const c=num(x)||0;cell=`<div class="prog"><div style="width:${Math.max(100*c/32,c?8:0)}%;background:${c>16?"#28a745":c>6?"#ffc107":"#dc3545"}">${esc(x)}</div></div>`}
  else if(mk[k])cell=`<b style="color:${mk[k]==="GUASTO"?"#842029":"#664d03"}">${esc(x)}</b>`;
  return `<tr><td>${esc(lbl(k))}</td><td>${cell}</td></tr>`}).join("")}</table>`}
function card(t,body,ic=""){return `<div class="card"><h5>${ic} ${t}</h5><div class="bd">${body}</div></div>`}
function anList(r){return r.anomalie.length?`<table class="lines">${r.anomalie.map(a=>`<tr><td style="width:110px"><span class="pill p-${a.gravita}">${a.gravita}</span></td><td>${esc(a.messaggio)} ${fx(a)}${a.componente?`<br><small>${esc(nm(a.componente))}</small>`:""}</td>
  <td style="width:90px">${procKey(a.componente)[0]?`<button class="btn btn-d btn-sm noprint" data-anc="${esc(a.componente)}">Analysis</button>`:""}</td></tr>`).join("")}</table>`:'<span class="mute">Nessuna anomalia rilevata dalle regole.</span>'}


/* ---------------------------------------------------------------- Cruscotto, segnali, andamenti */
let DASH=null,DFILT={esito:"",q:""},TREND={};
const SIGICON={persistenza:"⏱",trend:"📉",flotta:"↔",inattiva:"💤"};
const SIGNAME={persistenza:"guasto persistente",trend:"andamento verso la soglia",flotta:"fuori dalla flotta",inattiva:"nessuna energia erogata"};
async function loadDash(){try{const rs=Object.values(RES).filter(r=>!r.id.startsWith("file:"));DASH=await api("/api/cruscotto",{risultati:rs.length?rs:null});if(R.page==="cruscotto")render()}catch(e){toast(e.message)}}
function sigs(id){return (DASH&&DASH.segnali[id])||[]}
function sigBadges(id){const s=sigs(id);if(!s.length)return "";const by={};s.forEach(x=>by[x.tipo]=(by[x.tipo]||0)+1);
  return Object.entries(by).map(([t,n])=>`<span class="sig" title="${esc(SIGNAME[t])}">${SIGICON[t]}${n>1?n:""}</span>`).join("")}
function sigList(list,withSt){return list.length?`<table class="lines">${list.map(x=>`<tr><td style="width:34px;font-size:18px" title="${esc(SIGNAME[x.tipo])}">${SIGICON[x.tipo]}</td>

/* andamento di una colonnina */
function andamento(r){setTimeout(()=>drawTrend(R.st),0);
  return crumb("Andamento")+`<div class="card"><h5>🔮 Segnali di questa colonnina</h5><div class="bd">${sigList(sigs(R.st))}</div></div><div id="trendbox"><div class="empty">Caricamento dello storico…</div></div>`}
async function drawTrend(id){let d=TREND[id];if(!d){try{d=TREND[id]=await api("/api/andamento",{id,risultato:RES[id]})}catch(e){toast(e.message);return}}
  const box=$("#trendbox");if(!box||R.st!==id)return;const pts=d.punti||[];
  if(pts.length<2){box.innerHTML=`<div class="card"><div class="bd empty">Storico insufficiente: servono almeno due diagnosi in momenti diversi. Ogni «Avvia diagnosi» aggiunge un punto.</div></div>`;return}
  const sv=new Set(sigs(id).map(x=>x.variabile));const vars=Object.keys(d.limiti).filter(v=>pts.some(p=>v in p.v)).sort((a,b)=>(sv.has(b)?1:0)-(sv.has(a)?1:0));
  const charts=vars.map(v=>lineChart(v,pts.filter(p=>v in p.v).map(p=>({t:p.t,y:p.v[v]})),d.limiti[v]));
  box.innerHTML=`<div class="card"><h5>📈 Andamento <small>${pts.length} letture dal ${fmtT(pts[0].t)} al ${fmtT(pts[pts.length-1].t)} · linee tratteggiate = soglie delle regole</small></h5><div class="bd"><div class="smalls">${charts.join("")}</div></div></div>
   <div class="cards"><div class="card"><h5>⚡ Energia erogata al giorno</h5><div class="bd">${energyBars(pts)}</div></div><div class="card"><h5>🕑 Cronologia</h5><div class="bd">${timeline(pts)}</div></div></div>`;
  bindCharts()}
function fmtT(t){const d=new Date(t);return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}
function lineChart(title,pts,lim){const W=360,H=150,L=40,Rr=10,T=12,B=22;const ts=pts.map(p=>+new Date(p.t)),ys=pts.map(p=>p.y);
  let lo=Math.min(...ys),hi=Math.max(...ys);const[l0,h0]=lim||[];[l0,h0].forEach(x=>{if(x!=null&&Math.abs(x-(lo+hi)/2)<(hi-lo+1)*3){lo=Math.min(lo,x);hi=Math.max(hi,x)}});
  if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;const t0=Math.min(...ts),t1=Math.max(...ts)||t0+1;
  const X=t=>L+(W-L-Rr)*(t-t0)/((t1-t0)||1),Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));
  const path=pts.map((p,i)=>`${i?"L":"M"}${X(ts[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const thr=[[l0,"min"],[h0,"max"]].filter(([x])=>x!=null&&x>=lo&&x<=hi).map(([x,n])=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(x)}" y2="${Y(x)}" class="thr"/><text x="${W-Rr-2}" y="${Y(x)-3}" text-anchor="end" class="thl">${n} ${x}</text>`).join("");
  const ticks=[lo+pad,(lo+hi)/2,hi-pad].map(v=>`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end" class="axl">${+v.toFixed(2)}</text><line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/>`).join("");
  const last=pts[pts.length-1];const out=(l0!=null&&last.y<l0)||(h0!=null&&last.y>h0);
  const data=esc(JSON.stringify(pts.map((p,i)=>[X(ts[i]),Y(p.y),fmtT(p.t),p.y])));
  return `<div class="chart"><div class="ct"><span>${esc(lbl(title))}</span><b class="${out?"vbad":""}">${last.y}</b></div>
   <svg viewBox="0 0 ${W} ${H}" data-pts="${data}"><g>${ticks}${thr}</g><path d="${path}" class="ln"/><circle cx="${X(ts[ts.length-1])}" cy="${Y(last.y)}" r="4" class="lp"/>
   <text x="${L}" y="${H-5}" class="axl">${fmtT(pts[0].t).split(" ")[0]}</text><text x="${W-Rr}" y="${H-5}" text-anchor="end" class="axl">${fmtT(last.t).split(" ")[0]}</text>
   <line class="cx" y1="${T}" y2="${H-B}" x1="-10" x2="-10"/><circle class="cxp" r="4" cx="-10" cy="-10"/><rect x="${L}" y="0" width="${W-L-Rr}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>`}
function bindCharts(){$$(".chart svg").forEach(svg=>{const pts=JSON.parse(svg.dataset.pts),tip=svg.parentNode.querySelector(".tip"),cx=svg.querySelector(".cx"),cp=svg.querySelector(".cxp");
  svg.querySelector(".hit").onmousemove=e=>{const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)*svg.viewBox.baseVal.width/b.width;
    let best=pts[0];pts.forEach(p=>{if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p});cx.setAttribute("x1",best[0]);cx.setAttribute("x2",best[0]);cp.setAttribute("cx",best[0]);cp.setAttribute("cy",best[1]);
    tip.style.display="block";tip.innerHTML=`<b>${best[3]}</b> · ${best[2]}`;tip.style.left=Math.min(b.width-150,best[0]*b.width/svg.viewBox.baseVal.width)+"px"};
  svg.querySelector(".hit").onmouseleave=()=>{tip.style.display="none";cx.setAttribute("x1",-10);cx.setAttribute("x2",-10);cp.setAttribute("cx",-10)}})}
function energyBars(pts){const day={};pts.forEach(p=>{const e=(p.v["METER 0 TOTAL ACTIVE ENERGY"]||0)+(p.v["METER 1 TOTAL ACTIVE ENERGY"]||0);if(!e)return;const k=p.t.slice(0,10);day[k]=day[k]||[e,e];day[k][0]=Math.min(day[k][0],e);day[k][1]=Math.max(day[k][1],e)});
  const ks=Object.keys(day).sort();const vals=ks.map((k,i)=>i?Math.max(0,(day[k][1]-day[ks[i-1]][1])/1000):Math.max(0,(day[k][1]-day[k][0])/1000));
  if(!ks.length)return '<span class="mute">Nessun dato di energia.</span>';const mx=Math.max(1,...vals),W=360,H=130,bw=(W-10)/ks.length;
  return `<svg viewBox="0 0 ${W} ${H+18}" class="ebars">${vals.map((v,i)=>`<rect x="${5+i*bw+1}" y="${H-H*v/mx}" width="${Math.max(1,bw-2)}" height="${Math.max(v?2:0,H*v/mx)}" rx="2" class="eb"><title>${ks[i].split("-").reverse().join("/")}: ${v.toFixed(1)} kWh</title></rect>`).join("")}
   <text x="5" y="${H+14}" class="axl">${ks[0].split("-").reverse().join("/")}</text><text x="${W-5}" y="${H+14}" text-anchor="end" class="axl">${ks[ks.length-1].split("-").reverse().join("/")}</text></svg>
   <small>Media ${(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)} kWh/giorno · massimo ${mx.toFixed(1)} kWh</small>`}
function timeline(pts){const ev=[];for(let i=1;i<pts.length;i++){const a=new Set(pts[i-1].guasti),b=new Set(pts[i].guasti);const add=[...b].filter(x=>!a.has(x)),rem=[...a].filter(x=>!b.has(x));
    if(add.length||rem.length||pts[i].esito!==pts[i-1].esito)ev.push({t:pts[i].t,da:pts[i-1].esito,a:pts[i].esito,add,rem})}
  const name=g=>{const[k,n]=g.split("|");return lbl(k)+(n?` (presa ${n})`:"")};
  return ev.length?`<table class="lines">${ev.reverse().slice(0,20).map(e=>`<tr><td style="width:110px"><small>${fmtT(e.t)}</small></td><td>${e.da!==e.a?`<span class="pill p-${e.da}">${e.da}</span> → <span class="pill p-${e.a}">${e.a}</span><br>`:""}
   ${e.add.map(g=>`<div>🔴 compare: ${esc(name(g))}</div>`).join("")}${e.rem.map(g=>`<div>🟢 rientra: ${esc(name(g))}</div>`).join("")}</td></tr>`).join("")}</table>`:'<span class="mute">Nessun cambiamento nello storico.</span>'}

   <button class="btn btn-o" id="cfgexp">Esporta</button><button class="btn btn-p" id="cfgsave">Salva</button></div>`}
function collectCfg(){const C=JSON.parse(JSON.stringify(CFG()));C.codes={};
  $$("[data-msg]").forEach(i=>{const v=i.value.trim();v&&v!==i.dataset.def?C.msgs[i.dataset.msg]=v:delete C.msgs[i.dataset.msg]});
  $$("[data-fp]").forEach(i=>{const v=i.value.trim();v?C.faultParts[i.dataset.fp]=v:delete C.faultParts[i.dataset.fp]});
  $$("[data-man]").forEach(i=>{const v=i.value.trim();v?C.manuals[i.dataset.man]=v:delete C.manuals[i.dataset.man]});
  $$("[data-name]").forEach(i=>{const k=i.dataset.name,v=i.value.trim();v&&v!==defName(k)?C.names[k]=v:delete C.names[k]});
  $$("[data-code]").forEach(i=>{const k=i.dataset.code,v=i.value.trim();if(v!==(partOf(k)?.code||""))C.codes[k]=v});
  $$("[data-lbl]").forEach(i=>{const v=i.value.trim();v&&v!==i.dataset.lbl?C.labels[i.dataset.lbl]=v:delete C.labels[i.dataset.lbl]});return C}
async function saveCfg(C){await api("/api/config",C);await loadState();const rs=Object.values(RES);
  if(rs.length){const j=await api("/api/rivaluta",{risultati:rs});j.risultati.forEach(r=>RES[r.id]=r);KIT=j.kit}render()}

/* ---------------------------------------------------------------- Impostazioni */
function impPage(){const i=S.impostazioni;return crumb("Impostazioni")+`<div class="cards">
  <div class="card"><h5>📋 Elenco colonnine</h5><div class="bd"><table class="edit"><tr><th>Nome</th><th>IP</th><th>Porta web</th><th>Porta SSH</th><th>CUID atteso</th><th>Note</th><th>Utente SSH</th><th>Password SSH</th><th title="IP della scheda di rete del PC da cui uscire: serve quando più colonnine con lo stesso IP sono collegate a schede diverse">Scheda di rete PC</th><th></th></tr><tbody id="edrows"></tbody></table>
   <div class="ctl"><button class="btn btn-o" id="addrow">+ Aggiungi</button>${S.poledesk?`<button class="btn btn-o" id="imppd">Importa da PoleDesk</button>`:""}<span style="flex:1"></span><button class="btn btn-p" id="saverows">Salva elenco</button></div></div></div></div>
  <div class="cards"><div class="card"><h5>🔐 Controlli SSH (sola lettura)</h5><div class="bd"><small>Servizi, disco, memoria, orologio, errori di CP.log e PS4GAux.log, disconnessioni USB della testa. Password provate in quest'ordine, fino alla prima accettata: quella che ha già funzionato per questo CUID; la riga dell'elenco con lo stesso CUID atteso; la riga stessa; le colonnine PoleDesk con lo stesso indirizzo e la stessa scheda di rete; le altre righe con lo stesso indirizzo; la generale; la predefinita di PoleDesk. Così le colonnine del banco prova con lo stesso IP e password diverse si riconoscono da sole. Se sono collegate insieme a schede di rete diverse, indica la scheda in «Scheda di rete PC».${S.paramiko?"":" Sul PC manca paramiko: si usa solo la pagina di stato."}</small>
   <div class="ctl"><label><input type="checkbox" id="sshon" ${i.ssh_attivo?"checked":""}> attivi</label></div>
   <div class="ctl"><label>Utente</label><input type="text" id="sshuser" value="${esc(i.utente||"root")}"></div>
   <div class="ctl"><label>Password generale</label><input type="password" id="sshpw" placeholder="${i.ha_password?"(impostata)":"(non impostata)"}"></div>
   <div class="ctl"><label>In parallelo</label><input type="number" id="par" min="1" max="50" value="${i.parallelo||20}" style="width:80px"></div>
   <div class="ctl"><label>Aggiornamento (s)</label><input type="number" id="aggs" min="3" max="300" value="${i.aggiorna_s||10}" style="width:80px"></div>
   <button class="btn btn-p" id="saveimp">Salva</button></div></div>
  <div class="card"><h5>🗂 File e prove</h5><div class="bd"><table class="lines">
   ${[["regole","regole.csv","soglie e regole sintomo → guasto"],["ricambi","ricambi.csv","componente → codice ricambio"],["procedure","procedure.json","passi Remote e On-Field"],["colonnine","colonnine.csv","elenco colonnine"],["dati","Cartella dati",esc(S.dati)]]
     .map(([k,t,d])=>`<tr><td><b>${t}</b><br><small>${d}</small></td><td style="text-align:right"><button class="btn btn-o btn-sm" data-open="${k}">Apri</button></td></tr>`).join("")}</table>
   <div class="ctl" style="margin-top:12px"><label class="btn btn-o">Analizza pagina salvata…<input type="file" id="fileh" accept=".html,.htm" style="display:none"></label><small>per provare le regole su un 00_pagina_stato.html raccolto in precedenza</small></div></div></div></div>`}

/* ---------------------------------------------------------------- eventi */
function bind(){
  $$("[data-p2]").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.p2)});
  $$("[data-gost]").forEach(a=>a.onclick=e=>{e.preventDefault();go(R.page==="cruscotto"&&a.classList.contains("tile")?"diag":"andamento",a.dataset.gost)});
  $$("[data-df]").forEach(b=>b.onclick=()=>{DFILT.esito=b.dataset.df;render()});
  $("#dq")&&($("#dq").oninput=e=>{DFILT.q=e.target.value;const pos=e.target.selectionStart;render();const f=$("#dq");f.focus();f.setSelectionRange(pos,pos)});
  $("#readnow")&&($("#readnow").onclick=()=>readOne(R.st));$("#readnow2")&&($("#readnow2").onclick=()=>readOne(R.st));
  $("#auto")&&($("#auto").onchange=e=>{AUTO=e.target.checked;setAuto()});
  $("#hl")&&($("#hl").onchange=e=>{HL=e.target.checked;render()});
  $$("tr.clk[data-st]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("button,input"))return;go("diag",tr.dataset.st)});
  $$("input[data-c]").forEach(i=>i.onclick=e=>{e.stopPropagation();i.checked?SEL.add(i.dataset.c):SEL.delete(i.dataset.c);selInfo()});
  $("#all")&&($("#all").onclick=e=>{e.target.checked?S.colonnine.forEach(c=>SEL.add(c.id)):SEL.clear();render()});selInfo();
  $("#go")&&($("#go").onclick=startRun);
  $$("[data-an]").forEach(b=>b.onclick=e=>{e.stopPropagation();R.st=b.dataset.an;const a=RES[R.st].anomalie.find(a=>procKey(a.componente)[0]);openMaint(a.componente,"Remote")});
  $$("[data-anc]").forEach(b=>b.onclick=()=>openMaint(b.dataset.anc,"Remote"));
  $("#startm")&&($("#startm").onclick=()=>openMaint($("#selan").value,$("#seltype").value));
  $$("[data-g]").forEach(b=>b.onclick=async()=>{const j=await api("/api/giro/"+b.dataset.g);RES={};j.risultati.forEach(r=>RES[r.id]=r);KIT=j.kit;STAMP=j.stamp;JOB=null;loadDash();render()});
  /* Nomi e manuali */
  if(R.page==="conf"){const q=$("#confq");if(q)q.oninput=e=>{CONFQ=e.target.value;const p=e.target.selectionStart;render();const f=$("#confq");f.focus();f.setSelectionRange(p,p)};
    const d=$("#confdiff");if(d)d.onchange=e=>{CONFDIFF=e.target.checked;render()}}
  if(R.page==="cfg"){$("#cfgsave").onclick=async()=>{try{await saveCfg(collectCfg());toast("Salvato")}catch(e){toast(e.message)}};
    $("#lflt").oninput=e=>{CFGF=e.target.value;const pos=e.target.selectionStart;render();const f=$("#lflt");f.focus();f.setSelectionRange(pos,pos)};
    $("#rgo").onclick=async()=>{const a=$("#rfrom").value,b=$("#rto").value;if(!a)return;const C=collectCfg();let n=0;
      $$("[data-lbl]").forEach(i=>{const k=i.dataset.lbl,cur=C.labels[k]||k;if(cur.includes(a)){C.labels[k]=cur.split(a).join(b);n++}});await saveCfg(C);toast(`Sostituito in ${n} etichette`)};
    $("#cfgreset").onclick=async()=>{if(!confirm("Ripristinare nomi, etichette, descrizioni e link predefiniti? I codici in ricambi.csv restano."))return;await saveCfg({names:{},labels:{},msgs:{},manuals:{},faultParts:{}});toast("Ripristinato")};
    $("#cfgexp").onclick=()=>{const C=collectCfg();(S.ricambi||[]).forEach(r=>{if(r.codice&&!(r.componente in C.codes))C.codes[r.componente]=r.codice});
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,2)],{type:"application/json"}));a.download="manut21_nomi_e_manuali.json";document.body.appendChild(a);a.click();a.remove()};
    $("#cfgimp").onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());await saveCfg({names:x.names||{},labels:x.labels||{},msgs:x.msgs||{},manuals:x.manuals||{},faultParts:x.faultParts||{},codes:x.codes||{}});toast("Configurazione importata")}catch(err){toast("File non valido: "+err.message)}}}
  /* Impostazioni */
  if(R.page==="imp"){const add=(c={})=>{const tr=document.createElement("tr");tr.dataset.orig=c.id||"";tr.innerHTML=["nome","ip","porta_web","porta_ssh","cuid_atteso","note","utente_ssh"].map(k=>`<td><input data-k="${k}" value="${esc(c[k]||"")}" placeholder="${k==="porta_web"?"80":k==="porta_ssh"?"22":k==="utente_ssh"?esc(S.impostazioni.utente||"root"):""}"></td>`).join("")
        +`<td><input type="password" data-k="password_ssh" autocomplete="new-password" placeholder="${c.ha_password_ssh?"(impostata)":c.fonte_ssh?"(usa: "+esc(c.fonte_ssh)+")":"(nessuna)"}" title="Vuoto = lascia com'è. Un trattino - cancella la password della colonnina."></td><td><input data-k="scheda_pc" value="${esc(c.scheda_pc||"")}" placeholder="(automatica)" title="Es. 192.168.0.100 per la porta del PC, 192.168.0.101 per l'adattatore USB"></td><td><button class="btn btn-o btn-sm">✕</button></td>`;
      tr.querySelector("button").onclick=()=>tr.remove();$("#edrows").appendChild(tr)};(S.colonnine.length?S.colonnine:[{}]).forEach(add);
    $("#addrow").onclick=()=>add();
    $("#saverows").onclick=async()=>{const righe=$$("#edrows tr").map(tr=>({...Object.fromEntries([...tr.querySelectorAll("input")].map(i=>[i.dataset.k,i.value.trim()])),_orig:tr.dataset.orig}));
      try{await api("/api/colonnine",{righe});SEL.clear();RES={};KIT=null;await loadState();render();toast("Elenco salvato")}catch(e){toast(e.message)}};
    $("#imppd")&&($("#imppd").onclick=async()=>{try{const r=await api("/api/importa_poledesk",{});SEL.clear();await loadState();render();toast(`Importate ${r.aggiunte} colonnine`)}catch(e){toast(e.message)}});
    $("#saveimp").onclick=async()=>{try{await api("/api/impostazioni",{ssh_attivo:$("#sshon").checked,utente:$("#sshuser").value.trim()||"root",password:$("#sshpw").value,parallelo:+$("#par").value||20,aggiorna_s:+$("#aggs").value||10});await loadState();render();toast("Impostazioni salvate")}catch(e){toast(e.message)}};
    $$("[data-open]").forEach(b=>b.onclick=async()=>{try{const r=await api("/api/apri",{cosa:b.dataset.open});toast("Aperto: "+r.percorso)}catch(e){toast(e.message)}});
    $("#fileh").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const r=await api("/api/analizza_html",{html:await f.text(),nome:f.name});RES[r.id]=r;go("diag",r.id)}catch(err){toast(err.message)}}}
}
function selInfo(){const s=$("#selinfo");if(s)s.textContent=`${SEL.size} di ${S.colonnine.length} selezionate`;const g=$("#go");if(g)g.disabled=!SEL.size||(JOB&&!JOB.fine)}
async function startRun(){try{const j=await api("/api/avvia",{ids:[...SEL]});RES=Object.fromEntries(Object.entries(RES).filter(([k])=>k.startsWith("file:")));KIT=null;STAMP=null;
  JOB={id:j.id,fine:false,in_corso:[...SEL],fatti:0,totale:SEL.size};render();poll()}catch(e){toast(e.message)}}
async function poll(){try{JOB=await api("/api/job/"+JOB.id)}catch(e){toast(e.message);return}
  JOB.risultati.forEach(r=>RES[r.id]=r);if(JOB.fine){KIT=JOB.kit;STAMP=JOB.stamp;S.giri=[STAMP,...(S.giri||[])];TREND={};loadDash()}
  if(R.page==="flotta"||JOB.fine)render();if(!JOB.fine)setTimeout(poll,700);else toast(`Diagnosi completata: ${JOB.totale} colonnine`)}

setInterval(()=>$("#clock").textContent=new Date().toLocaleString("it-IT"),1000);
(async()=>{try{await loadState();if(S.giri&&S.giri[0]){try{const j=await api("/api/giro/"+S.giri[0]);j.risultati.forEach(r=>RES[r.id]=r);KIT=j.kit;STAMP=j.stamp}catch(e){}}loadDash();const[p,s]=location.hash.slice(1).split("/");if(p)R.page=p;if(s)R.st=decodeURIComponent(s);render()}catch(e){$("#main").innerHTML=`<div class="empty">Errore: ${esc(e.message)}</div>`}})();
</script>
</body>
</html>
