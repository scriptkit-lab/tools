<!doctype html>
<html lang="it">

<title>Manutenzione 2.1</title>
<style>
:root{--side:#1f2429;--side2:#343a40;--top:#15181b;--bg:#f2f3f5;--card:#fff;--line:#dfe3e8;--ink:#1d2328;--mute:#68717a;--blue:#2a78d6;--red:#d63a3a;--green:#1e9e45;--amber:#e0a800}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
#top{height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:6}
#top .brand{font-weight:700;font-size:18px;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700}
.b-yel{background:#ffc107;color:#212529}
.modes{display:flex;background:#2b3035;border-radius:6px;padding:3px;margin-left:12px}
.modes button{border:0;background:transparent;color:#cfd4d9;padding:6px 14px;border-radius:4px;font:inherit;cursor:pointer;font-weight:600}
.modes button.on{background:#fff;color:#1d2328}
#clock{flex:1;text-align:right;color:#ffffff88;font-size:13px}
#wrap{display:flex;min-height:calc(100vh - 56px)}
#side{width:236px;background:var(--side);padding:10px 0;flex-shrink:0}
#side a{display:flex;align-items:center;gap:10px;color:#ffffffa0;text-decoration:none;padding:11px 18px}
#side a:hover{color:#fff}#side a.on{color:#fff;background:var(--side2);border-left:3px solid var(--blue);padding-left:15px}
#side .sec{color:#ffffff55;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:14px 18px 4px}
#side .ic{width:20px;text-align:center}
#main{flex:1;padding:18px 22px;min-width:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}
.sub{color:var(--mute);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:16px;overflow:hidden}
.card>h5{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8f9fa;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>.bd{padding:12px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.3px}
.lines td{border-bottom:1px solid var(--line)}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f2f6fc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-GUASTO{background:#f8d7da;color:#842029}.p-ATTENZIONE{background:#fff3cd;color:#664d03}.p-OK{background:#d1e7dd;color:#0f5132}.p-INFO{background:#e2e6ea;color:#41464b}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;padding:7px 14px;border-radius:5px;font:inherit;cursor:pointer;text-decoration:none;line-height:1.3}
.btn-p{background:var(--blue);color:#fff}.btn-g{background:var(--green);color:#fff}.btn-r{background:var(--red);color:#fff}.btn-o{background:#fff;border-color:#c9cfd6;color:var(--ink)}
.btn-sm{padding:3px 9px;font-size:13px}.btn-xl{padding:14px 22px;font-size:18px;font-weight:600;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],select,textarea{font:inherit;padding:6px 9px;border:1px solid #c9cfd6;border-radius:5px;background:#fff}
.mute{color:var(--mute)}small{color:var(--mute)}
.note{background:#fff8e1;border:1px solid #ffe08a;border-radius:6px;padding:9px 13px;margin-bottom:14px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:6px;padding:10px 14px}
.kpi.ok{border-top-color:var(--green)}.kpi.bad{border-top-color:var(--red)}.kpi.warn{border-top-color:var(--amber)}
.kl{font-size:13px;color:var(--mute)}.kv{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}.kv small{font-size:15px;font-weight:400}.ks{font-size:12px;color:var(--mute)}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:#eef0f2;min-width:80px}.bar i{display:block;height:100%}
.bg-r{background:var(--red)}.bg-a{background:var(--amber)}.bg-g{background:var(--green)}.bg-b{background:var(--blue)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:11px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.spc{font-family:Consolas,monospace;font-weight:700;font-size:12px;padding:1px 6px;border:1px solid #ffd666;border-radius:3px;background:#fff8e1;color:#6b4e00;white-space:nowrap}
.man{font-size:12px;text-decoration:none;padding:1px 7px;border:1px solid #9ec5fe;border-radius:3px;background:#e7f1ff;color:#0a58ca;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
/* colonnina */
.hero{display:flex;gap:16px;align-items:center;border-radius:8px;padding:16px 20px;margin-bottom:16px;color:#fff}
.hero.h-OK{background:#1e8b42}.hero.h-ATTENZIONE{background:#b98900}.hero.h-GUASTO{background:#c0352f}
.hero .big{font-size:26px;font-weight:700;line-height:1.2}.hero .ico{font-size:44px}
.todo{border:2px solid #f1c2c2;background:#fff;border-radius:8px;margin-bottom:14px;overflow:hidden}
.todo.w{border-color:#ffe08a}
.todo .th{padding:12px 16px;background:#fdf1f1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.todo.w .th{background:#fffaeb}
.todo .tb{padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}

.steps{margin:6px 0 0;padding-left:22px}.steps li{margin:4px 0}
.partcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px;background:#fafbfc}

.photo{width:84px;height:64px;border-radius:6px;background:repeating-linear-gradient(45deg,#eceff2,#eceff2 7px,#f7f8f9 7px,#f7f8f9 14px);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.blk{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px;overflow:hidden}
.blk.s-GUASTO{border-left-color:var(--red)}.blk.s-ATTENZIONE{border-left-color:var(--amber)}
.blk h4{margin:0;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:15px;background:#f8f9fa;border-bottom:1px solid var(--line)}

.v-bad{color:#a11d1d;font-weight:700}.v-warn{color:#7a5a00;font-weight:700}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}.l-g{background:var(--green)}.l-r{background:var(--red)}.l-a{background:var(--amber)}.l-x{background:#adb5bd}
.dtab td{padding:3px 8px;border:2px solid #fff;background:#eceeef;font-size:13px}.dtab th{background:#343a40;color:#fff;text-align:center;border:2px solid #fff}
/* campo */
.search{display:flex;gap:10px;max-width:760px}.search input{flex:1;font-size:20px;padding:14px 16px;border-radius:8px}

.reslist .r:hover{border-color:var(--blue)}
.wiz{max-width:900px}.wsteps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.wsteps span{padding:6px 12px;border-radius:16px;background:#e9ecef;font-size:13px}.wsteps span.on{background:var(--blue);color:#fff}.wsteps span.done{background:#d1e7dd;color:#0f5132}

.qbtns{display:flex;gap:12px;margin-top:16px}
.chk li{list-style:none;margin:8px 0;font-size:17px}.chk{padding:0}.chk input{width:22px;height:22px;vertical-align:-4px;margin-right:10px}
/* configurazione */
.cfgt td{padding:4px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.cfgt input,.cfgt textarea{width:100%;font-size:13px;padding:4px 6px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}.tabs button{border:0;background:transparent;padding:9px 14px;font:inherit;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px}

.rep{background:#fff;max-width:900px;margin:0 auto;padding:28px 34px;border:1px solid var(--line)}
.rep h1{font-size:22px}.rep h3{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #1d2328;padding-bottom:3px}
.rep table td,.rep table th{border-bottom:1px solid #ddd;font-size:13px;padding:4px 6px}
.sheet{border:1px solid #bbb;border-radius:6px;padding:14px 16px;margin-bottom:14px;break-inside:avoid}
.sheet .sh{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding-bottom:6px;margin-bottom:8px}
.box{display:inline-block;width:15px;height:15px;border:2px solid #555;border-radius:3px;vertical-align:-3px;margin-right:6px}
/* benessere, grafici, diagnosi massiva */
.sthead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.sthead h1{margin:0}
.health{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;margin-bottom:16px}@media(max-width:900px){.health{grid-template-columns:1fr}}
.ring{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.area{background:#fff;border:1px solid var(--line);border-top:5px solid var(--green);border-radius:8px;padding:10px 14px;cursor:pointer}.area:hover{border-color:var(--blue)}
.area.s-GUASTO{border-top-color:var(--red)}.area.s-ATTENZIONE{border-top-color:var(--amber)}
.area .at{font-weight:600;display:flex;gap:6px;align-items:center}.area .av{font-size:13px;color:var(--mute);margin-top:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.chart{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px}.chart .ct{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.chart svg{width:100%;height:auto;display:block}.ln{fill:none;stroke:var(--blue);stroke-width:2}.thr{stroke:var(--red);stroke-dasharray:5 4;stroke-width:1.2}.thl{font-size:10px;fill:var(--red)}
.axl{font-size:10px;fill:#8a939b}.gridl{stroke:#eef0f2}.vbad{color:var(--red)}
.spark{display:flex;gap:10px;align-items:center;justify-content:space-between}.spark svg{width:130px;height:36px}
.prog{height:22px;background:#e9ecef;border-radius:11px;overflow:hidden;display:flex}.prog i{display:block;height:100%;transition:width .1s}
.errbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px;cursor:pointer;font:inherit}
.errbtn:hover{border-color:var(--blue);background:#f5f9ff}.errcode{font-family:Consolas,monospace;font-size:12px;background:#212529;color:#ffc107;padding:2px 7px;border-radius:3px}
.crumbs{font-size:14px;color:var(--mute);margin-bottom:10px}.crumbs div{margin:3px 0}
.qbig{font-size:22px;font-weight:600;margin:6px 0 4px}
.esito{border:2px solid #9fd3b0;background:#f2fbf5;border-radius:10px;padding:16px 18px;margin-bottom:12px}
.flow{display:flex;align-items:center;gap:4px;margin:6px 0 14px;flex-wrap:wrap}.flow .fs{padding:7px 12px;border-radius:18px;background:#e9ecef;font-size:13px;font-weight:600;color:#5d666e}
.flow .fs.done{background:#d1e7dd;color:#0f5132}.flow .fs.on{background:var(--blue);color:#fff}.flow .fs.bad{background:var(--red);color:#fff}.flow .fa{color:#adb5bd;font-weight:700}
.sfbox{white-space:pre-wrap;background:#f6f8fa;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:12.5px/1.45 Consolas,monospace;margin:10px 0}
.codebox{white-space:nowrap;font:700 22px Consolas,monospace;border:3px solid #1d2328;padding:4px 10px;border-radius:6px;letter-spacing:1px}
.ctest{border:2px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}.ctest.ok{border-color:#9fd3b0;background:#f2fbf5}.ctest.ko{border-color:#f1c2c2;background:#fdf1f1}
.ctest .cth{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.livebox{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:8px;font-size:14px}
.areas5{display:flex;gap:2px;background:#2b3035;border-radius:6px;padding:3px;margin-left:12px;align-items:center;flex-wrap:wrap}.areas5 button{border:0;background:transparent;color:#cfd4d9;padding:6px 10px;border-radius:4px;font:inherit;font-size:13px;cursor:pointer;font-weight:600}.areas5 button.on{background:#fff;color:#1d2328}
.flow5{display:flex;align-items:stretch;gap:6px;margin:10px 0 18px;flex-wrap:wrap}.f5{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-top:5px solid #999;border-radius:8px;padding:10px;text-align:center;cursor:pointer}.f5.on{box-shadow:0 0 0 2px var(--blue)}.f5a{display:flex;flex-direction:column;justify-content:center;align-items:center;color:#8a939b;font-weight:700}.f5a small{font-weight:400;font-size:10.5px}
.fase{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:#e7f1ff;color:#0a58ca;margin-left:6px;vertical-align:1px}
.tl td{font-size:13.5px;vertical-align:top}.mono{font-family:Consolas,monospace}
.logbox{background:#0f1419;color:#d6dde3;border-radius:6px;padding:10px 12px;font:12px/1.5 Consolas,monospace;max-height:560px;overflow:auto;margin:8px 0}
.ll{white-space:pre-wrap}.ll .lt{color:#7d8a96}.ll .lv{display:inline-block;width:46px;color:#7d8a96}.ll.l-ERROR{color:#ff8a80}.ll.l-ERROR .lv{color:#ff5252;font-weight:700}.ll.l-WARN{color:#ffd180}.ll.l-WARN .lv{color:#ffab40;font-weight:700}
.term{background:#0f1419;color:#d6dde3;border-radius:6px;padding:12px 14px;font:12.5px/1.5 Consolas,monospace;white-space:pre-wrap;min-height:360px}
.toast{pointer-events:none;position:fixed;right:16px;bottom:16px;background:#212529;color:#fff;padding:10px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:30}.toast.on{opacity:.95}
@media print{#top,#side,.noprint,.toast{display:none!important}#main{padding:0}body{background:#fff}.rep{border:0;padding:0;max-width:none}.sheet{page-break-inside:avoid}}
@media(max-width:800px){#side{width:58px}#side a span,#side .sec{display:none}#clock{display:none}}
</style>
</head>

    FAULTS0.forEach(f=>{if(f.id==="PAG"&&st.f.length)return;const k=f.scope==="S"?2:1;for(let n=0;n<k;n++)if(r()<f.freq)st.f.push({id:f.id,n:f.scope==="S"?n:null,da:+(0.2+r()*r()*45).toFixed(1)})});
    if(st.f.some(x=>x.id==="PAG"))st.f=st.f.filter(x=>x.id==="PAG");
    const u=r();if(!st.f.length||u<.5){
      if(u<.010)st.sig.push({tipo:"trend",var:"SUPERCAP VOLTAGE",eta:Math.round(5+r()*40),comp:"DEMO-SCP-090",txt:"Supercap in calo"});
      else if(u<.022)st.sig.push({tipo:"trend",var:"MODEM SIGNAL QUALITY",eta:Math.round(3+r()*30),comp:"DEMO-ANT-061",txt:"Segnale modem in calo"});
      else if(u<.03)st.sig.push({tipo:"trend",var:"CPU-TEMPERATURE",eta:Math.round(10+r()*35),comp:"DEMO-FAN-031",txt:"Temperatura in aumento"});
      else if(u<.045)st.sig.push({tipo:"inattiva",n:Math.floor(r()*2),giorni:Math.round(3+r()*20),txt:"Presa senza energia erogata"})}
    PARCO.push(st)}});
  PARCO.forEach(s=>{s.es=s.f.some(x=>fault(x.id).sev==="GUASTO")?"GUASTO":s.f.length||s.sig.some(g=>g.tipo==="inattiva")?"ATTENZIONE":"OK"})}

/* fonte della password SSH: 1 colonnina (Elenco) → 2 stessa colonnina in PoleDesk → 3 generale → 4 predefinita PoleDesk */
function cred(s){const o=(CFG.ssh||{})[s.id];if(o==="-")return {fonte:"",utente:"root"};if(o)return {fonte:"colonnina",utente:"root"};
  const k=s.i%100;return k<62?{fonte:"PoleDesk (colonnina)",utente:"root"}:k<80?{fonte:"colonnina",utente:"root"}:k<93?{fonte:"generale",utente:"root"}:k<98?{fonte:"PoleDesk (generale)",utente:"root"}:{fonte:"",utente:"root"}}
const senzaPw=()=>PARCO.filter(s=>!cred(s).fonte).length;
function stValues(s){const v={...BASE};for(const n of "01")Object.entries(SOCK).forEach(([k,x])=>v[k.replace("{n}",n)]=x);
  v.CUID=s.cuid;v["METER 0 TOTAL ACTIVE ENERGY"]=(s.i*7919%400000+80000)+" wh";v["METER 1 TOTAL ACTIVE ENERGY"]=(s.i*104729%300000+60000)+" wh";
  s.sig.forEach(g=>{if(g.var==="SUPERCAP VOLTAGE")v[g.var]=(11.5+g.eta*0.028).toFixed(2)+" v";if(g.var==="MODEM SIGNAL QUALITY"){const c=Math.round(10+g.eta*0.45);v[g.var]=`CSQ=${c} PWR=${-113+2*c}dbm`}
    if(g.var==="CPU-TEMPERATURE")v[g.var]=(85-g.eta*0.41).toFixed(2)+" c"});
  {const vv=verOf(s);v["CP VERS"]=vv.cp;v["RVE_AUX_VERS"]=vv.aux;v["DISPLAY_VERS"]=vv.dsp}
  s.f.forEach(x=>{const f=fault(x.id);Object.entries(f.set).forEach(([k,val])=>v[k.replace("{n}",x.n)]=val)});return v}
function anomalies(s){return s.f.map(x=>{const f=fault(x.id);return {...f,n:x.n,da:x.da,var:f.var.replace("{n}",x.n),
  label:(x.n!=null?(x.n?"Presa destra":"Presa sinistra")+": ":"")+f.titolo}}).sort((a,b)=>(b.sev==="GUASTO")-(a.sev==="GUASTO"))}

function stats(list){const c={GUASTO:0,ATTENZIONE:0,OK:0};let socks=0,ko=0;list.forEach(s=>{c[s.es]++;socks+=2;
  ko+=s.f.some(x=>x.id==="PAG"||x.id==="AC")?2:new Set(s.f.filter(x=>x.n!=null&&fault(x.id).sev==="GUASTO").map(x=>x.n)).size});return {c,socks,av:socks-ko}}
function parco(){const st=stats(PARCO);const sig=PARCO.reduce((a,s)=>a+s.sig.length,0);const need=kitNow(PARCO).reduce((a,x)=>a+x.qty,0);
  const regs=REG.map(([r])=>{const l=PARCO.filter(s=>s.reg===r),x=stats(l);return {r,n:l.length,...x,sig:l.reduce((a,s)=>a+s.sig.length,0)}});
  const comp={};PARCO.forEach(s=>s.f.forEach(x=>{const f=fault(x.id);const k=comp[f.id]=comp[f.id]||{f,G:0};k.G++}));const cl=Object.values(comp).sort((a,b)=>b.G-a.G),mx=Math.max(...cl.map(x=>x.G));
  const old=PARCO.flatMap(s=>s.f.map(x=>({s,x}))).filter(o=>fault(o.x.id).sev==="GUASTO").sort((a,b)=>b.x.da-a.x.da).slice(0,8);
  return `<h1>Parco installato</h1><div class="sub">${fmt(PARCO.length)} colonnine 2.1 in ${REG.length} regioni · ultima diagnosi oggi alle 06:00 <button class="btn btn-o btn-sm noprint" id="rerun">↻ Aggiorna diagnosi</button></div>
  <div class="kpis">${kpi("Colonnine funzionanti",`${Math.round(100*(st.c.OK+st.c.ATTENZIONE)/PARCO.length)}<small>%</small>`,`${fmt(st.c.OK+st.c.ATTENZIONE)} su ${fmt(PARCO.length)}`,"ok")}
   ${kpi("Prese disponibili",`${Math.round(100*st.av/st.socks)}<small>%</small>`,`${fmt(st.av)} su ${fmt(st.socks)}`)}
   ${kpi("Da riparare",fmt(st.c.GUASTO),"colonnine con almeno un guasto","bad")}
   ${kpi("Da controllare",fmt(st.c.ATTENZIONE),"attenzioni e prese inattive","warn")}
   ${kpi("Segnali predittivi",fmt(sig),"prima che diventino guasti","warn")}
   ${kpi("Ricambi da portare",fmt(need),`<a href="#" data-p2="ricambi">per i guasti aperti</a>`)}</div>
  <div class="grid2"><div class="card"><h5>🗺 Per regione <small>clic per vedere le priorità della regione</small></h5><div class="bd"><table class="lines"><tr><th>Regione</th><th class="num">Colonnine</th><th class="num">Da riparare</th><th style="width:34%">Stato</th><th class="num">Prese disp.</th><th class="num">Segnali</th></tr>
   ${regs.map(x=>`<tr class="clk" data-reg="${esc(x.r)}"><td>${esc(x.r)}</td><td class="num">${fmt(x.n)}</td><td class="num"><b>${x.c.GUASTO}</b></td><td><div class="bar"><i class="bg-g" style="width:${100*x.c.OK/x.n}%"></i><i class="bg-a" style="width:${100*x.c.ATTENZIONE/x.n}%"></i><i class="bg-r" style="width:${100*x.c.GUASTO/x.n}%"></i></div></td><td class="num">${Math.round(100*x.av/x.socks)}%</td><td class="num">${x.sig}</td></tr>`).join("")}</table>
   <div class="leg"><span><i class="bg-g"></i>funziona</span><span><i class="bg-a"></i>da controllare</span><span><i class="bg-r"></i>da riparare</span></div></div></div>
  <div><div class="card"><h5>🔧 Guasti aperti per tipo</h5><div class="bd"><table>${cl.map(x=>`<tr class="clk" data-fid="${x.f.id}"><td style="width:48%">${esc(x.f.titolo)}</td><td><div class="bar" style="background:transparent"><i class="${x.f.sev==="GUASTO"?"bg-r":"bg-a"}" style="width:${100*x.G/mx}%;border-radius:0 3px 3px 0"></i></div></td><td class="num" style="width:50px"><b>${x.G}</b></td></tr>`).join("")}</table>
   <div class="leg"><span><i class="bg-r"></i>guasto</span><span><i class="bg-a"></i>attenzione</span></div></div></div>
   <div class="card"><h5>⏱ Guasti aperti da più tempo</h5><div class="bd"><table class="lines">${old.map(o=>`<tr class="clk" data-col="${o.s.id}"><td><b>${o.s.id}</b><br><small>${esc(o.s.comune)}</small></td><td>${esc(fault(o.x.id).titolo)}</td><td class="num"><b>${giorni(o.x.da)}</b></td></tr>`).join("")}</table></div></div></div></div>`}

function filtered(){const f=R.flt;return PARCO.filter(s=>(!f.reg||s.reg===f.reg)&&(!f.es||s.es===f.es)&&(!f.fid||s.f.some(x=>x.id===f.fid))&&
  (!f.q||(s.id+" "+s.cuid+" "+s.comune+" "+s.ind).toLowerCase().includes(f.q.toLowerCase())))}
function prioScore(s){return (s.es==="GUASTO"?1000:s.es==="ATTENZIONE"?100:0)+s.f.reduce((a,x)=>a+(x.n!=null?40:20)+Math.min(x.da,60),0)+(s.f.some(x=>x.id==="CTT")?500:0)}
function prio(){const l=filtered().filter(s=>R.flt.es||s.es!=="OK").sort((a,b)=>prioScore(b)-prioScore(a));const per=50,pages=Math.max(1,Math.ceil(l.length/per));R.pg=Math.min(R.pg,pages-1);
  const rows=l.slice(R.pg*per,R.pg*per+per);
  return `<h1>Priorità di intervento</h1><div class="sub">Ordinate per gravità, prese ferme e da quanto tempo. Il contattore incollato va sempre in cima (sicurezza).</div>
  <div class="filters noprint"><select id="f-reg"><option value="">Tutte le regioni</option>${REG.map(([r])=>`<option ${R.flt.reg===r?"selected":""}>${r}</option>`).join("")}</select>
   <select id="f-es"><option value="">Da riparare + da controllare</option>${["GUASTO","ATTENZIONE","OK"].map(e=>`<option value="${e}" ${R.flt.es===e?"selected":""}>${e==="OK"?"Funzionanti":e==="GUASTO"?"Solo da riparare":"Solo da controllare"}</option>`).join("")}</select>
   <select id="f-fid"><option value="">Tutti i guasti</option>${FAULTS().map(f=>`<option value="${f.id}" ${R.flt.fid===f.id?"selected":""}>${esc(f.titolo)}</option>`).join("")}</select>
   <input type="text" id="f-q" placeholder="cerca codice, CUID, comune, indirizzo" value="${esc(R.flt.q)}" style="flex:1;min-width:220px"><button class="btn btn-o" id="f-clr">Azzera</button>
   <button class="btn btn-o" data-rep="schede">🖨 Schede intervento</button></div>
  <div class="card"><div class="bd" style="padding:0"><table class="lines"><tr><th>#</th><th>Colonnina</th><th>Dove</th><th>Stato</th><th>Problema</th><th>Ricambio</th><th class="num">Aperto da</th></tr>
  ${rows.map((s,i)=>{const a=anomalies(s)[0],sg=s.sig[0];return `<tr class="clk" data-col="${s.id}"><td class="mute">${R.pg*per+i+1}</td><td><b>${s.id}</b><br><small>${s.cuid}</small></td><td>${esc(s.comune)}<br><small>${esc(s.ind)} · ${esc(s.reg)}</small></td>
   <td>${pillS(s.es)}</td><td>${a?esc(a.label)+(s.f.length>1?` <small>+${s.f.length-1}</small>`:""):sg?"🔮 "+esc(sg.txt):""}</td><td>${a&&a.ricambi[0]?`<span class="spc">${a.ricambi[0]}</span>`:""}</td><td class="num">${a?giorni(a.da):""}</td></tr>`}).join("")||`<tr><td colspan="7" class="mute" style="padding:20px">Nessuna colonnina con questi filtri.</td></tr>`}</table></div></div>
  <div class="pager"><small>${fmt(l.length)} colonnine · pagina ${R.pg+1} di ${pages}</small><button class="btn btn-o btn-sm" id="pg-p" ${R.pg?"":"disabled"}>‹</button><button class="btn btn-o btn-sm" id="pg-n" ${R.pg<pages-1?"":"disabled"}>›</button></div>`}

function segnali(){const l=PARCO.flatMap(s=>s.sig.map(g=>({s,g}))).sort((a,b)=>(a.g.eta??-a.g.giorni)-(b.g.eta??-b.g.giorni));
  const by={};l.forEach(o=>by[o.g.txt]=(by[o.g.txt]||0)+1);

  <div class="card"><div class="bd" style="padding:0"><table class="lines"><tr><th>Colonnina</th><th>Dove</th><th>Segnale</th><th>Previsione</th><th>Ricambio da preparare</th></tr>
  ${l.slice(0,200).map(({s,g})=>`<tr class="clk" data-col="${s.id}"><td><b>${s.id}</b></td><td>${esc(s.comune)} <small>· ${esc(s.reg)}</small></td><td>${g.tipo==="inattiva"?"💤":"📉"} ${esc(g.txt)}${g.tipo==="inattiva"?` (presa ${g.n?"destra":"sinistra"})`:""}</td>
   <td>${g.tipo==="trend"?`raggiunge la soglia tra <b>${g.eta} giorni</b>`:`ferma da <b>${g.giorni} giorni</b>`}</td><td>${g.comp?`<span class="spc">${g.comp}</span>`:""}</td></tr>`).join("")}</table></div></div>${l.length>200?`<small>Primi 200 di ${l.length}, ordinati per urgenza.</small>`:""}`}

/* ------------------------------------------------------------------ ricambi: subito e piano a 3 anni */
function kitNow(list){const k={};list.forEach(s=>s.f.forEach(x=>{const f=fault(x.id);if(f.sev!=="GUASTO"&&!f.ricambi.length)return;const c=f.ricambi[f.ricambi.length-1];if(!c)return;
  const o=k[c]=k[c]||{code:c,qty:0,per:new Set()};o.qty++;o.per.add(f.titolo)}));return Object.values(k).sort((a,b)=>b.qty-a.qty)}
function plan(list){const P=PARTS(),Y=+CFG.orizzonte||3,sc=(+CFG.scorta||0)/100,now=new Date().getFullYear();
  return Object.entries(P).map(([code,p])=>{const per=[];for(let y=1;y<=Y;y++){let q=list.length*p.qta*p.tasso/100;
      if(p.prev>0)q+=list.filter(s=>{const age=now+y-1-+s.inst.slice(0,4);return age>0&&age%p.prev===0}).length*p.qta;
      if(y===1)q+=kitNow(list).find(x=>x.code===code)?.qty||0;per.push(Math.ceil(q*(1+sc)))}
    const tot=per.reduce((a,b)=>a+b,0);return {code,p,per,tot,cost:tot*(+p.costo||0)}}).sort((a,b)=>b.cost-a.cost)}
function ricambi(){const tab=R.tab||"subito";const reg=R.flt.reg;const list=reg?PARCO.filter(s=>s.reg===reg):PARCO;
  const head=`<h1>Ricambi e ordini</h1><div class="sub">Cosa portare per i guasti aperti e cosa ordinare per i prossimi ${CFG.orizzonte} anni.</div>
   <div class="filters noprint"><select id="r-reg"><option value="">Tutto il parco (${fmt(PARCO.length)})</option>${REG.map(([r])=>`<option ${reg===r?"selected":""}>${r}</option>`).join("")}</select></div>
   <div class="tabs noprint">${[["subito","Da portare ora"],["piano","Piano a "+CFG.orizzonte+" anni"]].map(([k,t])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${t}</button>`).join("")}</div>`;
  const P=PARTS();
  if(tab==="subito"){const k=kitNow(list);return head+`<div class="card"><h5>📦 Ricambi per i guasti aperti ${reg?"· "+esc(reg):""}<span style="flex:1"></span><button class="btn btn-o btn-sm" data-csv="subito">CSV</button><button class="btn btn-o btn-sm" data-rep="ordine">🖨 Stampa</button></h5><div class="bd">
   <table class="lines"><tr><th></th><th>Codice</th><th>Descrizione</th><th class="num">Quantità</th><th>Per</th><th class="num">Approvv.</th></tr>${k.map(x=>`<tr><td style="width:60px">${CFG.foto?photo(x.code):P[x.code].icona}</td><td><span class="spc">${x.code}</span></td><td>${esc(P[x.code].nome)}</td><td class="num"><b>${x.qty}</b></td><td><small>${[...x.per].map(esc).join(", ")}</small></td><td class="num">${P[x.code].lead} gg</td></tr>`).join("")}</table></div></div>`}
  const pl=plan(list),Y=+CFG.orizzonte,tc=pl.reduce((a,x)=>a+x.cost,0);
  return head+`<div class="card"><h5>📈 Piano di approvvigionamento<span style="flex:1"></span>
   <label class="noprint" style="font-weight:400;font-size:14px">Anni <input type="number" id="pl-y" min="1" max="5" value="${Y}" style="width:60px"></label>
   <label class="noprint" style="font-weight:400;font-size:14px">Scorta di sicurezza <input type="number" id="pl-s" min="0" max="100" value="${CFG.scorta}" style="width:64px"> %</label>
   <button class="btn btn-o btn-sm noprint" data-csv="piano">Excel (CSV)</button><button class="btn btn-o btn-sm noprint" data-rep="piano">🖨 Stampa</button></h5><div class="bd">
   <div class="note">Quantità = colonnine × pezzi per colonnina × tasso di guasto annuo + sostituzioni preventive (in base all'anno di installazione) + guasti già aperti (anno 1), più la scorta di sicurezza. <b>Tassi, cicli preventivi e costi sono valori di partenza</b>: si modificano in Configurazione → Ricambi e, con l'uso, si correggono con gli interventi registrati.</div>
   <table class="lines"><tr><th></th><th>Codice</th><th>Descrizione</th><th class="num">Tasso/anno</th><th class="num">Preventivo</th>${Array.from({length:Y},(_,i)=>`<th class="num">Anno ${i+1}</th>`).join("")}<th class="num">Totale</th><th class="num">Costo stimato</th></tr>
   ${pl.map(x=>`<tr><td style="width:44px">${x.p.icona}</td><td><span class="spc">${x.code}</span></td><td>${esc(x.p.nome)}</td><td class="num">${x.p.tasso}%</td><td class="num">${x.p.prev?"ogni "+x.p.prev+" anni":"-"}</td>${x.per.map(q=>`<td class="num">${fmt(q)}</td>`).join("")}<td class="num"><b>${fmt(x.tot)}</b></td><td class="num">${fmt(Math.round(x.cost))} €</td></tr>`).join("")}
   <tr><td colspan="${5+Y}"></td><td class="num"><b>Totale</b></td><td class="num"><b>${fmt(Math.round(tc))} €</b></td></tr></table><small>Costi d'esempio.</small></div></div>`}

/* ------------------------------------------------------------------ report */
function report(){const t=R.tab||"";if(!t)return `<h1>Report</h1><div class="sub">Pronti da stampare o salvare in PDF (A4). Scegli cosa ti serve:</div><div class="grid3">
  ${[["sintesi","📊","Sintesi per il responsabile","Una pagina: stato del parco, regioni, guasti principali, segnali, ricambi."],["schede","🧰","Schede intervento per i tecnici","Una scheda per colonnina: cosa non va in parole semplici, cosa fare, ricambi e codici. Usa i filtri di «Priorità»."],
    ["ordine","📦","Ordine ricambi","Ricambi per i guasti aperti, con quantità e codici, da passare al magazzino."],["piano","📈","Piano ricambi a "+CFG.orizzonte+" anni","Quantità per anno e costi, per il budget e gli ordini quadro."]]
   .map(([k,ic,ti,d])=>`<div class="card"><div class="bd"><div style="font-size:32px">${ic}</div><h2>${ti}</h2><p class="mute">${d}</p><button class="btn btn-p" data-rep="${k}">Apri</button></div></div>`).join("")}</div>`;

function repHead(t){return `<div style="display:flex;justify-content:space-between;align-items:flex-end"><div><h1>${t}</h1><div class="mute">Colonnine 2.1 · ${new Date().toLocaleString("it-IT")}${R.flt.reg?" · "+esc(R.flt.reg):""}</div></div><div class="mute">Manutenzione 2.1</div></div>`}
function repBody(t){const P=PARTS();

/* ================================================================== [DATI SIMULATI] STORICO SIMULATO (30 giorni, una lettura ogni 8 ore) */
const HC=new Map(),DAY=864e5;
function hist(s){if(HC.has(s.id))return HC.get(s.id);const r=rng(s.i*7+3),now=Date.now(),K=90,v=stValues(s);
  const num=x=>parseFloat(String(x).replace(/[^\d.\-]/g,""));const sg=k=>s.sig.find(g=>g.var===k),fl=id=>s.f.find(x=>x.id===id);
  const P={sc:[],cpu:[],csq:[],auxT:[],a12:[]};
  for(let k=0;k<K;k++){const t=now-(K-1-k)*DAY/3,ago=(K-1-k)/3,fr=k/(K-1),day=Math.sin(2*Math.PI*((t/DAY)%1));
    const g1=sg("SUPERCAP VOLTAGE");P.sc.push({t,y:g1?12.72+(num(v["SUPERCAP VOLTAGE"])-12.72)*fr+(r()-.5)*.03:12.76+(r()-.5)*.04});
    const g2=sg("CPU-TEMPERATURE");P.cpu.push({t,y:(g2?61+(num(v["CPU-TEMPERATURE"])-61)*fr:60)+1.2*day+(r()-.5)*1});
    const g3=sg("MODEM SIGNAL QUALITY"),m=fl("MDM");P.csq.push({t,y:m&&ago<m.da?null:g3?26+(num(v["MODEM SIGNAL QUALITY"].split(" ")[0])-26)*fr+(r()-.5)*1.5:24+(r()-.5)*4});
    const a=fl("AUXF");P.auxT.push({t,y:a&&ago<a.da?52+(r()-.5)*3:32+1.5*day+(r()-.5)*1});P.a12.push({t,y:a&&ago<a.da?10.8+(r()-.5)*.1:12.9+(r()-.5)*.05})}
  const pag=fl("PAG")||fl("AC");if(pag)Object.values(P).forEach(a=>a.forEach((p,k)=>{if((K-1-k)/3<pag.da)p.y=null}));
  const down=n=>{let d=0;s.f.forEach(x=>{if(x.n===n&&["MCB","RCCB","CTT"].includes(x.id))d=Math.max(d,x.da);if(["PAG","AC"].includes(x.id))d=Math.max(d,x.da)});
    s.sig.forEach(g=>{if(g.tipo==="inattiva"&&g.n===n)d=Math.max(d,g.giorni)});return d};
  const en=[0,1].map(n=>{const d=down(n);return Array.from({length:30},(_,i)=>{const ago=29-i;return ago<d?0:+(s.kwh/2*(0.3+r()*1.4)).toFixed(1)})});
  const disp=Array.from({length:30},(_,i)=>{const ago=29-i;let ok=2;[0,1].forEach(n=>{if(ago<down(n)&&!s.sig.some(g=>g.tipo==="inattiva"&&g.n===n))ok--});return ok/2});
  const o={...P,en,disp};HC.set(s.id,o);return o}
function lineChart(title,pts,lim,unit){const W=360,H=150,L=40,Rr=10,T=12,B=22,ok=pts.filter(p=>p.y!=null);
  if(!ok.length)return `<div class="chart"><div class="ct"><span>${esc(title)}</span><b class="vbad">nessun dato</b></div><div class="mute" style="padding:40px 0;text-align:center">colonnina non leggibile nel periodo</div></div>`;
  let lo=Math.min(...ok.map(p=>p.y)),hi=Math.max(...ok.map(p=>p.y));const[l0,h0]=lim||[];[l0,h0].forEach(x=>{if(x!=null){lo=Math.min(lo,x);hi=Math.max(hi,x)}});
  if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;const t0=pts[0].t,t1=pts[pts.length-1].t;
  const X=t=>L+(W-L-Rr)*(t-t0)/((t1-t0)||1),Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));let path="",pen=false;
  pts.forEach(p=>{if(p.y==null){pen=false;return}path+=(pen?"L":"M")+X(p.t).toFixed(1)+","+Y(p.y).toFixed(1);pen=true});
  const thr=[[l0,"min"],[h0,"max"]].filter(([x])=>x!=null).map(([x,n])=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(x)}" y2="${Y(x)}" class="thr"/><text x="${W-Rr-2}" y="${Y(x)-3}" text-anchor="end" class="thl">${n} ${x}</text>`).join("");
  const ticks=[lo+pad,(lo+hi)/2,hi-pad].map(v=>`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end" class="axl">${+v.toFixed(1)}</text><line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" class="gridl"/>`).join("");
  const last=pts[pts.length-1],out=last.y==null||(l0!=null&&last.y<l0)||(h0!=null&&last.y>h0);
  const dots=ok.filter((p,i)=>i%3===0).map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="5" fill="transparent"><title>${new Date(p.t).toLocaleDateString("it-IT")}: ${p.y.toFixed(2)} ${unit||""}</title></circle>`).join("");
  return `<div class="chart"><div class="ct"><span>${esc(title)}</span><b class="${out?"vbad":""}">${last.y==null?"—":last.y.toFixed(2)+" "+(unit||"")}</b></div><svg viewBox="0 0 ${W} ${H}">${ticks}${thr}<path d="${path}" class="ln"/>${dots}
   <text x="${L}" y="${H-5}" class="axl">${new Date(t0).toLocaleDateString("it-IT")}</text><text x="${W-Rr}" y="${H-5}" text-anchor="end" class="axl">oggi</text></svg></div>`}
function bars(vals,color,unit,lbl){const W=360,H=80,mx=Math.max(1,...vals),bw=(W-10)/vals.length;
  return `<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;height:auto">${vals.map((v,i)=>`<rect x="${5+i*bw+1}" y="${H-H*v/mx}" width="${bw-2}" height="${Math.max(v?2:0,H*v/mx)}" rx="2" fill="${v?color:"#ddd"}"><title>${29-i?(29-i)+" giorni fa":"oggi"}: ${v} ${unit}</title></rect>${v?"":`<rect x="${5+i*bw+1}" y="${H-3}" width="${bw-2}" height="3" fill="var(--red)"/>`}`).join("")}
   <text x="5" y="${H+13}" class="axl">30 giorni fa</text><text x="${W-5}" y="${H+13}" text-anchor="end" class="axl">oggi</text></svg>${lbl?`<small>${lbl}</small>`:""}`}
function spark(pts0,lim){const pts=[];for(let i=0;i<pts0.length;i+=3){const g=pts0.slice(i,i+3).filter(p=>p.y!=null);pts.push({t:pts0[i].t,y:g.length?g.reduce((a,p)=>a+p.y,0)/g.length:null})}const ok=pts.filter(p=>p.y!=null);if(!ok.length)return "<svg></svg>";let lo=Math.min(...ok.map(p=>p.y)),hi=Math.max(...ok.map(p=>p.y));if(hi-lo<1e-6){hi+=1;lo-=1}
  const X=i=>2+126*i/(pts.length-1),Y=y=>32-28*(y-lo)/(hi-lo);let d="",pen=false;pts.forEach((p,i)=>{if(p.y==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+","+Y(p.y).toFixed(1);pen=true});
  return `<svg viewBox="0 0 130 36"><path d="${d}" fill="none" stroke="var(--blue)" stroke-width="1.6"/></svg>`}

const AREE=[["pwr","🔌","Alimentazioni",["AC"],null,"SUPERCAP VOLTAGE"],["com","📶","Comunicazioni",["DSP","MDM","RFID","AUXC"],null,"MODEM SIGNAL QUALITY"],["head","💡","Testa (PS4GAUX)",["AUXF","TAMP"],null,"AUX TEMPERATURE"],
 ["s0","🔌","Presa sinistra",["MCB","RCCB","CTT"],0,"EVSE TASK 0 STATUS"],["s1","🔌","Presa destra",["MCB","RCCB","CTT"],1,"EVSE TASK 1 STATUS"],["cpu","🖥","Scheda principale",["PAG"],null,"CPU-TEMPERATURE"]];
function areaState(s,a){const[, , ,ids,n]=a;let st="OK";s.f.forEach(x=>{if(ids.includes(x.id)&&(n==null||x.n===n)){const v=fault(x.id).sev;st=v==="GUASTO"?"GUASTO":st==="GUASTO"?st:"ATTENZIONE"}});
  if(s.f.some(x=>x.id==="PAG"))st="GUASTO";
  s.sig.forEach(g=>{if(st!=="OK")return;if(g.tipo==="inattiva"&&g.n===n)st="ATTENZIONE";if(g.var&&g.var===a[5])st="ATTENZIONE"});return st}
function score(s){let x=100;s.f.forEach(f=>x-=fault(f.id).sev==="GUASTO"?30:12);x-=s.sig.length*8;return Math.max(0,Math.min(100,x))}
function benessere(){const s=byId(R.id),h=hist(s),v=stValues(s),sc=score(s),campo=CFG.mode==="campo",an=anomalies(s);
  const col=sc>=80?"var(--green)":sc>=50?"var(--amber)":"var(--red)",C=2*Math.PI*52;
  const ring=`<div class="ring"><svg viewBox="0 0 120 120" width="150"><circle cx="60" cy="60" r="52" fill="none" stroke="#eef0f2" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*sc/100} ${C}" transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" font-size="30" font-weight="700" fill="#1d2328">${sc}</text></svg><div style="font-weight:600">Indice di benessere</div><small>100 = nessun problema</small></div>`;
  const areas=`<div class="areas">${AREE.map(a=>{const st=areaState(s,a);return `<div class="area s-${st}" data-p2="${a[0]==="s0"||a[0]==="s1"?"prese":"col"}"><div class="at">${a[1]} ${a[2]}<span style="flex:1"></span>${st==="OK"?'<span class="led l-g"></span>':pillS(st)}</div><div class="av">${campo?(st==="OK"?"funziona":esc((anomalies(s).find(x=>a[3].includes(x.id)&&(a[4]==null||x.n===a[4]))||{}).titolo||"da controllare")):`${esc(a[5])}: <b>${esc(v[a[5]])}</b>`}</div></div>`}).join("")}</div>`;
  const en30=h.en[0].reduce((a,b)=>a+b,0)+h.en[1].reduce((a,b)=>a+b,0),disp=Math.round(100*h.disp.reduce((a,b)=>a+b,0)/30);
  const issues=an.map(a=>`<tr class="clk" data-p2="trova"><td>${pillS(a.sev)}</td><td><b>${esc(a.label)}</b><br><span class="errcode">${esc(a.err)}</span></td><td>${giorni(a.da)}</td><td>${a.ricambi.map(c=>`<span class="spc">${c}</span>`).join(" ")}</td></tr>`).join("")
    +s.sig.map(g=>`<tr><td><span class="pill p-ATTENZIONE">SEGNALE</span></td><td>🔮 ${esc(g.txt)}${g.tipo==="inattiva"?` (presa ${g.n?"destra":"sinistra"})`:""}</td><td>${g.tipo==="trend"?"soglia tra "+g.eta+" gg":g.giorni+" gg"}</td><td>${g.comp?`<span class="spc">${g.comp}</span>`:""}</td></tr>`).join("");
  const sp=[["Supercap",h.sc,"v"],["Temperatura CPU",h.cpu,"°C"],["Segnale modem (CSQ)",h.csq,""],["Temperatura testa",h.auxT,"°C"]].map(([t,p,u])=>{const l=p.filter(x=>x.y!=null),a=l[0]?.y,b=l[l.length-1]?.y,d=b-a;
    return `<div class="chart spark"><div><div style="font-size:13px" class="mute">${t}</div><b style="font-size:18px">${b==null?"—":b.toFixed(1)} ${u}</b> <small>${b==null?"":Math.abs(d)<.02*Math.abs(a||1)?"stabile":d>0?"▲ in aumento":"▼ in calo"}</small></div>${spark(p)}</div>`}).join("");
  if(campo)return heroOf(s)+`<h2 style="margin:4px 0 10px">Le parti della colonnina</h2>${areas}`+(an.length||s.sig.length?`<div class="card" style="margin-top:16px"><h5>Cosa non va</h5><div class="bd" style="padding:0"><table class="lines">${issues}</table></div></div>`:"");
  return heroOf(s)+`<div class="health">${ring}<div>${areas}</div></div>
   <div class="kpis">${kpi("Disponibilità prese 30 gg",disp+"<small>%</small>","",disp>=95?"ok":disp>=80?"warn":"bad")}${kpi("Energia erogata 30 gg",fmt(Math.round(en30))+" <small>kWh</small>","")}${kpi("Problemi aperti",an.length,"",an.length?"bad":"ok")}${kpi("Segnali predittivi",s.sig.length,"",s.sig.length?"warn":"ok")}</div>
   <div class="grid2"><div class="card"><h5>Problemi e segnali <small>clic per trovare il guasto</small></h5><div class="bd" style="padding:0">${issues?`<table class="lines">${issues}</table>`:'<div class="bd mute">Nessun problema.</div>'}</div></div>
   <div><div class="card"><h5>Valori chiave, ultimi 30 giorni<span style="flex:1"></span><button class="btn btn-o btn-sm" data-p2="and">📈 Andamento</button></h5><div class="bd" style="display:grid;gap:8px">${sp}</div></div></div></div>`}

/* ================================================================== 2. TROVA IL GUASTO (wizard dagli errori interni) */
function trova(){const s=byId(R.id),an=anomalies(s),campo=CFG.mode==="campo";
  if(!R.tw||R.tw.id!==s.id)R.tw={id:s.id,step:campo?0:1,fid:null,n:null,node:0,path:[],es:null,sost:{},note:"",fixed:false};const W=R.tw;
  const names=["Colonnina","Errore interno","Domande","Causa e ricambio","Prova finale","Chiusura"];
  const head=`<div class="wsteps">${names.map((n,i)=>(!campo&&!i)?"":`<span class="${i===W.step?"on":i<W.step?"done":""}">${i+(campo?1:0)}. ${n}</span>`).join("")}</div>`;
  const f=W.fid&&fault(W.fid),pres=W.n!=null?(W.n?" (presa destra)":" (presa sinistra)"):"";let body="";
  if(W.step===0)body=`<h2>Sei davanti alla colonnina giusta?</h2><p style="font-size:18px"><b>${s.id}</b><br>${esc(s.comune)}, ${esc(s.ind)}<br>CUID <b>${s.cuid}</b></p><p class="mute">Confronta il codice con l'etichetta sulla colonnina.</p>
    <div class="qbtns"><button class="btn btn-g btn-xl" data-t="next">Sì, è questa</button><button class="btn btn-o btn-xl" data-p2="cerca">No, cerca un'altra</button></div>`;
  if(W.step===1){const v=stValues(s);body=`<h2>${an.length?"La colonnina segnala questi errori":"La colonnina non segnala errori"}</h2><p class="mute">${an.length?"Scegli l'errore da cui partire: il più grave è in alto.":"Se il cliente segnala un problema, scegli il sintomo."}</p>
    ${an.map(a=>`<button class="errbtn" data-err="${a.id}" data-n="${a.n??""}"><span style="font-size:28px">${a.sev==="GUASTO"?"⛔":"⚠️"}</span><span style="flex:1"><span class="errcode">${esc(a.err)}</span> <small>da ${giorni(a.da)}</small><br><b style="font-size:17px">${esc(a.label)}</b><br><small>la colonnina legge ${esc(a.var)} = <b>${esc(v[a.var]??"non leggibile")}</b></small></span><span style="font-size:22px">›</span></button>`).join("")}
    <h3 style="margin:18px 0 8px;font-size:15px">${an.length?"Oppure parti da un sintomo":"Sintomi segnalati"}</h3><div style="display:flex;flex-wrap:wrap;gap:8px">${SINTOMI.map(([t,id,n])=>`<button class="btn btn-o" data-err="${id}" data-n="${n??""}">${esc(t)}</button>`).join("")}</div>
    ${campo?`<div class="qbtns"><button class="btn btn-o btn-xl" data-t="back">‹ Indietro</button></div>`:""}`}
  if(W.step===2){const nd=f.albero[W.node];body=`<div class="crumbs"><span class="errcode">${esc(f.err)}</span> ${esc(f.titolo)}${pres}${W.path.map(p=>`<div>✔ ${esc(p.q)} <b>${p.a?"Sì":"No"}</b></div>`).join("")}</div>
    <div class="qbig">${esc(nd.q)}</div><p class="mute">Domanda ${W.path.length+1}</p>
    <div class="qbtns"><button class="btn btn-g btn-xl" data-ans="1">Sì</button><button class="btn btn-r btn-xl" data-ans="0">No</button><span style="flex:1"></span><button class="btn btn-o" data-t="back">‹ Indietro</button></div>`}
  if(W.step===3){const e=W.es;body=`<div class="crumbs"><span class="errcode">${esc(f.err)}</span> ${esc(f.titolo)}${pres}${W.path.map(p=>`<div>✔ ${esc(p.q)} <b>${p.a?"Sì":"No"}</b></div>`).join("")}</div>
    <div class="esito"><div class="mute">Causa trovata</div><div class="qbig" style="margin-top:0">${esc(e.c)}</div><div style="font-size:17px"><b>Cosa fare:</b> ${esc(e.a)}</div></div>
    ${e.r.length?`<b>Ricambio da montare</b>${e.r.map(c=>`<label style="display:flex;gap:12px;align-items:center;cursor:pointer"><input type="checkbox" data-sost="${c}" ${W.sost[c]?"checked":""} style="width:24px;height:24px">${partCard(c)}</label>`).join("")}<small>Spunta il ricambio quando l'hai montato.</small>`:'<div class="note">Nessun ricambio necessario.</div>'}
    <div style="margin-top:8px">${manLink(f)}</div>
    <div class="qbtns"><button class="btn btn-o btn-xl" data-t="back">‹ Indietro</button><button class="btn btn-p btn-xl" data-t="next">Fatto: prova finale ›</button><button class="btn btn-o btn-xl" data-t="lv2">Serve secondo livello</button></div>`}
  if(W.step===4)body=`<h2>Prova finale</h2><p style="font-size:17px">Rileggo lo stato della colonnina…</p><div id="wtest" class="note">⏳ lettura in corso</div><div class="qbtns" id="wbt" style="display:none"><button class="btn btn-o btn-xl" data-t="back">‹ Indietro</button><button class="btn btn-p btn-xl" data-t="next">Avanti ›</button></div>`;
  if(W.step===5)body=`<h2>${W.fixed?"✅ Colonnina ripristinata":"⚠️ Problema non risolto"}</h2><p>${W.fixed?"L'errore interno è rientrato.":"L'intervento sarà registrato come «da completare»."}</p>
    <label>Note (facoltative)<br><textarea id="wnote" rows="3" style="width:100%">${esc(W.note)}</textarea></label><div class="qbtns"><button class="btn btn-g btn-xl" data-t="close">Registra e chiudi</button></div>`;
  if(W.step===4)setTimeout(()=>{const t=$("#wtest");if(!t)return;W.fixed=true;t.innerHTML="✅ Stato regolare: l'errore "+esc(f.err)+" non è più presente.";$("#wbt").style.display="flex"},1300);
  return `<div class="wiz">${stHead(s,"Trova il guasto").replace(/<button[^>]*data-p2="trova"[^>]*>.*?<\/button>/,"")}${head}<div class="wcard">${body}</div></div>`}

/* ================================================================== Andamento, Prese, Allarmi, System */
function andamento(){const s=byId(R.id),h=hist(s);return stHead(s,"Andamento")+`<div class="sub">Ultimi 30 giorni, una lettura ogni 8 ore. Le linee rosse tratteggiate sono le soglie delle regole.</div>
  <div class="charts">${lineChart("Tensione supercap",h.sc,[11.6,null],"v")}${lineChart("Temperatura CPU",h.cpu,[null,80],"°C")}${lineChart("Segnale modem (CSQ)",h.csq,[10,null],"")}
  ${lineChart("Temperatura testa (PS4GAUX)",h.auxT,[null,50],"°C")}${lineChart("Alimentazione testa 12 V",h.a12,[11.4,13.2],"v")}
  <div class="chart"><div class="ct"><span>Disponibilità prese per giorno</span></div>${bars(h.disp.map(x=>Math.round(x*100)),"var(--green)","%","rosso = giorni con una presa ferma")}</div></div>`}

   const row=(k,l)=>{const x=v[k.replace("{n}",n)],ld=GOOD[x]?"l-g":["OPEN","FAULTED"].includes(x)&&!k.includes("SWITCH")?"l-r":"";return `<tr><td>${l}</td><td>${ld?`<span class="led ${ld}"></span>`:""}${esc(x)}</td></tr>`};
   return `<div class="blk s-${st}"><h4>🔌 Presa ${n?"destra":"sinistra"} (${n})<span style="flex:1"></span>${st==="OK"?'<span class="led l-g"></span>':pillS(st)}</h4>
    ${an.map(a=>`<div class="bd" style="background:#fdf1f1;padding:8px 14px"><span class="errcode">${esc(a.err)}</span> <b>${esc(a.label)}</b></div>`).join("")}${g?`<div style="background:#fffaeb;padding:8px 14px">💤 Nessuna energia erogata da ${g.giorni} giorni</div>`:""}
    <table class="kv2">${row("EVSE TASK {n} STATUS","Stato")+row("EVSE TASK {n} END CHARGE RESULT","Ultimo esito ricarica")+row("SOCKET {n} POWER BREAKER","Magnetotermico")+row("SOCKET {n} DIFF.BREAKER","Differenziale")+row("SOCKET {n} POWER SWITCH","Contattore")+row("SOCKET {n} CONTROL PILOT","Control pilot")+row("SOCKET {n} PROXIMITY","Prossimità")+row("METER {n} TOTAL ACTIVE ENERGY","Contatore totale")}</table>
    <div style="padding:10px 14px"><b style="font-size:14px">Energia per giorno</b>${bars(h.en[n],"var(--blue)","kWh",`Totale 30 gg ${fmt(Math.round(h.en[n].reduce((a,b)=>a+b,0)))} kWh · giorni senza energia ${h.en[n].filter(x=>!x).length}`)}</div></div>`}).join("")}</div>`}
function allarmi(){const s=byId(R.id),r=rng(s.i*13+5),now=Date.now(),an=anomalies(s);
  const past=Array.from({length:Math.floor(r()*5)},()=>{const f=FAULTS0[Math.floor(r()*(FAULTS0.length-1))],a=10+r()*80,d=r()*3;return {f,da:now-a*DAY,a:now-(a-d)*DAY,n:f.scope==="S"?Math.floor(r()*2):null}}).sort((x,y)=>y.da-x.da);

  return stHead(s,"Allarmi")+`<div class="card"><h5>🔔 Allarmi attivi</h5><div class="bd" style="padding:0">${an.length?`<table class="lines"><tr><th>Errore interno</th><th>Significato</th><th>Presa</th><th>Gravità</th><th>Dal</th><th></th></tr>
   ${an.map(a=>`<tr><td><span class="errcode">${esc(a.err)}</span></td><td>${esc(a.titolo)}</td><td>${a.n==null?"-":a.n?"destra":"sinistra"}</td><td>${pillS(a.sev)}</td><td>${fd(now-a.da*DAY)}</td><td><button class="btn btn-o btn-sm" data-p2="trova">🔎 Trova il guasto</button></td></tr>`).join("")}</table>`:'<div class="bd mute">Nessun allarme attivo.</div>'}</div></div>
  <div class="card"><h5>🕘 Storico allarmi (90 giorni)</h5><div class="bd" style="padding:0">${past.length?`<table class="lines"><tr><th>Errore interno</th><th>Significato</th><th>Presa</th><th>Comparso</th><th>Rientrato</th></tr>${past.map(p=>`<tr><td><span class="errcode">${esc(TREES[p.f.id].err)}</span></td><td>${esc(p.f.titolo)}</td><td>${p.n==null?"-":p.n?"destra":"sinistra"}</td><td>${fd(p.da)}</td><td>${fd(p.a)}</td></tr>`).join("")}</table>`:'<div class="bd mute">Nessun allarme nello storico.</div>'}</div></div>`}
function system(){const s=byId(R.id),v=stValues(s),r=rng(s.i*17+1),dead=s.f.some(x=>x.id==="PAG"),c=cred(s),nossh=!c.fonte;
  const X=x=>dead?'<span class="mute">non leggibile</span>':x,Y=x=>dead?'<span class="mute">non leggibile</span>':nossh?'<span class="mute">SSH non eseguito</span>':x;

  ${T("🧾 Versioni",["CP VERS","CM_VERS","RVE_USR_VERS","RVE_AUX_VERS","RVE_RFID_VERS","DISPLAY_VERS"].map(k=>[k,X(esc(v[k]))]).concat([["Linux",X("4.9.88 (Yocto sumo)")]]))}
  ${T("🌐 Rete",[["Modem",X(esc(v["MODEM STATUS"]))],["Segnale",X(esc(v["MODEM SIGNAL QUALITY"]))],["Indirizzo PPP0",X(esc(v["PPP0 ADDRESS"]))],["Dati modem ricevuti / inviati",Y((20+r()*300).toFixed(1)+" / "+(5+r()*80).toFixed(1)+" MB")],["MAC eth0",Y("00:1F:7B:"+[1,2,3].map(()=>Math.floor(r()*256).toString(16).padStart(2,"0").toUpperCase()).join(":"))]])}
  ${T("⚙ Servizi (SSH)",["CP_main","PS4GAux","rfid","CM_main"].map(n=>[n,svc(n)]))}
  ${T("🖥 Sistema (SSH)",[["Acceso da",Y(Math.floor(1+r()*120)+" giorni")],["Disco /",Y(Math.floor(30+r()*40)+"% usato")],["Memoria libera",Y(W(mem+" MB",mem<20))],["Scarto orologio",Y(W(clk+" s",Math.abs(clk)>300))],["Temperatura CPU",X(esc(v["CPU-TEMPERATURE"]))],["Frequenza CPU",X(esc(v["CPU-FREQ"]))]])}
  ${T("🔌 Testa (SSH)",[["Disconnessioni USB della testa",Y(W(String(usb),usb>0))],["Ultime righe PS4GAux.log",Y('<span style="font-family:Consolas,monospace;font-size:12px">&gt; 06 00 01<br>&lt; 06 00 00 00 00 00 01 01 00</span>')]])}
  ${T("📜 CP.log (SSH)",[["Righe ERROR (ultime 500)",Y(String(s.f.length*Math.floor(3+r()*20)))],["Ultimi errori",Y(`<span style="font-family:Consolas,monospace;font-size:12px">${errs}</span>`)]])}</div>`}

/* ================================================================== 4. DIAGNOSI SU PIÙ COLONNINE (control room) */
let RUN={scope:"reg",reg:"Lazio",lista:"",ssh:true,par:20,stato:"",i:0,tgt:[],pg:0};
function runTargets(){if(RUN.scope==="tutte")return PARCO;if(RUN.scope==="reg")return PARCO.filter(s=>s.reg===RUN.reg);if(RUN.scope==="guaste")return PARCO.filter(s=>s.es!=="OK");
  const ks=RUN.lista.toUpperCase().split(/[\s,;]+/).filter(Boolean);return PARCO.filter(s=>ks.some(k=>s.id.endsWith(k)||s.cuid===k))}
function runBox(){const n=RUN.tgt.length,d=Math.min(RUN.i,n),done=RUN.tgt.slice(0,d),c={OK:0,ATTENZIONE:0,GUASTO:0,NR:0};
  done.forEach(s=>s.f.some(x=>x.id==="PAG")?c.NR++:c[s.es]++);const w=k=>n?100*c[k]/n:0;
  return `<div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>${RUN.stato==="fine"?"Diagnosi completata":"Lettura in corso…"} ${fmt(d)} / ${fmt(n)}</b><small>${RUN.par} letture in parallelo · durata stimata reale ${Math.max(1,Math.round(n*4/RUN.par/60))} min</small></div>
   <div class="prog"><i class="bg-g" style="width:${w("OK")}%"></i><i class="bg-a" style="width:${w("ATTENZIONE")}%"></i><i class="bg-r" style="width:${w("GUASTO")}%"></i><i style="width:${w("NR")}%;background:#6c757d"></i></div>
   <div class="kpis" style="margin-top:12px">${kpi("Funzionano",fmt(c.OK),"","ok")}${kpi("Da controllare",fmt(c.ATTENZIONE),"","warn")}${kpi("Da riparare",fmt(c.GUASTO),"","bad")}${kpi("Non raggiungibili",fmt(c.NR),"")}</div>`}
function diagN(){const n=runTargets().length,P=PARTS();
  const form=`<div class="card"><h5>▶ Nuova diagnosi</h5><div class="bd"><div class="filters">
    <label><input type="radio" name="sc" value="reg" ${RUN.scope==="reg"?"checked":""}> Regione</label><select id="rn-reg">${REG.map(([r])=>`<option ${RUN.reg===r?"selected":""}>${r}</option>`).join("")}</select>
    <label><input type="radio" name="sc" value="guaste" ${RUN.scope==="guaste"?"checked":""}> Solo con problemi aperti</label>

function leaves(nodes){const out=[];const walk=x=>{if(typeof x==="number")return walk(nodes[x]);if(x&&x.q){walk(x.si);walk(x.no)}else if(x&&x.c&&!out.some(o=>o.c===x.c||(o.a===x.a&&JSON.stringify(o.r)===JSON.stringify(x.r))))out.push(x)};if(nodes&&nodes.length)walk(0);return out}

let CT={n:null};

  CT.h=setInterval(()=>{CT.sec+=10;const cur=CT.sec<20?0:Math.min(16,4+CT.sec/8)+(Math.random()-.5)*.4;CT.imax=Math.max(CT.imax,cur);CT.kwh+=cur*230*10/3600/1000;
    const el=$("#clive-"+n);if(el)el.innerHTML=`<div class="livebox"><span>Stato <b>${CT.sec<20?"in attesa":"IN CARICA"}</b></span><span>Corrente <b>${cur.toFixed(1)} A</b></span><span>Energia <b>${CT.kwh.toFixed(3)} kWh</b></span><span>Tempo <b>${Math.floor(CT.sec/60)}:${String(CT.sec%60).padStart(2,"0")}</b></span></div><small class="mute">2 minuti in carica, almeno 6 A (demo ×10)</small>`;
    if(CT.sec>=240)ctStop()},1000)}
function ctStop(){if(CT.n==null)return;clearInterval(CT.h);const c=casoLoc(R.cid),n=CT.n,t=Math.max(0,CT.sec-20),ok=t>=120&&CT.imax>=6;
  const r={ok,dur:Math.floor(t/60)+":"+String(t%60).padStart(2,"0"),imax:+CT.imax.toFixed(1),kwh:+CT.kwh.toFixed(2)};c.coll.ch[n]=r;
  addAtt(c,"test",`Prova di ricarica presa ${n?"destra":"sinistra"}`,ok?"OK":"KO",`${r.dur} in carica · max ${r.imax} A · ${r.kwh} kWh`);CT={n:null};salva(c);render()}

const two=n=>String(n).padStart(2,"0");
function tstamp(min){const d=new Date(Date.now()-min*60000);return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,"0")}`}
function logsFor(s){const r=rng(s.i*101+3),has=id=>s.f.some(x=>x.id===id),L={cp:[],cm:[],aux:[],dmesg:[],journal:[]},v=stValues(s);
  for(let m=120;m>=0;m-=2){const ts=tstamp(m+r()*0.5);
    for(const n of [0,1]){const st=v[`EVSE TASK ${n} STATUS`],bad=s.f.some(x=>x.n===n&&["MCB","RCCB"].includes(x.id));L.cp.push({t:ts,l:"INFO",m:`SCK${n}: Status ${bad?"FAULTED":st}, OCPP 320, Local 320, Ireal 0`})}
    if(has("DSP")&&m%6===0)L.cp.push({t:ts,l:"ERROR",m:"CuNet: display node 0x21 no answer (timeout 500 ms), retry 3/3"});
    if(has("MCB")&&m%10===0)L.cp.push({t:ts,l:"ERROR",m:`SCK${s.f.find(x=>x.id==="MCB").n}: power breaker OPEN, socket set to FAULTED`});
    if(has("RCCB")&&m%10===0)L.cp.push({t:ts,l:"ERROR",m:`SCK${s.f.find(x=>x.id==="RCCB").n}: RCD tripped, socket set to FAULTED`});
    if(has("CTT")&&m%8===0)L.cp.push({t:ts,l:"ERROR",m:`SCK${s.f.find(x=>x.id==="CTT").n}: contactor feedback CLOSED while IDLE (welded?)`});
    if(has("RFID")&&m%12===0)L.cp.push({t:ts,l:"WARN",m:"RFID: reader not responding on /dev/ttymxc2"});
    if(has("AUXF")&&m%4===0)L.aux.push({t:ts,l:"ERROR",m:"READ_STATUS: fault 0x00000004 (fan), supply 12V=10.80"});
    if(m%4===0){L.aux.push({t:ts,l:"INFO",m:"> 06 00 01"});L.aux.push({t:ts,l:"INFO",m:has("AUXC")?"< (no answer)":`< 06 00 00 ${has("AUXF")?"04":"00"} 01 01 ${v["AUX FAN POWER"]==="ON"?"01":"00"}`})}
    if(has("AUXC")&&m%4===0)L.aux.push({t:ts,l:"ERROR",m:"ttyUSB0: open failed (No such device)"});
    if(m%10===0)L.cm.push({t:ts,l:"INFO",m:has("MDM")?"OCPP: websocket connect failed (network unreachable), retry in 60 s":"OCPP: Heartbeat.conf currentTime="+ts.slice(0,19)});
    if(has("MDM")&&m%20===0)L.cm.push({t:ts,l:"ERROR",m:"pppd: Modem hangup, connection terminated"});
    if(!has("MDM")&&m%30===0)L.cm.push({t:ts,l:"INFO",m:"OCPP: StatusNotification connectorId=1 status="+(s.f.some(x=>x.n===0)?"Faulted":"Available")});}
  L.dmesg=[{t:"[    2.104]",l:"INFO",m:"usb 1-1: FTDI USB Serial Device converter now attached to ttyUSB0"},{t:"[    3.880]",l:"INFO",m:"EXT4-fs (mmcblk0p2): mounted filesystem with ordered data mode"},{t:"[   12.442]",l:"INFO",m:"PPP generic driver version 2.4.2"}];
  if(s.f.some(x=>["USBD","AUXC"].includes(x.id)))for(let k=0;k<4;k++){L.dmesg.push({t:`[${String(3600*(k+1)+Math.round(r()*900)).padStart(9," ")}.${String(Math.round(r()*999)).padStart(3,"0")}]`,l:"WARN",m:"usb 1-1: USB disconnect, device number "+(k+2)});L.dmesg.push({t:"",l:"WARN",m:"ftdi_sio ttyUSB0: FTDI USB Serial Device converter now disconnected from ttyUSB0"})}
  L.journal=[{t:tstamp(60*24*3),l:"INFO",m:"systemd[1]: Started CP_main."},{t:tstamp(60*24*3),l:"INFO",m:"systemd[1]: Started PS4GAux."},{t:tstamp(60*24*3),l:"INFO",m:"systemd[1]: Started CM_main."}];
  if(s.f.some(x=>x.id==="AUXC"))[300,180,40].forEach(m=>L.journal.push({t:tstamp(m),l:"WARN",m:"systemd[1]: PS4GAux.service: Main process exited, code=exited, status=1/FAILURE; scheduling restart"}));
  for(const k in L)if(k!=="dmesg"&&k!=="journal")L[k].sort((a,b)=>a.t<b.t?-1:1);return L}

/* ------------------------------------------------------------------ [MOTORE] profili di modello (A1) */
const OPS_ALL={verifica:"Verifica stato operativo",resetcp:"Reset CP (programma principale)",resetcm:"Reset CM (modulo di comunicazione)",riavvio:"Riavvio colonnina",sblocco:"Sblocco presa",ocppreset:"Reset OCPP (soft)"};

const PROFILI={

    comandi:{L1:["verifica","resetcp","resetcm","riavvio"],L2:["verifica","resetcp","resetcm","riavvio","sblocco"],L3:[],SOST:[],REP:[]},
    test:{remoto:["LET","SESS"],campo:["RIL","CH0","CH1","CHK"]},na:[],wizard:true,kb:"JP21"},
  W22:{nome:"Wallbox DEMO W22",famiglia:"AC wall mount, 1 presa",stato:"Fittizio: esempio di secondo modello",prese:1,lettura:"OCPP 1.6 (simulato)",firmware:"W 3.x",
    comandi:{L1:["verifica","ocppreset"],L2:["verifica","ocppreset","sblocco"],L3:[],SOST:[],REP:[]},
    test:{remoto:["LET","SESS"],campo:["RIL","CH0","CHK"]},na:["CH1"],wizard:false,kb:"W22"},
  DC50:{nome:"Colonnina DC DEMO 50 kW",famiglia:"DC fast, CCS + CHAdeMO",stato:"Fittizio: esempio di terzo modello",prese:2,lettura:"OCPP 2.0.1 + portale costruttore (simulato)",firmware:"DC 5.x",
    comandi:{L1:["verifica"],L2:["verifica","ocppreset"],L3:[],SOST:[],REP:[]},
    test:{remoto:["LET","SESS"],campo:["RIL","CH0","CH1","CHK"]},na:[],wizard:false,kb:"DC50"},
  GEN:{nome:"Profilo generico",famiglia:"modello non riconosciuto",stato:"Sola lettura, nessun comando",prese:null,lettura:"nessuna lettura automatica: solo osservazioni",firmware:"-",
    comandi:{L1:[],L2:[],L3:[],SOST:[],REP:[]},test:{remoto:[],campo:["CHK"]},na:[],wizard:false,kb:null},

const profiloDi=modello=>Object.entries(PROFILI).find(([k,p])=>p.nome===modello)?.[0]||"GEN";
const ANAG_EXTRA={"WB22-000731":{modello:"W22",sito:"Parcheggio aziendale, Bologna"},"WB22-000912":{modello:"W22",sito:"Condominio, Torino"},"DC50-001204":{modello:"DC50",sito:"Area di servizio A1, Lodi"}};
/* dal seriale (o CUID) al profilo: anagrafica d'esempio, in produzione sorgente aziendale (domanda aperta 1) */
function identifica(q){q=(q||"").trim().toUpperCase();if(!q)return null;
  const s=PARCO.find(x=>snOf(x)===q||x.cuid===q||x.id===q);if(s)return {q,prof:"JP21",fonte:"anagrafica",s,avvisi:[]};
  if(ANAG_EXTRA[q])return {q,prof:ANAG_EXTRA[q].modello,fonte:"anagrafica",sito:ANAG_EXTRA[q].sito,avvisi:["Nessuna lettura reale disponibile nella demo per questo modello"]};
  const like21=/^SN-[A-Z]{2}-4\d{6}$/.test(q);
  return {q,prof:"GEN",fonte:"non trovato",avvisi:[like21?"Il formato è quello delle 2.1 ma il seriale non è in anagrafica: possibile errore di battitura o stazione non censita.":"Seriale non riconosciuto dall'anagrafica."]}}

/* ------------------------------------------------------------------ [MOTORE] ciclo di vita dei comandi (A5) */
const CMD_ST=["Richiesto","Inviato","Ricevuto","Eseguito","Risposta","Verificato"];
function nxComando(c,k,tool){const s=byId(c.stz.id),label=OPS_ALL[k]||k,base=Date.now();let off=0;const T=sec=>{off+=sec;return new Date(base+off*1000).toLocaleTimeString("it-IT")};
  const cmd={id:"CMD-"+String((CFG.ncmd=(CFG.ncmd||7300)+1)),op:k,label,tool,area:CFG.area,caso:c.id,stz:s.id,t:nowS(),stati:[{s:"Richiesto",t:T(0),d:"motivo: "+(c.sintomo||"")}]};
  const noData=s.f.some(x=>x.id==="PAG");
  cmd.stati.push({s:"Inviato",t:T(1),d:"tramite "+tool});
  if(noData&&k!=="verifica"){cmd.stati.push({s:"Scaduto",t:T(120),d:"nessuna conferma di ricezione entro 120 s"});cmd.esito="SCADUTO";cmd.discr="Comando inviato ma mai ricevuto: la stazione non è raggiungibile in rete dati"}
  else{cmd.stati.push({s:"Ricevuto",t:T(2),d:"ack della stazione"});
    const temp=s.f.filter(x=>leaves(fault(x.id).albero||[]).some(l=>/temporaneo/i.test(l.c))).map(x=>x.id);if((k==="riavvio"||k==="resetcm")&&temp.length)fixFault(s,temp);
    cmd.stati.push({s:"Eseguito",t:T(k==="riavvio"?95:6),d:"la stazione dichiara l'esecuzione"});cmd.stati.push({s:"Risposta",t:T(1),d:"OK"});
    const ri=lettura(c,"Rilettura dopo: "+label);
    if(ri.esito==="OK"){cmd.stati.push({s:"Verificato",t:T(30),d:"rilettura senza errori"});cmd.esito="VERIFICATO"}
    else{cmd.esito="DISCREPANZA";cmd.discr="Comando dichiarato eseguito ma lo stato letto dopo non è cambiato";cmd.stati.push({s:"Non verificato",t:T(30),d:"errore ancora presente"})}}
  (c.cmd=c.cmd||[]).push(cmd);
  addAtt(c,"comando",label,cmd.esito==="VERIFICATO"?"OK":"KO",cmd.stati.map(x=>x.s.toLowerCase()).join(" → ")+` · ${cmd.esito}${cmd.discr?" · "+cmd.discr:""} · ${cmd.id} via ${tool}`);
  salva(c);return cmd}
function cmdStepper(cmd){return `<div class="cmdst">${cmd.stati.map(x=>`<span class="${/Scaduto|Non verificato/.test(x.s)?"ko":""}" title="${esc(x.t+" · "+x.d)}">${x.s} <small style="color:inherit;opacity:.7">${x.t}</small></span>`).join("")}${cmd.esito==="SCADUTO"?["Ricevuto","Eseguito","Risposta","Verificato"].map(z=>`<span class="no">${z}</span>`).join(""):""}</div>`}

/* ------------------------------------------------------------------ [MOTORE] statino standard (A2) */
const TRES={PASS:"PASS",FAIL:"FAIL",NT:"NOT TESTED",NA:"NOT APPLICABLE"};
const trPill=r=>`<span class="tr tr-${r}">${TRES[r]}</span>`;
function nxTestRes(c,area,id){const P=PROFILI[profiloDi(c.stz.modello)],ov=(c.nxt||{})[area]?.[id];if(ov)return {r:ov.r,ev:"impostato da operatore: "+(ov.m||"-"),man:true};
  if(P.na.includes(id))return {r:"NA",ev:"non previsto dal profilo "+P.nome};
  const A=c.att.filter(a=>a.area===area),last=f=>[...A].reverse().find(f),R=(a,ev)=>a?{r:a.esito==="OK"?"PASS":a.esito==="KO"?"FAIL":"NT",ev:ev||(a.t+" · "+a.titolo)}:{r:"NT",ev:"nessuna evidenza in questa fase"};
  const collNew=last(a=>a.tipo==="test"&&/^Collaudo nuova stazione/.test(a.titolo));
  switch(id){
    case "LET":return R(last(a=>a.tipo==="lettura"));
    case "CMDV":{const cm=(c.cmd||[]).filter(x=>x.area===area).pop();if(cm)return {r:cm.esito==="VERIFICATO"?"PASS":"FAIL",ev:`${cm.id} ${cm.label}: ${cm.esito}`};return R(last(a=>a.tipo==="comando"))}
    case "SESS":return R(last(a=>a.tipo==="test"&&/^Sessione di ricarica di verifica/.test(a.titolo)));
    case "CUID":return R(last(a=>a.tipo==="arrivo"||(a.tipo==="lettura"&&/nuova stazione/i.test(a.titolo))));
    case "RIL":return collNew?R(collNew):R(last(a=>a.tipo==="lettura"&&/collaudo/i.test(a.titolo)));
    case "CH0":return collNew?R(collNew):R(last(a=>a.tipo==="test"&&/presa sinistra/.test(a.titolo)));
    case "CH1":return collNew?R(collNew):R(last(a=>a.tipo==="test"&&/presa destra/.test(a.titolo)));
    case "CHK":return collNew?R(collNew):R(last(a=>a.tipo==="test"&&/^Controlli/.test(a.titolo)));
    case "SER":return R(last(a=>a.tipo==="sostituzione"));
    case "BANCO":return R(last(a=>a.tipo==="riparazione"&&/banco/i.test(a.titolo)));}
  return {r:"NT",ev:""}}
/* guasto risolto: verificato solo se un set completo di test obbligatori del profilo è PASS (campo oppure da remoto) */
function nxVerifica(c){const P=PROFILI[profiloDi(c.stz.modello)];const ok=(area,ids)=>ids.every(id=>["PASS","NA"].includes(nxTestRes(c,area,id).r));
  for(const a of ["L3","SOST"])if(c.att.some(x=>x.area===a)&&ok(a,P.test.campo))return {ok:true,via:`collaudo in campo (${AREA_SIG(a)}): ${P.test.campo.join(", ")}`};
  for(const a of ["L1","L2"])if(c.att.some(x=>x.area===a)&&P.test.remoto.length&&ok(a,P.test.remoto))return {ok:true,via:`verifica da remoto (${a}): ${P.test.remoto.join(", ")}`};
  const miss=[];const fa=["L3","SOST"].find(a=>c.att.some(x=>x.area===a));
  if(fa)P.test.campo.forEach(id=>{const r=nxTestRes(c,fa,id).r;if(!["PASS","NA"].includes(r))miss.push(`${TESTS[id].nome} (${TRES[r]})`)});
  else{const ra=["L2","L1"].find(a=>c.att.some(x=>x.area===a))||"L1";P.test.remoto.forEach(id=>{const r=nxTestRes(c,ra,id).r;if(r!=="PASS")miss.push(`${TESTS[id].nome} (${TRES[r]})`)})}
  return {ok:false,miss}}
function nxAttivita(c,area){const A=c.att.filter(a=>a.area===area);if(!A.length)return {v:"Non coinvolta",cls:""};
  const fine=A.some(a=>["inoltro","chiusura","esito"].includes(a.tipo)||(area==="REP"&&a.tipo==="esito"));return fine?{v:"Sì, completata",cls:"ok"}:{v:"In corso",cls:"wip"}}
function nxStatinoPage(c){const aree=[...new Set(c.att.map(a=>a.area))];const fase=R.sfase&&aree.includes(R.sfase)?R.sfase:(aree.includes(CFG.area)?CFG.area:aree[aree.length-1]);
  const P=PROFILI[profiloDi(c.stz.modello)],A=c.att.filter(a=>a.area===fase),tids=Object.keys(TESTS).filter(id=>TESTS[id].fasi.includes(fase));
  const first=A.find(a=>a.tipo==="lettura"),lastL=[...A].reverse().find(a=>a.tipo==="lettura"),att=nxAttivita(c,fase),ver=nxVerifica(c);
  const inol=[...A].reverse().find(a=>a.tipo==="inoltro"),cmds=(c.cmd||[]).filter(x=>x.area===fase),legacy=A.filter(a=>a.tipo==="comando"&&!cmds.some(x=>a.det.includes(x.id)));
  const firm=[...A].reverse().find(a=>a.tipo==="statino");const chiuso=["RISOLTO","CHIUSO","RIPARATA"].includes(c.stato);
  const body={caso:c.id,fase,att:A.map(a=>a.h),test:tids.map(id=>[id,nxTestRes(c,fase,id).r])};
  return `<div class="noprint filters"><button class="btn btn-o" data-cdoc="">‹ Torna al caso</button><span class="mute">Fase:</span>${aree.map(a=>`<button class="btn btn-sm ${a===fase?"btn-p":"btn-o"}" data-sfase="${a}">${AREA_SIG(a)}</button>`).join("")}<span style="flex:1"></span>
   ${fase===CFG.area?`<button class="btn btn-g" data-nxfirma="${fase}">✍ Firma statino ${AREA_SIG(fase)}</button>`:""}<button class="btn btn-p" onclick="window.print()">🖨 Stampa / PDF</button></div>
  <div class="rep"><div style="display:flex;justify-content:space-between;border-bottom:3px solid #1d2328;padding-bottom:8px;margin-bottom:10px"><div><div class="mute">${esc(NX().brand.nome)} · statino standard · ${AREA_SIG(fase)} ${AREA_NOME(fase)}</div><h1 style="margin:2px 0">${c.id} · ${AREA_SIG(fase)}</h1><div>${esc(c.fonte)} · «${esc(c.sintomo)}»</div></div><div style="text-align:right">${statoPill(c.stato)}<br><small>modello statino 1.0 · uguale per tutte le fasi</small></div></div>
  <table class="lines"><tr><td style="width:22%"><b>Identità</b></td><td>${esc(c.stz.id)} · ${esc(c.stz.modello)} · seriale ${esc(c.stz.sn)} · CUID ${esc(c.stz.cuid)} · ${esc(c.stz.comune)}, ${esc(c.stz.ind)}</td></tr>
   <tr><td><b>Caso</b></td><td>${c.id} · XCustomer ${esc(c.ext.xc||"-")} · Salesforce ${esc(c.ext.sf||"-")} · ordine di lavoro ${esc(c.ext.wo||"-")}</td></tr>
   <tr><td><b>Chi e quando</b></td><td>${esc(UTENTI[fase]||"-")} · ${AREA_NOME(fase)} · ${A.length?esc(A[0].t)+" → "+esc(A[A.length-1].t):"-"}</td></tr>
   <tr><td><b>Problema iniziale</b></td><td>${esc(c.sintomo)}${first?` · <small>${esc(first.det.slice(0,160))}</small>`:""}</td></tr>
   <tr><td><b>Stato prima / dopo</b></td><td>${first?`${first.esito==="OK"?"✅":"⛔"} ${esc(first.t)}`:"nessuna lettura"} → ${lastL&&lastL!==first?`${lastL.esito==="OK"?"✅":"⛔"} ${esc(lastL.t)} <small>${esc(lastL.det.slice(0,120))}</small>`:"nessuna lettura successiva"}</td></tr></table>
  <h3>Comandi</h3>${cmds.length||legacy.length?`<table class="lines"><tr><th>Comando</th><th>Ciclo di vita</th><th>Esito</th></tr>${cmds.map(x=>`<tr><td>${esc(x.label)}<br><small>${x.id} · ${esc(x.tool)}</small></td><td>${cmdStepper(x)}${x.discr?`<small style="color:var(--red)">⚠ ${esc(x.discr)}</small>`:""}</td><td><b>${x.esito}</b></td></tr>`).join("")}${legacy.map(a=>`<tr><td>${esc(a.titolo)}</td><td><small>${esc(a.det)}</small><br><small class="mute">registrato prima del ciclo di vita: stati non disponibili</small></td><td>${a.esito}</td></tr>`).join("")}</table>`:'<p class="mute">Nessun comando in questa fase.</p>'}
  <h3>Test</h3><table class="lines"><tr><th>Test</th><th>Esito</th><th>Evidenza</th><th class="noprint">Imposta</th></tr>${tids.map(id=>{const x=nxTestRes(c,fase,id),obb=P.test.campo.includes(id)||P.test.remoto.includes(id);return `<tr><td>${esc(TESTS[id].nome)} <small>${id}${obb?" · obbligatorio":""}</small></td><td>${trPill(x.r)}</td><td><small>${esc(x.ev)}</small>${obb&&x.r!=="NA"?"":""}</td>
    <td class="noprint">${fase===CFG.area?`<select data-nxov="${id}" style="font-size:12px"><option value="">automatico</option>${TESTS[id].tipo==="manuale"?'<option value="PASS">PASS</option><option value="FAIL">FAIL</option>':""}<option value="NT" ${x.man&&x.r==="NT"?"selected":""}>NOT TESTED</option>${obb?"":`<option value="NA" ${x.man&&x.r==="NA"?"selected":""}>NOT APPLICABLE</option>`}</select>`:""}</td></tr>`}).join("")||'<tr><td colspan="4" class="mute">Nessun test previsto per questa fase.</td></tr>'}</table>
  <h3>Esito</h3><div class="es2"><div class="${att.cls}"><div class="t">Attività completata (${AREA_SIG(fase)})</div><div class="v">${att.v}</div><small>Dice se questa fase ha fatto il suo lavoro.</small></div>
   <div class="${ver.ok?"ok":"ko"}"><div class="t">Guasto risolto (intero caso)</div><div class="v">${ver.ok?"✅ Verificato":"Non verificato"}</div><small>${ver.ok?esc(ver.via):"Mancano: "+esc(ver.miss.join("; ")||"-")}</small></div></div>

const isTemp=x=>x&&x.c&&/temporaneo|Blocco/i.test(x.c);
function nxGraph(c,area){const s=byId(c.stz.id),an=anomalies(s),f=an.length?fault(an[0].id):null,G={};
  G.let={tipo:"lettura",t:area==="L3"?"Leggi la colonnina sul posto":"Leggi la colonnina da remoto"};
  if(!f){G.nessun={tipo:"decisione",t:"Nessun errore attivo",d:{c:"Nessun errore attivo letto",a:area==="L3"?"Verifica il sintomo sul posto: passa in modalità manuale e registra cosa osservi":"Verifica con una sessione di ricarica e, se il cliente conferma, chiudi",r:[]}};return {G,f}}
  if(area==="L2"){G.kb={tipo:"scheda",t:"Leggi la scheda della Knowledge Base",kb:"KB-"+f.id,next:"rem"};
    const L=leaves(f.albero||[]);G.rem={tipo:"domanda",t:"Esiste una causa risolvibile da remoto?",auto:()=>L.some(isTemp),si:"cmd",no:"wo"};
    G.cmd={tipo:"comando",t:"Richiedi un comando remoto ammesso e verifica",ops:["resetcm","riavvio"],next:"chk"};
    G.chk={tipo:"lettura",t:"Rileggi dopo il comando",si:"ok",no:"wo"};
    G.ok={tipo:"decisione",t:"Risolvibile da remoto",d:{c:"Blocco temporaneo",a:"Fai la sessione di ricarica di verifica, poi «Risolto da remoto»",r:[]}};
    const cs=causesFor(f);G.wo={tipo:"decisione",t:"Serve un intervento in campo",d:{c:cs[0]?.c||f.causa,a:"Crea l'ordine di lavoro per L3 con i ricambi indicati",r:[...new Set(cs.flatMap(x=>x.r||[]))]}};return {G,f}}
  /* L3: le domande dell'albero diventano nodi; le foglie diventano decisioni */
  let k=0;const leafId=x=>{const id="d"+(k++);G[id]={tipo:"decisione",t:"Causa individuata",d:x};return id};
  (f.albero||[]).forEach((n,i)=>{G["q"+i]={tipo:"domanda",t:n.q,si:typeof n.si==="number"?"q"+n.si:leafId(n.si),no:typeof n.no==="number"?"q"+n.no:leafId(n.no),tmp:isTemp(n.si)}});
  G.let.si="q0";return {G,f}}

function nxWizard(c){const W=nxWz(c),{G,f}=nxGraph(c,CFG.area),n=G[W.cur]||G.let,P=PROFILI[profiloDi(c.stz.modello)];

  const crumbs=W.path.length?`<div class="crumbs">${W.path.map(p=>`<div>${p.auto?"⚡":"✔"} ${esc(p.t)} <b>${esc(p.r)}</b>${p.auto?` <small>${esc(p.auto)}</small>`:""}</div>`).join("")}</div>`:"";
  if(!P.wizard&&W.mode==="guidato")return `<div class="wz">${head}<p>Il profilo <b>${esc(P.nome)}</b> non ha ancora un wizard validato: usa la modalità manuale.</p></div>`;
  if(W.mode==="manuale")return `<div class="wz">${head}${crumbs}<div style="display:grid;grid-template-columns:160px 1fr auto;gap:6px;align-items:end"><label>Tipo<br><select id="nxm-t" style="width:100%"><option>Osservazione</option><option>Misura</option><option>Azione</option></select></label><label>Cosa hai visto o fatto<br><input type="text" id="nxm-x" style="width:100%" placeholder="es. connettore schermo ossidato, pulito e reinserito"></label><button class="btn btn-p" data-nxman="1">Registra</button></div>

  if(n.tipo==="comando")act=n.ops.filter(o=>P.comandi[CFG.area]?.includes(o)).map(o=>`<button class="btn btn-o" data-nxw="cmd" data-op="${o}">${OPS_ALL[o]}</button>`).join(" ")||'<span class="mute">Nessun comando ammesso a questo livello per il profilo.</span>';
  if(n.tipo==="decisione"){const d=n.d;act=`<div class="esito" style="padding:10px 12px;margin:0"><b>Causa:</b> ${esc(d.c)} · <b>Cosa fare:</b> ${esc(d.a)}${(d.r||[]).length?`<br><b>Ricambi:</b> ${d.r.map(x=>`<span class="spc">${x}</span>`).join(" ")}`:""}${f?` <button class="btn btn-o btn-sm" data-kb="KB-${f.id}">📚 Scheda</button>`:""}</div>${CFG.area==="L3"?'<small class="mute">Prosegui con componenti e collaudo obbligatorio qui sotto.</small>':""}`}
  return `<div class="wz">${head}${crumbs}<div><span class="ty">${ty}</span><span class="qbig" style="font-size:17px">${esc(n.t)}</span></div><div class="qbtns" style="margin-top:8px">${act}</div>
   <div style="margin-top:6px"><button class="btn btn-o btn-sm" data-nxw="reset">↺ Ricomincia</button> <small class="mute">⚡ = passo saltato o risolto in automatico dal motore</small></div></div>`}
function nxWStep(c,act,op){const W=nxWz(c),{G,f}=nxGraph(c,CFG.area);let n=G[W.cur]||G.let;const go2=(id,r,auto)=>{W.path.push({t:n.t,r,auto});W.cur=id;n=G[id]};
  if(act==="reset"){W.cur="let";W.path=[];if(c.t3)c.t3.es=null;salva(c);return}
  const np=W.path.length+(["leggi","avanti","cmd"].includes(act)?1:0);
  if(act==="leggi"){const r=lettura(c,CFG.area==="L3"?"Lettura sul posto (wizard)":"Lettura (wizard)");const ko=r.esito==="KO";
    if(W.cur==="chk"){go2(ko?n.no:n.si,ko?"errore ancora presente":"senza errori")}else if(!f)go2("nessun","nessun errore");else go2(CFG.area==="L2"?"kb":"q0",ko?"errore confermato":"nessun errore")}
  else if(act==="avanti")go2(n.next,"letta");
  else if(act==="si"||act==="no")go2(act==="si"?n.si:n.no,act==="si"?"Sì":"No");
  else if(act==="cmd"){const cm=nxComando(c,op,"Backend CM");go2(n.next,cm.esito)}
  /* passi automatici: domande con risposta già nota (dal motore o da fasi precedenti) */
  for(let i=0;i<6&&n;i++){
    if(n.tipo==="domanda"&&n.auto){const v=n.auto();go2(v?n.si:n.no,v?"Sì":"No","dal profilo: "+(v?"esiste una causa temporanea nell'albero":"nessuna causa temporanea"));continue}
    if(n.tipo==="domanda"&&n.tmp&&c.att.some(a=>a.tipo==="comando"&&/Riavvio|Reset/i.test(a.titolo)&&a.esito==="KO")){go2(n.no,"No","saltata: riavvio o reset già fatto da remoto senza effetto");continue}
    break}
  W.path.slice(np).forEach(p=>addAtt(c,"domanda",p.t,"INFO","risposta: "+p.r+(p.auto?" · "+p.auto:"")));
  if(n&&n.tipo==="decisione"){addAtt(c,"diagnosi","Wizard: "+n.d.c,"INFO",n.d.a);if(CFG.area==="L3"){c.t3=c.t3||{node:0,path:[],es:null};c.t3.es=n.d}}
  salva(c)}
