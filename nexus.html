<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS · Manutenzione 2.1</title>
<style>
:root{--side:#1f2429;--side2:#343a40;--top:#15181b;--bg:#f2f3f5;--card:#fff;--line:#dfe3e8;--ink:#1d2328;--mute:#68717a;--blue:#2a78d6;--red:#d63a3a;--green:#1e9e45;--amber:#e0a800}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
#top{height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:6}
#top .brand{font-weight:700;font-size:18px;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700}
.b-yel{background:#ffc107;color:#212529}
.modes{display:flex;background:#2b3035;border-radius:6px;padding:3px;margin-left:12px}
.modes button{border:0;background:transparent;color:#cfd4d9;padding:6px 14px;border-radius:4px;font:inherit;cursor:pointer;font-weight:600}
.modes button.on{background:#fff;color:#1d2328}
#clock{flex:1;text-align:right;color:#ffffff88;font-size:13px}
#wrap{display:flex;min-height:calc(100vh - 56px)}
#side{width:236px;background:var(--side);padding:10px 0;flex-shrink:0}
#side a{display:flex;align-items:center;gap:10px;color:#ffffffa0;text-decoration:none;padding:11px 18px}
#side a:hover{color:#fff}#side a.on{color:#fff;background:var(--side2);border-left:3px solid var(--blue);padding-left:15px}
#side .sec{color:#ffffff55;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:14px 18px 4px}
#side .ic{width:20px;text-align:center}
#main{flex:1;padding:18px 22px;min-width:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}
.sub{color:var(--mute);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:16px;overflow:hidden}
.card>h5{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8f9fa;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>.bd{padding:12px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.3px}
.lines td{border-bottom:1px solid var(--line)}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f2f6fc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-GUASTO{background:#f8d7da;color:#842029}.p-ATTENZIONE{background:#fff3cd;color:#664d03}.p-OK{background:#d1e7dd;color:#0f5132}.p-INFO{background:#e2e6ea;color:#41464b}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;padding:7px 14px;border-radius:5px;font:inherit;cursor:pointer;text-decoration:none;line-height:1.3}
.btn-p{background:var(--blue);color:#fff}.btn-g{background:var(--green);color:#fff}.btn-r{background:var(--red);color:#fff}.btn-o{background:#fff;border-color:#c9cfd6;color:var(--ink)}
.btn-sm{padding:3px 9px;font-size:13px}.btn-xl{padding:14px 22px;font-size:18px;font-weight:600;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],select,textarea{font:inherit;padding:6px 9px;border:1px solid #c9cfd6;border-radius:5px;background:#fff}
.mute{color:var(--mute)}small{color:var(--mute)}
.note{background:#fff8e1;border:1px solid #ffe08a;border-radius:6px;padding:9px 13px;margin-bottom:14px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:6px;padding:10px 14px}
.kpi.ok{border-top-color:var(--green)}.kpi.bad{border-top-color:var(--red)}.kpi.warn{border-top-color:var(--amber)}
.kl{font-size:13px;color:var(--mute)}.kv{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}.kv small{font-size:15px;font-weight:400}.ks{font-size:12px;color:var(--mute)}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:#eef0f2;min-width:80px}.bar i{display:block;height:100%}
.bg-r{background:var(--red)}.bg-a{background:var(--amber)}.bg-g{background:var(--green)}.bg-b{background:var(--blue)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:11px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.spc{font-family:Consolas,monospace;font-weight:700;font-size:12px;padding:1px 6px;border:1px solid #ffd666;border-radius:3px;background:#fff8e1;color:#6b4e00;white-space:nowrap}
.man{font-size:12px;text-decoration:none;padding:1px 7px;border:1px solid #9ec5fe;border-radius:3px;background:#e7f1ff;color:#0a58ca;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
/* colonnina */
.hero{display:flex;gap:16px;align-items:center;border-radius:8px;padding:16px 20px;margin-bottom:16px;color:#fff}
.hero.h-OK{background:#1e8b42}.hero.h-ATTENZIONE{background:#b98900}.hero.h-GUASTO{background:#c0352f}
.hero .big{font-size:26px;font-weight:700;line-height:1.2}.hero .ico{font-size:44px}
.todo{border:2px solid #f1c2c2;background:#fff;border-radius:8px;margin-bottom:14px;overflow:hidden}
.todo.w{border-color:#ffe08a}
.todo .th{padding:12px 16px;background:#fdf1f1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.todo.w .th{background:#fffaeb}
.todo .tb{padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}
@media(max-width:900px){.todo .tb{grid-template-columns:1fr}}
.steps{margin:6px 0 0;padding-left:22px}.steps li{margin:4px 0}
.partcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px;background:#fafbfc}
.partcard .code{white-space:nowrap;font-family:Consolas,monospace;font-size:19px;font-weight:700;color:#6b4e00;background:#fff3c4;padding:1px 8px;border-radius:4px}
.photo{width:84px;height:64px;border-radius:6px;background:repeating-linear-gradient(45deg,#eceff2,#eceff2 7px,#f7f8f9 7px,#f7f8f9 14px);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.blk{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px;overflow:hidden}
.blk.s-GUASTO{border-left-color:var(--red)}.blk.s-ATTENZIONE{border-left-color:var(--amber)}
.blk h4{margin:0;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:15px;background:#f8f9fa;border-bottom:1px solid var(--line)}
.blk .bphoto{height:110px;background-size:cover;background-position:center;border-bottom:1px solid var(--line)}
.kv2 td{padding:4px 14px;font-size:14px;border-bottom:1px solid #f0f2f4}.kv2 td:first-child{color:#4a535b;width:56%}
.v-bad{color:#a11d1d;font-weight:700}.v-warn{color:#7a5a00;font-weight:700}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}.l-g{background:var(--green)}.l-r{background:var(--red)}.l-a{background:var(--amber)}.l-x{background:#adb5bd}
.dtab td{padding:3px 8px;border:2px solid #fff;background:#eceeef;font-size:13px}.dtab th{background:#343a40;color:#fff;text-align:center;border:2px solid #fff}
/* campo */
.search{display:flex;gap:10px;max-width:760px}.search input{flex:1;font-size:20px;padding:14px 16px;border-radius:8px}
.reslist .r{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px;cursor:pointer}
.reslist .r:hover{border-color:var(--blue)}
.wiz{max-width:900px}.wsteps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.wsteps span{padding:6px 12px;border-radius:16px;background:#e9ecef;font-size:13px}.wsteps span.on{background:var(--blue);color:#fff}.wsteps span.done{background:#d1e7dd;color:#0f5132}
.wcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
.qbtns{display:flex;gap:12px;margin-top:16px}
.chk li{list-style:none;margin:8px 0;font-size:17px}.chk{padding:0}.chk input{width:22px;height:22px;vertical-align:-4px;margin-right:10px}
/* configurazione */
.cfgt td{padding:4px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.cfgt input,.cfgt textarea{width:100%;font-size:13px;padding:4px 6px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}.tabs button{border:0;background:transparent;padding:9px 14px;font:inherit;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
/* report */
.rep{background:#fff;max-width:900px;margin:0 auto;padding:28px 34px;border:1px solid var(--line)}
.rep h1{font-size:22px}.rep h3{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #1d2328;padding-bottom:3px}
.rep table td,.rep table th{border-bottom:1px solid #ddd;font-size:13px;padding:4px 6px}
.sheet{border:1px solid #bbb;border-radius:6px;padding:14px 16px;margin-bottom:14px;break-inside:avoid}
.sheet .sh{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding-bottom:6px;margin-bottom:8px}
.box{display:inline-block;width:15px;height:15px;border:2px solid #555;border-radius:3px;vertical-align:-3px;margin-right:6px}
/* benessere, grafici, diagnosi massiva */
.sthead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.sthead h1{margin:0}
.health{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;margin-bottom:16px}@media(max-width:900px){.health{grid-template-columns:1fr}}
.ring{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.area{background:#fff;border:1px solid var(--line);border-top:5px solid var(--green);border-radius:8px;padding:10px 14px;cursor:pointer}.area:hover{border-color:var(--blue)}
.area.s-GUASTO{border-top-color:var(--red)}.area.s-ATTENZIONE{border-top-color:var(--amber)}
.area .at{font-weight:600;display:flex;gap:6px;align-items:center}.area .av{font-size:13px;color:var(--mute);margin-top:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.chart{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px}.chart .ct{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.chart svg{width:100%;height:auto;display:block}.ln{fill:none;stroke:var(--blue);stroke-width:2}.thr{stroke:var(--red);stroke-dasharray:5 4;stroke-width:1.2}.thl{font-size:10px;fill:var(--red)}
.axl{font-size:10px;fill:#8a939b}.gridl{stroke:#eef0f2}.vbad{color:var(--red)}
.spark{display:flex;gap:10px;align-items:center;justify-content:space-between}.spark svg{width:130px;height:36px}
.prog{height:22px;background:#e9ecef;border-radius:11px;overflow:hidden;display:flex}.prog i{display:block;height:100%;transition:width .1s}
.errbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px;cursor:pointer;font:inherit}
.errbtn:hover{border-color:var(--blue);background:#f5f9ff}.errcode{font-family:Consolas,monospace;font-size:12px;background:#212529;color:#ffc107;padding:2px 7px;border-radius:3px}
.crumbs{font-size:14px;color:var(--mute);margin-bottom:10px}.crumbs div{margin:3px 0}
.qbig{font-size:22px;font-weight:600;margin:6px 0 4px}
.esito{border:2px solid #9fd3b0;background:#f2fbf5;border-radius:10px;padding:16px 18px;margin-bottom:12px}
.flow{display:flex;align-items:center;gap:4px;margin:6px 0 14px;flex-wrap:wrap}.flow .fs{padding:7px 12px;border-radius:18px;background:#e9ecef;font-size:13px;font-weight:600;color:#5d666e}
.flow .fs.done{background:#d1e7dd;color:#0f5132}.flow .fs.on{background:var(--blue);color:#fff}.flow .fs.bad{background:var(--red);color:#fff}.flow .fa{color:#adb5bd;font-weight:700}
.sfbox{white-space:pre-wrap;background:#f6f8fa;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:12.5px/1.45 Consolas,monospace;margin:10px 0}
.codebox{white-space:nowrap;font:700 22px Consolas,monospace;border:3px solid #1d2328;padding:4px 10px;border-radius:6px;letter-spacing:1px}
.ctest{border:2px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}.ctest.ok{border-color:#9fd3b0;background:#f2fbf5}.ctest.ko{border-color:#f1c2c2;background:#fdf1f1}
.ctest .cth{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.livebox{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:8px;font-size:14px}
.areas5{display:flex;gap:2px;background:#2b3035;border-radius:6px;padding:3px;margin-left:12px;align-items:center;flex-wrap:wrap}.areas5 button{border:0;background:transparent;color:#cfd4d9;padding:6px 10px;border-radius:4px;font:inherit;font-size:13px;cursor:pointer;font-weight:600}.areas5 button.on{background:#fff;color:#1d2328}
.flow5{display:flex;align-items:stretch;gap:6px;margin:10px 0 18px;flex-wrap:wrap}.f5{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-top:5px solid #999;border-radius:8px;padding:10px;text-align:center;cursor:pointer}.f5.on{box-shadow:0 0 0 2px var(--blue)}.f5a{display:flex;flex-direction:column;justify-content:center;align-items:center;color:#8a939b;font-weight:700}.f5a small{font-weight:400;font-size:10.5px}
.fase{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:#e7f1ff;color:#0a58ca;margin-left:6px;vertical-align:1px}
.tl td{font-size:13.5px;vertical-align:top}.mono{font-family:Consolas,monospace}
.logbox{background:#0f1419;color:#d6dde3;border-radius:6px;padding:10px 12px;font:12px/1.5 Consolas,monospace;max-height:560px;overflow:auto;margin:8px 0}
.ll{white-space:pre-wrap}.ll .lt{color:#7d8a96}.ll .lv{display:inline-block;width:46px;color:#7d8a96}.ll.l-ERROR{color:#ff8a80}.ll.l-ERROR .lv{color:#ff5252;font-weight:700}.ll.l-WARN{color:#ffd180}.ll.l-WARN .lv{color:#ffab40;font-weight:700}
.term{background:#0f1419;color:#d6dde3;border-radius:6px;padding:12px 14px;font:12.5px/1.5 Consolas,monospace;white-space:pre-wrap;min-height:360px}
.toast{pointer-events:none;position:fixed;right:16px;bottom:16px;background:#212529;color:#fff;padding:10px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:30}.toast.on{opacity:.95}
@media print{#top,#side,.noprint,.toast{display:none!important}#main{padding:0}body{background:#fff}.rep{border:0;padding:0;max-width:none}.sheet{page-break-inside:avoid}}
@media(max-width:800px){#side{width:58px}#side a span,#side .sec{display:none}#clock{display:none}}

.nxsim{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:3px;background:#fdecec;color:#a52a24;border:1px solid #f1c2c2;vertical-align:2px;margin-left:6px}
.tr{display:inline-block;min-width:118px;text-align:center;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;letter-spacing:.3px}
.tr-PASS{background:#d1e7dd;color:#0f5132}.tr-FAIL{background:#f8d7da;color:#842029}.tr-NT{background:#e9ecef;color:#495057}.tr-NA{background:#e7f1ff;color:#0a58ca}
.es2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.es2>div{border:2px solid var(--line);border-radius:8px;padding:10px 14px}.es2 .ok{border-color:#9fd3b0;background:#f2fbf5}.es2 .ko{border-color:#f1c2c2;background:#fdf1f1}.es2 .wip{border-color:#ffe08a;background:#fff8e1}
.es2 .t{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}.es2 .v{font-size:19px;font-weight:700;margin-top:2px}
.wz{border:2px solid #9ec5fe;border-radius:8px;padding:12px 14px;background:#f5f9ff;margin-bottom:12px}.wz .ty{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:1px 7px;border-radius:3px;background:#0a58ca;color:#fff;margin-right:6px}
.seg{display:inline-flex;border:1px solid #c9cfd6;border-radius:6px;overflow:hidden}.seg button{border:0;background:#fff;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:#1d2328;color:#fff}
.cmdst{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.cmdst span{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#d1e7dd;color:#0f5132;font-weight:600}.cmdst span.ko{background:#f8d7da;color:#842029}.cmdst span.w{background:#fff3cd;color:#664d03}.cmdst span.no{background:#eef0f2;color:#9aa1a8;font-weight:400}
.kbc{border:1px solid var(--line);border-left:5px solid #1e8b42;border-radius:6px;padding:10px 14px;margin-bottom:8px;background:#fff;cursor:pointer}.kbc:hover{background:#f5f9ff}.kbc.bozza{border-left-color:#b98900}.kbc.obsoleta{border-left-color:#adb5bd;opacity:.75}
.kbst{font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;text-transform:uppercase}.kbst.validata{background:#d1e7dd;color:#0f5132}.kbst.bozza{background:#fff3cd;color:#664d03}.kbst.obsoleta{background:#e9ecef;color:#6c757d}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:3px;background:#eef0f2;color:#41464b;margin:2px 4px 2px 0}
.nxhero{background:#14191e;color:#e9edf1;border-radius:10px;padding:28px 30px;margin-bottom:16px}.nxhero h1{color:#fff;font-size:30px;letter-spacing:.5px}.nxhero .k{color:#7fb2ff;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.asis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.asis div{background:#fff;border:2px dashed #c9cfd6;border-radius:8px;padding:12px;transform:rotate(var(--r,0deg))}
.tobe{display:grid;gap:10px}.tobe .ly{border:2px solid #9ec5fe;border-radius:8px;padding:10px 14px;background:#fff}.tobe .ly.core{border-color:#0a58ca;background:#eaf2ff}.tobe .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.tobe .row span{background:#f1f3f5;border-radius:5px;padding:5px 10px;font-size:13.5px}
#nxdemo{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;background:#14191e;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px #0005;max-width:min(980px,94vw)}
#nxdemo b{color:#7fb2ff}#nxdemo .btn{padding:4px 10px;font-size:13px;white-space:nowrap}
.brand small{font-weight:400;color:#ffffff99;font-size:12px;margin-left:5px}#top .badge{white-space:nowrap}body.nxdm #main{padding-bottom:120px}
@media print{#nxdemo{display:none!important}}
</style>
</head>
<body>
<div id="top"><span class="brand">NEXUS</span>
  <div class="areas5 noprint"><span class="mute" style="color:#ffffff88;font-size:12px;margin-right:4px">Area:</span><button data-area="L1">📞 L1 Customer Care</button><button data-area="L2">🖥 L2 Control Room</button><button data-area="L3">🔧 L3 Manutentore</button><button data-area="SOST">🔁 Sostituzione</button><button data-area="REP">🏭 Magazzino e riparazione</button><span style="width:1px;height:20px;background:#ffffff33;margin:0 4px"></span><button data-area="ENG">🧪 Ingegneria</button></div><span id="clock"></span></div>
<div id="wrap"><nav id="side" class="noprint"></nav><main id="main"><p class="mute">Caricamento…</p></main></div>
<div class="toast" id="toast"></div>
<script>
/* ==================================================================================================
   NEXUS · Manutenzione 2.1 · console operativa (servita da server.py, dati nella cartella della postazione)
   [ADATTATORI]  api(): server locale → letture reali (pagina di stato + SSH in sola lettura), casi e pacchetti su file
   [MOTORE]      casi a catena, comandi registrati con verifica, statino standard, wizard dalla base di conoscenza
   [INTERFACCIA] aree L1-L2-L3-Sostituzione-Riparazione-Ingegneria, Knowledge Base, identificazione stazione
   Il tool non invia comandi alle colonnine: l'operatore li esegue con lo strumento autorizzato e qui li registra;
   la verifica dell'effetto è una rilettura vera della colonnina.
   ================================================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("it-IT");
function toast(m,ms){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),ms||3200)}
const nowS=()=>new Date().toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,"0")}
function kpi(l,v,s,t){return `<div class="kpi ${t||""}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s||"&nbsp;"}</div></div>`}

/* ------------------------------------------------------------------ [ADATTATORI] server locale */
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({errore:"risposta non valida"}));if(!r.ok)throw new Error(j.errore||r.statusText);return j}
let D=null;const R={page:"casiloc",cid:null,area:null,busy:""};let CASE=null;
async function loadAll(){D=await api("/api/nx/init");if(!R.area)R.area=D.postazione.area||"L2"}
async function refreshCasi(){const x=await api("/api/nx/casi");D.casi=x.casi;D.arrivo=x.arrivo}
const AREA=()=>R.area;

/* ------------------------------------------------------------------ [MOTORE] aree, stazioni, profili */
const AREE=[["L1","Customer Care","📞"],["L2","Control Room","🖥"],["L3","Manutentore","🔧"],["SOST","Sostituzione","🔁"],["REP","Magazzino e riparazione","🏭"],["ENG","Ingegneria","🧪"]];
const AREA_NOME=a=>(AREE.find(x=>x[0]===a)||[a,a])[1],AREA_COL={L1:"#7b4cc2",L2:"#2a78d6",L3:"#b98900",SOST:"#c0352f",REP:"#1e8b42",ENG:"#495057"};
const areaPill=a=>`<span class="pill" style="background:${AREA_COL[a]||"#6c757d"};color:#fff">${a} · ${AREA_NOME(a)}</span>`;
const chi=()=>(D.postazione.operatore||"operatore non indicato")+" ("+AREA_NOME(AREA())+")";
const OPS={verifica:"Verifica stato operativo",resetcp:"Reset CP (programma principale)",resetcm:"Reset CM (modulo di comunicazione)",riavvio:"Riavvio colonnina",sblocco:"Sblocco presa"};
const TESTS={LET:{nome:"Lettura stato senza errori attivi",fasi:["L1","L2"],man:0},CMDV:{nome:"Verifica dopo comando remoto",fasi:["L1","L2"],man:0},SESS:{nome:"Sessione di ricarica di verifica",fasi:["L1","L2"],man:0},
  CUID:{nome:"Identità della stazione verificata sul posto",fasi:["L3","SOST"],man:0},RIL:{nome:"Rilettura di collaudo senza errori",fasi:["L3","SOST"],man:0},CH0:{nome:"Prova di ricarica presa sinistra (0)",fasi:["L3","SOST"],man:0},
  CH1:{nome:"Prova di ricarica presa destra (1)",fasi:["L3","SOST"],man:0},CHK:{nome:"Controlli finali (sportello, schermo, tessera, danni)",fasi:["L3","SOST"],man:1},SER:{nome:"Seriali vecchio e nuovo registrati",fasi:["SOST"],man:0},BANCO:{nome:"Collaudo al banco",fasi:["REP"],man:1}};
const TRES={PASS:"PASS",FAIL:"FAIL",NT:"NOT TESTED",NA:"NOT APPLICABLE"};const trPill=r=>`<span class="tr tr-${r}">${TRES[r]}</span>`;
const PROFILI={JP21:{nome:"JuicePole 2.1",famiglia:"AC floor mount, 2 prese",lettura:"Pagina di stato HTTP + SSH in sola lettura",prese:2,comandi:{L1:["verifica","resetcp","resetcm","riavvio"],L2:["verifica","resetcp","resetcm","riavvio","sblocco"]},test:{remoto:["LET","SESS"],campo:["RIL","CH0","CH1","CHK"]},wizard:true},
  GEN:{nome:"Profilo generico",famiglia:"stazione non riconosciuta",lettura:"nessuna lettura automatica: solo osservazioni",prese:null,comandi:{L1:[],L2:[]},test:{remoto:[],campo:["CHK"]},wizard:false}};
const profKey=c=>c&&c.stz&&c.stz.modello==="JuicePole 2.1"?"JP21":"GEN",profOf=c=>PROFILI[profKey(c)];
function stOf(c){const z=c.stz||{};if(!z.ip&&!z.nome)return null;return D.stazioni.find(s=>s.id===z.sid&&s.nome===z.nome)||D.stazioni.find(s=>s.nome===z.nome&&s.ip===z.ip)||(z.cuid?D.stazioni.find(s=>s.cuid===z.cuid||s.cuid_atteso===z.cuid):null)||null}
const attive=r=>(r.anomalie||[]).filter(a=>a.gravita!=="INFO");

/* ------------------------------------------------------------------ [MOTORE] casi */
function addAtt(c,tipo,titolo,esito,det,dati){const prev=c.att.length?c.att[c.att.length-1].h:"0";const r={t:nowS(),area:AREA(),chi:chi(),tipo,titolo,esito:esito||"INFO",det:det||""};if(dati)r.dati=dati;r.h=fnv(prev+JSON.stringify(r));c.att.push(r);return r}
function catenaOk(c){let prev="0";for(const r of c.att){const{h,...x}=r;if(fnv(prev+JSON.stringify(x))!==h)return false;prev=h}return true}
async function salva(c){await api("/api/nx/salva",{caso:c});CASE=c;await refreshCasi()}
async function apriCaso(id){CASE=await api("/api/nx/caso",{id});R.cid=id;R.cdoc="";go("caso")}
async function lettura(c,label,completa){const s=stOf(c);if(!s){toast("Stazione non in elenco: nessuna lettura possibile");return null}
  R.busy="Lettura di "+s.nome+"…";render();let r;try{r=await api("/api/nx/lettura",{id:s.id,completa:completa!==false})}finally{R.busy=""}
  const an=attive(r),cuidDiv=c.stz.cuid&&r.cuid&&r.cuid!==c.stz.cuid;if(!c.stz.cuid&&r.cuid)c.stz.cuid=r.cuid;
  const det=r.errore?"non raggiungibile: "+r.errore:an.length?an.map(a=>a.messaggio).join("; "):"nessun errore attivo · CUID "+(r.cuid||"-");
  return addAtt(c,"lettura",label||"Lettura della colonnina",r.errore||an.length?"KO":"OK",det+(cuidDiv?` · ATTENZIONE: CUID letto ${r.cuid} diverso da ${c.stz.cuid}`:""),{cuid:r.cuid,esito:r.esito,anomalie:(r.anomalie||[]).map(a=>({guasto:a.guasto,gravita:a.gravita,messaggio:a.messaggio,n:a.n,componente:a.componente})),valori:r.valori||{}})}
const ultimaLettura=c=>[...c.att].reverse().find(a=>a.tipo==="lettura"&&a.dati);
const guastoAttivo=c=>{const l=ultimaLettura(c);return l?(l.dati.anomalie||[]).find(a=>a.gravita!=="INFO")||null:null};
function pacchetto(c,dest){const snap=JSON.parse(JSON.stringify(c));const pkg={formato:"manutenzione21-caso",versione:2,da:AREA(),a:dest,t:nowS(),caso:snap};pkg.impronta=fnv(JSON.stringify(snap));return pkg}
function scaricaFile(pkg,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(pkg,null,1)],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function inoltra(c,dest,motivo,stato){addAtt(c,"inoltro",`Inoltrato a ${dest} · ${AREA_NOME(dest)}`,"INFO",motivo);c.dove=dest;c.stato=stato||"INOLTRATO";const pkg=pacchetto(c,dest);
  const r=await api("/api/nx/invia",{pkg});scaricaFile(pkg,r.file);await salva(c);toast(`Pacchetto salvato in ${r.percorso}${r.anche_in_arrivo?" (in laboratorio è già in «Casi in arrivo» di "+dest+")":": allegalo all'email o all'ordine di lavoro"}`,6000);return r}
async function importa(item){const{pkg}=await api("/api/nx/prendi",{file:item.file});const c=JSON.parse(JSON.stringify(pkg.caso));const ok=catenaOk(pkg.caso);
  let old=null;try{old=await api("/api/nx/caso",{id:c.id})}catch(_){}
  if(old&&old.att.length>c.att.length&&old.dove!==pkg.a){toast("Su questo PC c'è già una versione più recente del caso: il pacchetto resta in «importati»",6000);return null}
  c.dove=AREA();c.stato=c.stato==="INOLTRATO"?"IN CARICO":c.stato;addAtt(c,"ricezione",`Ricevuto da ${pkg.da} e importato`,ok?"OK":"KO",`pacchetto ${pkg.impronta} · catena ${ok?"integra":"ALTERATA"}`);await salva(c);return c}

/* ------------------------------------------------------------------ [MOTORE] comandi registrati e verificati */
function cmdStepper(x){return `<div class="cmdst">${x.stati.map(s=>`<span class="${/Scaduto|Non verificato|Errore/.test(s.s)?"ko":/attesa/i.test(s.s)?"w":""}" title="${esc(s.t+" · "+(s.d||""))}">${s.s}${s.dich?"*":""} <small style="color:inherit;opacity:.7">${esc(s.t.slice(-8))}</small></span>`).join("")}</div>`}
function cmdForm(c,area){const P=profOf(c),ops=P.comandi[area]||[];if(!ops.length)return '<p class="mute">Nessun comando ammesso a questo livello per il profilo.</p>';
  return `<div style="display:grid;grid-template-columns:2fr 1.2fr 1.6fr;gap:6px"><label>Comando<br><select id="cm-op" style="width:100%">${ops.map(o=>`<option value="${o}">${OPS[o]}</option>`).join("")}</select></label>
   <label>Eseguito con<br><select id="cm-tool" style="width:100%"><option>Backend CM</option><option>XCustomer</option><option>Portale costruttore</option><option>Altro</option></select></label>
   <label>Risposta dello strumento<br><select id="cm-es" style="width:100%"><option value="ok">Eseguito, risposta OK</option><option value="err">Errore dallo strumento</option><option value="to">Nessuna risposta (scaduto)</option></select></label></div>
   <label style="display:block;margin-top:6px">Testo della risposta (facoltativo)<br><input type="text" id="cm-txt" style="width:100%" placeholder="es. ACK 200, job id…"></label>
   <div class="qbtns"><button class="btn btn-p btn-sm" data-cmd="reg">Registra il comando</button></div>
   <small class="mute">Il tool non invia comandi. * = stato dichiarato dallo strumento. La verifica è sempre una rilettura vera della colonnina.</small>`}
function cmdRegistra(c){const k=$("#cm-op").value,tool=$("#cm-tool").value,es=$("#cm-es").value,txt=$("#cm-txt").value.trim(),t=nowS();
  const x={id:"CMD-"+fnv(c.id+t+k).slice(0,6).toUpperCase(),op:k,label:OPS[k],tool,area:AREA(),caso:c.id,stz:c.stz.nome,t,stati:[{s:"Richiesto",t,d:"motivo: "+c.sintomo},{s:"Inviato",t,d:"tramite "+tool,dich:1}]};
  if(es==="ok"){x.stati.push({s:"Ricevuto",t,dich:1},{s:"Eseguito",t,dich:1},{s:"Risposta",t,d:txt||"OK",dich:1},{s:"In attesa di verifica",t});x.esito="DA VERIFICARE"}
  else if(es==="err"){x.stati.push({s:"Errore",t,d:txt||"errore dallo strumento",dich:1});x.esito="ERRORE";x.discr="Lo strumento ha restituito un errore"}
  else{x.stati.push({s:"Scaduto",t,d:txt||"nessuna risposta",dich:1});x.esito="SCADUTO";x.discr="Comando inviato senza conferma di ricezione"}
  (c.cmd=c.cmd||[]).push(x);addAtt(c,"comando",x.label,x.esito==="DA VERIFICARE"?"INFO":"KO",`${x.id} via ${tool} · ${x.stati.map(s=>s.s.toLowerCase()).join(" → ")}${x.discr?" · "+x.discr:""}`);return x}
async function cmdVerifica(c,id){const x=(c.cmd||[]).find(z=>z.id===id);const r=await lettura(c,"Rilettura di verifica dopo: "+x.label);if(!r)return;x.stati=x.stati.filter(s=>!/attesa/i.test(s.s));
  if(r.esito==="OK"){x.stati.push({s:"Verificato",t:r.t,d:"rilettura senza errori"});x.esito="VERIFICATO"}else{x.stati.push({s:"Non verificato",t:r.t,d:r.det});x.esito="DISCREPANZA";x.discr="Comando dichiarato eseguito ma lo stato letto dopo non è cambiato"}
  addAtt(c,"comando",`Verifica ${x.id}: ${x.esito}`,x.esito==="VERIFICATO"?"OK":"KO",x.discr||"rilettura senza errori")}
function cmdList(c,area){const L=(c.cmd||[]).filter(x=>!area||x.area===area);return L.slice().reverse().map(x=>`<div style="margin-top:8px"><b>${esc(x.label)}</b> <small>${x.id} · ${esc(x.tool)} · ${x.area}</small> <b style="color:${x.esito==="VERIFICATO"?"var(--green)":x.esito==="DA VERIFICARE"?"var(--amber)":"var(--red)"}">${x.esito}</b>
  ${x.esito==="DA VERIFICARE"&&x.area===AREA()?` <button class="btn btn-p btn-sm" data-cmdv="${x.id}">↻ Rileggi e verifica</button>`:""}${cmdStepper(x)}${x.discr?`<small style="color:var(--red)">⚠ ${esc(x.discr)}</small>`:""}</div>`).join("")}

/* ------------------------------------------------------------------ [MOTORE] statino standard */
function testRes(c,area,id){const P=profOf(c),ov=(c.nxt||{})[area]?.[id];if(ov)return {r:ov.r,ev:"impostato da "+(ov.chi||"operatore")+": "+(ov.m||"-"),man:1};
  if(id==="CH1"&&P.prese===1)return {r:"NA",ev:"il profilo ha una sola presa"};
  const A=c.att.filter(a=>a.area===area),last=f=>[...A].reverse().find(f),Rr=a=>a?{r:a.esito==="OK"?"PASS":a.esito==="KO"?"FAIL":"NT",ev:a.t+" · "+a.titolo+(a.det?" · "+a.det.slice(0,90):"")}:{r:"NT",ev:"nessuna evidenza in questa fase"};
  switch(id){case "LET":return Rr(last(a=>a.tipo==="lettura"));
    case "CMDV":{const x=(c.cmd||[]).filter(z=>z.area===area).pop();if(!x)return {r:"NT",ev:"nessun comando"};return {r:x.esito==="VERIFICATO"?"PASS":x.esito==="DA VERIFICARE"?"NT":"FAIL",ev:`${x.id} ${x.label}: ${x.esito}`}}
    case "SESS":return Rr(last(a=>a.tipo==="test"&&/^Sessione di ricarica di verifica/.test(a.titolo)));
    case "CUID":return Rr(last(a=>a.tipo==="arrivo"||(a.tipo==="lettura"&&/nuova stazione/i.test(a.titolo))));
    case "RIL":return Rr(last(a=>a.tipo==="lettura"&&/collaudo/i.test(a.titolo)));
    case "CH0":return Rr(last(a=>a.tipo==="test"&&/presa sinistra/.test(a.titolo)));
    case "CH1":return Rr(last(a=>a.tipo==="test"&&/presa destra/.test(a.titolo)));
    case "CHK":return Rr(last(a=>a.tipo==="test"&&/^Controlli finali/.test(a.titolo)));
    case "SER":return Rr(last(a=>a.tipo==="sostituzione"));
    case "BANCO":return Rr(last(a=>a.tipo==="riparazione"&&/banco/i.test(a.titolo)))}return {r:"NT",ev:""}}
function verifica(c){const P=profOf(c),ok=(a,ids)=>ids.length&&ids.every(id=>["PASS","NA"].includes(testRes(c,a,id).r)),has=a=>c.att.some(x=>x.area===a);
  for(const a of ["L3","SOST"])if(has(a)&&ok(a,P.test.campo))return {ok:true,via:`collaudo in campo (${a}): ${P.test.campo.join(", ")}`};
  for(const a of ["L1","L2"])if(has(a)&&ok(a,P.test.remoto))return {ok:true,via:`verifica da remoto (${a}): ${P.test.remoto.join(", ")}`};
  const fa=["L3","SOST"].find(has),ra=["L2","L1"].find(has)||"L1",ids=fa?P.test.campo:P.test.remoto,ar=fa||ra;
  return {ok:false,miss:ids.map(id=>[id,testRes(c,ar,id).r]).filter(([,r])=>!["PASS","NA"].includes(r)).map(([id,r])=>`${TESTS[id].nome} (${TRES[r]})`)}}
function attivita(c,a){const A=c.att.filter(x=>x.area===a);if(!A.length)return {v:"Non coinvolta",cls:""};return A.some(x=>["inoltro","chiusura","esito"].includes(x.tipo))?{v:"Sì, completata",cls:"ok"}:{v:"In corso",cls:"wip"}}
function statino(c){const aree=[...new Set(c.att.map(a=>a.area))],f=R.sfase&&aree.includes(R.sfase)?R.sfase:aree.includes(AREA())?AREA():aree[aree.length-1];
  const P=profOf(c),A=c.att.filter(a=>a.area===f),tids=Object.keys(TESTS).filter(id=>TESTS[id].fasi.includes(f)),L=A.filter(a=>a.tipo==="lettura"),at=attivita(c,f),ver=verifica(c);
  const cm=(c.cmd||[]).filter(x=>x.area===f),inol=[...A].reverse().find(a=>a.tipo==="inoltro"),firm=[...A].reverse().find(a=>a.tipo==="statino"),chiuso=["RISOLTO","CHIUSO","RIPARATA"].includes(c.stato);
  return `<div class="noprint filters"><button class="btn btn-o" data-cdoc="">‹ Torna al caso</button><span class="mute">Fase:</span>${aree.map(a=>`<button class="btn btn-sm ${a===f?"btn-p":"btn-o"}" data-sfase="${a}">${a}</button>`).join("")}<span style="flex:1"></span>${f===AREA()?`<button class="btn btn-g" data-firma="${f}">✍ Firma statino ${f}</button>`:""}<button class="btn btn-p" onclick="window.print()">🖨 Stampa / PDF</button></div>
  <div class="rep"><div style="display:flex;justify-content:space-between;border-bottom:3px solid #1d2328;padding-bottom:8px;margin-bottom:10px"><div><div class="mute">${esc(D.postazione.nome)} · statino · ${f} ${AREA_NOME(f)}</div><h1 style="margin:2px 0">${esc(c.id)} · ${f}</h1><div>${esc(c.fonte)} · «${esc(c.sintomo)}»</div></div><div style="text-align:right">${statoPill(c.stato)}<br><small>modello statino 1.0, uguale per tutte le fasi</small></div></div>
  <table class="lines"><tr><td style="width:22%"><b>Identità</b></td><td>${esc(c.stz.nome||c.stz.libero||"-")} · ${esc(c.stz.modello)} · IP ${esc(c.stz.ip||"-")} · CUID ${esc(c.stz.cuid||"-")}${c.stz.comune?" · "+esc(c.stz.comune)+", "+esc(c.stz.indirizzo):""}${c.stz.manuale?` · <b>modello scelto a mano: ${esc(c.stz.manuale)}</b>`:""}</td></tr>
   <tr><td><b>Caso</b></td><td>${esc(c.id)} · XCustomer ${esc(c.ext.xc||"-")} · Salesforce ${esc(c.ext.sf||"-")} · ordine di lavoro ${esc(c.ext.wo||"-")}</td></tr>
   <tr><td><b>Chi e quando</b></td><td>${A.length?esc(A[A.length-1].chi)+" · "+esc(A[0].t)+" → "+esc(A[A.length-1].t):"-"}</td></tr>
   <tr><td><b>Stato prima / dopo</b></td><td>${L.length?`${L[0].esito==="OK"?"✅":"⛔"} ${esc(L[0].t)} <small>${esc(L[0].det.slice(0,120))}</small>`:"nessuna lettura"}${L.length>1?` → ${L[L.length-1].esito==="OK"?"✅":"⛔"} ${esc(L[L.length-1].t)} <small>${esc(L[L.length-1].det.slice(0,120))}</small>`:""}</td></tr></table>
  <h3>Comandi</h3>${cm.length?`<table class="lines"><tr><th>Comando</th><th>Ciclo di vita</th><th>Esito</th></tr>${cm.map(x=>`<tr><td>${esc(x.label)}<br><small>${x.id} · ${esc(x.tool)}</small></td><td>${cmdStepper(x)}${x.discr?`<small style="color:var(--red)">⚠ ${esc(x.discr)}</small>`:""}</td><td><b>${x.esito}</b></td></tr>`).join("")}</table><small>* stato dichiarato dallo strumento</small>`:'<p class="mute">Nessun comando in questa fase.</p>'}
  <h3>Test</h3><table class="lines"><tr><th>Test</th><th>Esito</th><th>Evidenza</th><th class="noprint">Imposta</th></tr>${tids.map(id=>{const x=testRes(c,f,id),obb=P.test.campo.includes(id)||P.test.remoto.includes(id);return `<tr><td>${esc(TESTS[id].nome)} <small>${id}${obb?" · obbligatorio":""}</small></td><td>${trPill(x.r)}</td><td><small>${esc(x.ev)}</small></td>
   <td class="noprint">${f===AREA()?`<select data-ov="${id}" style="font-size:12px"><option value="">automatico</option>${TESTS[id].man?`<option value="PASS" ${x.man&&x.r==="PASS"?"selected":""}>PASS</option><option value="FAIL" ${x.man&&x.r==="FAIL"?"selected":""}>FAIL</option>`:""}<option value="NT" ${x.man&&x.r==="NT"?"selected":""}>NOT TESTED</option>${obb?"":`<option value="NA" ${x.man&&x.r==="NA"?"selected":""}>NOT APPLICABLE</option>`}</select>`:""}</td></tr>`}).join("")||'<tr><td colspan="4" class="mute">Nessun test previsto per questa fase.</td></tr>'}</table>

const isTemp=x=>x&&x.c&&/temporaneo|Blocco/i.test(x.c);
function leaves(nodes){const out=[];const walk=x=>{if(typeof x==="number")return walk(nodes[x]);if(x&&x.q){walk(x.si);walk(x.no)}else if(x&&x.c)out.push(x)};if(nodes.length)walk(0);return out}
function graph(c,area){const g=guastoAttivo(c),k=g?kbOf(g.guasto):null,G={};G.let={tipo:"lettura",t:area==="L3"?"Leggi la colonnina sul posto":"Leggi la colonnina da remoto"};
  if(!g){G.nessun={tipo:"decisione",t:"Nessun errore attivo",d:{c:"Nessun errore attivo letto",a:area==="L3"?"Verifica il sintomo sul posto: passa in manuale e registra cosa osservi":"Verifica con una sessione di ricarica e, se il cliente conferma, chiudi",r:[]}};return {G,g,k}}
  if(!k)return {G,g,k};const al=k.albero||[];
  if(area==="L2"){G.kb={tipo:"scheda",t:"Leggi la scheda della Knowledge Base",next:"rem"};G.rem={tipo:"domanda",t:"Esiste una causa risolvibile da remoto?",auto:()=>leaves(al).some(isTemp),si:"cmd",no:"wo"};
    G.cmd={tipo:"comando",t:"Registra un comando ammesso nel riquadro Comandi, poi rileggi e verifica",next:"chk"};G.chk={tipo:"controllo",t:"Il comando è verificato (errore rientrato)?",si:"ok",no:"wo"};
    G.ok={tipo:"decisione",t:"Risolto da remoto",d:{c:"Blocco temporaneo",a:"Registra la sessione di ricarica di verifica, poi «Risolto da remoto»",r:[]}};
    G.wo={tipo:"decisione",t:"Serve un intervento in campo",d:{c:k.causa||k.titolo,a:"Crea l'ordine di lavoro per L3 con i ricambi indicati",r:[...new Set([...(k.ricambi||[]),...leaves(al).flatMap(x=>x.r||[])])]}};return {G,g,k}}
  let n=0;const leaf=x=>{const id="d"+(n++);G[id]={tipo:"decisione",t:"Causa individuata",d:x};return id};
  al.forEach((q,i)=>{G["q"+i]={tipo:"domanda",t:q.q,si:typeof q.si==="number"?"q"+q.si:leaf(q.si),no:typeof q.no==="number"?"q"+q.no:leaf(q.no),tmp:isTemp(q.si)}});G.let.si=al.length?"q0":null;return {G,g,k}}
function wz(c){const a=AREA();c.wz=c.wz||{};return c.wz[a]=c.wz[a]||{mode:"guidato",cur:"let",path:[]}}
function wizard(c){const W=wz(c),{G,g,k}=graph(c,AREA()),n=G[W.cur]||G.let,P=profOf(c);
  const head=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px"><b>🧭 Wizard di troubleshooting</b><span class="seg"><button class="${W.mode==="guidato"?"on":""}" data-wzm="guidato">Guidato</button><button class="${W.mode==="manuale"?"on":""}" data-wzm="manuale">Manuale</button></span></div>`;
  const crumbs=W.path.length?`<div class="crumbs">${W.path.map(p=>`<div>${p.auto?"⚡":"✔"} ${esc(p.t)} <b>${esc(p.r)}</b>${p.auto?` <small>${esc(p.auto)}</small>`:""}</div>`).join("")}</div>`:"";
  const manual=`<div style="display:grid;grid-template-columns:150px 1fr auto;gap:6px;align-items:end"><label>Tipo<br><select id="wm-t" style="width:100%"><option>Osservazione</option><option>Misura</option><option>Azione</option></select></label><label>Cosa hai visto o fatto<br><input type="text" id="wm-x" style="width:100%"></label><button class="btn btn-p" data-wman="1">Registra</button></div><small class="mute">Stessa tracciatura del guidato. Per chiudere con «guasto risolto» servono comunque i test obbligatori.</small>`;
  if(W.mode==="manuale"||!P.wizard)return `<div class="wz">${head}${!P.wizard?'<p>Profilo generico: solo modalità manuale.</p>':""}${crumbs}${manual}</div>`;
  if(W.cur!=="let"&&g&&!k)return `<div class="wz">${head}${crumbs}<p>Per l'errore <span class="errcode">${esc(g.guasto)}</span> non c'è una scheda: usa la modalità manuale e segnalalo all'Ingegneria.</p></div>`;
  if(k&&k.stato!=="validata"&&["L3","SOST","L1"].includes(AREA())&&W.cur!=="let")return `<div class="wz">${head}${crumbs}<p>La scheda <b>${esc(k.titolo)}</b> è in <b>${k.stato}</b>: il wizard si attiva quando l'Ingegneria la valida. Intanto usa la modalità manuale.</p></div>`;
  const ty={lettura:"Lettura",domanda:"Domanda",scheda:"Scheda KB",comando:"Comando",controllo:"Verifica",decisione:"Decisione"}[n.tipo];let act="";
  if(n.tipo==="lettura")act=`<button class="btn btn-p" data-wz="leggi">↻ Leggi</button>`;
  if(n.tipo==="domanda")act=`<button class="btn btn-g" data-wz="si">Sì</button> <button class="btn btn-r" data-wz="no">No</button>`;
  if(n.tipo==="scheda")act=`<div class="partcard" style="margin-bottom:8px"><b>${esc(k.titolo)}</b> <span class="kbst ${k.stato}">${k.stato}</span><br><small>${esc(k.testo)}</small></div><button class="btn btn-o" data-kb="${esc(k.id)}">📚 Apri la scheda</button> <button class="btn btn-p" data-wz="avanti">Letta, avanti ›</button>`;
  if(n.tipo==="comando")act=`<button class="btn btn-p" data-wz="avanti">Comando registrato e verificato, avanti ›</button>`;
  if(n.tipo==="controllo"){const x=(c.cmd||[]).filter(z=>z.area===AREA()).pop();act=`<small>Ultimo comando: ${x?esc(x.label)+" · <b>"+x.esito+"</b>":"nessuno"}</small><br><button class="btn btn-g" data-wz="si" ${x&&x.esito==="VERIFICATO"?"":"disabled"}>Sì, verificato</button> <button class="btn btn-r" data-wz="no">No</button>`}
  if(n.tipo==="decisione"){const d=n.d;act=`<div class="esito" style="padding:10px 12px;margin:0"><b>Causa:</b> ${esc(d.c)} · <b>Cosa fare:</b> ${esc(d.a)}${(d.r||[]).length?`<br><b>Ricambi:</b> ${d.r.map(x=>compLbl(x,g&&g.n)).join(" ")}`:""}${k?` <button class="btn btn-o btn-sm" data-kb="${esc(k.id)}">📚 Scheda</button>`:""}</div>`}
  return `<div class="wz">${head}${crumbs}<div><span class="ty">${ty}</span><span class="qbig" style="font-size:17px">${esc(n.t)}</span></div><div class="qbtns" style="margin-top:8px">${act}</div><div style="margin-top:6px"><button class="btn btn-o btn-sm" data-wz="reset">↺ Ricomincia</button> <small class="mute">⚡ = risposta già nota, saltata dal motore</small></div></div>`}
async function wzStep(c,act){const W=wz(c);if(act==="reset"){W.cur="let";W.path=[];c.t3es=null;return}
  let {G,g}=graph(c,AREA()),n=G[W.cur]||G.let;const np=W.path.length+(["leggi","avanti"].includes(act)?1:0);const go2=(id,r,auto)=>{W.path.push({t:n.t,r,auto});W.cur=id;n=G[id]};
  if(act==="leggi"){const r=await lettura(c,AREA()==="L3"?"Lettura sul posto (wizard)":"Lettura (wizard)");if(!r)return;({G,g}=graph(c,AREA()));n=G.let;
    if(!g)go2("nessun","nessun errore");else if(!G.kb&&!G.q0){W.path.push({t:n.t,r:"errore "+g.guasto});W.cur="let_nokb";return}else go2(AREA()==="L2"?"kb":"q0","errore confermato: "+g.guasto)}
  else if(act==="avanti")go2(n.next,"fatto");else if(act==="si"||act==="no")go2(act==="si"?n.si:n.no,act==="si"?"Sì":"No");
  for(let i=0;i<6&&n;i++){if(n.tipo==="domanda"&&n.auto){const v=n.auto();go2(v?n.si:n.no,v?"Sì":"No",v?"l'albero ha una causa temporanea":"nessuna causa temporanea nell'albero");continue}
    if(n.tipo==="domanda"&&n.tmp&&(c.cmd||[]).some(x=>/riavvio|resetc/.test(x.op)&&["DISCREPANZA","SCADUTO","ERRORE"].includes(x.esito))){go2(n.no,"No","saltata: riavvio o reset già fatto senza effetto");continue}break}
  W.path.slice(np).forEach(p=>addAtt(c,"domanda",p.t,"INFO","risposta: "+p.r+(p.auto?" · "+p.auto:"")));
  if(n&&n.tipo==="decisione"){addAtt(c,"diagnosi","Wizard: "+n.d.c,"INFO",n.d.a);c.t3es=n.d}}
