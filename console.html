<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manutenzione 2.1</title>
<style>
:root{--side:#1f2429;--side2:#343a40;--top:#15181b;--bg:#f2f3f5;--card:#fff;--line:#dfe3e8;--ink:#1d2328;--mute:#68717a;--blue:#2a78d6;--red:#d63a3a;--green:#1e9e45;--amber:#e0a800}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
#top{height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:6}
#top .brand{font-weight:700;font-size:18px;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700}
.b-yel{background:#ffc107;color:#212529}
.modes{display:flex;background:#2b3035;border-radius:6px;padding:3px;margin-left:12px}
.modes button{border:0;background:transparent;color:#cfd4d9;padding:6px 14px;border-radius:4px;font:inherit;cursor:pointer;font-weight:600}
.modes button.on{background:#fff;color:#1d2328}
#clock{flex:1;text-align:right;color:#ffffff88;font-size:13px}
#wrap{display:flex;min-height:calc(100vh - 56px)}
#side{width:236px;background:var(--side);padding:10px 0;flex-shrink:0}
#side a{display:flex;align-items:center;gap:10px;color:#ffffffa0;text-decoration:none;padding:11px 18px}
#side a:hover{color:#fff}#side a.on{color:#fff;background:var(--side2);border-left:3px solid var(--blue);padding-left:15px}
#side .sec{color:#ffffff55;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:14px 18px 4px}
#side .ic{width:20px;text-align:center}
#main{flex:1;padding:18px 22px;min-width:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}
.sub{color:var(--mute);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:16px;overflow:hidden}
.card>h5{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8f9fa;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>.bd{padding:12px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.3px}
.lines td{border-bottom:1px solid var(--line)}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f2f6fc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-GUASTO{background:#f8d7da;color:#842029}.p-ATTENZIONE{background:#fff3cd;color:#664d03}.p-OK{background:#d1e7dd;color:#0f5132}.p-INFO{background:#e2e6ea;color:#41464b}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;padding:7px 14px;border-radius:5px;font:inherit;cursor:pointer;text-decoration:none;line-height:1.3}
.btn-p{background:var(--blue);color:#fff}.btn-g{background:var(--green);color:#fff}.btn-r{background:var(--red);color:#fff}.btn-o{background:#fff;border-color:#c9cfd6;color:var(--ink)}
.btn-sm{padding:3px 9px;font-size:13px}.btn-xl{padding:14px 22px;font-size:18px;font-weight:600;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],select,textarea{font:inherit;padding:6px 9px;border:1px solid #c9cfd6;border-radius:5px;background:#fff}
.mute{color:var(--mute)}small{color:var(--mute)}
.note{background:#fff8e1;border:1px solid #ffe08a;border-radius:6px;padding:9px 13px;margin-bottom:14px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:6px;padding:10px 14px}
.kpi.ok{border-top-color:var(--green)}.kpi.bad{border-top-color:var(--red)}.kpi.warn{border-top-color:var(--amber)}
.kl{font-size:13px;color:var(--mute)}.kv{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}.kv small{font-size:15px;font-weight:400}.ks{font-size:12px;color:var(--mute)}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:#eef0f2;min-width:80px}.bar i{display:block;height:100%}
.bg-r{background:var(--red)}.bg-a{background:var(--amber)}.bg-g{background:var(--green)}.bg-b{background:var(--blue)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:11px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.spc{font-family:Consolas,monospace;font-weight:700;font-size:12px;padding:1px 6px;border:1px solid #ffd666;border-radius:3px;background:#fff8e1;color:#6b4e00;white-space:nowrap}
.man{font-size:12px;text-decoration:none;padding:1px 7px;border:1px solid #9ec5fe;border-radius:3px;background:#e7f1ff;color:#0a58ca;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
/* colonnina */
.hero{display:flex;gap:16px;align-items:center;border-radius:8px;padding:16px 20px;margin-bottom:16px;color:#fff}
.hero.h-OK{background:#1e8b42}.hero.h-ATTENZIONE{background:#b98900}.hero.h-GUASTO{background:#c0352f}
.hero .big{font-size:26px;font-weight:700;line-height:1.2}.hero .ico{font-size:44px}
.todo{border:2px solid #f1c2c2;background:#fff;border-radius:8px;margin-bottom:14px;overflow:hidden}
.todo.w{border-color:#ffe08a}
.todo .th{padding:12px 16px;background:#fdf1f1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.todo.w .th{background:#fffaeb}
.todo .tb{padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}
@media(max-width:900px){.todo .tb{grid-template-columns:1fr}}
.steps{margin:6px 0 0;padding-left:22px}.steps li{margin:4px 0}
.partcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px;background:#fafbfc}
.partcard .code{white-space:nowrap;font-family:Consolas,monospace;font-size:19px;font-weight:700;color:#6b4e00;background:#fff3c4;padding:1px 8px;border-radius:4px}
.photo{width:84px;height:64px;border-radius:6px;background:repeating-linear-gradient(45deg,#eceff2,#eceff2 7px,#f7f8f9 7px,#f7f8f9 14px);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.blk{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px;overflow:hidden}
.blk.s-GUASTO{border-left-color:var(--red)}.blk.s-ATTENZIONE{border-left-color:var(--amber)}
.blk h4{margin:0;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:15px;background:#f8f9fa;border-bottom:1px solid var(--line)}
.blk .bphoto{height:110px;background-size:cover;background-position:center;border-bottom:1px solid var(--line)}
.kv2 td{padding:4px 14px;font-size:14px;border-bottom:1px solid #f0f2f4}.kv2 td:first-child{color:#4a535b;width:56%}
.v-bad{color:#a11d1d;font-weight:700}.v-warn{color:#7a5a00;font-weight:700}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}.l-g{background:var(--green)}.l-r{background:var(--red)}.l-a{background:var(--amber)}.l-x{background:#adb5bd}
.dtab td{padding:3px 8px;border:2px solid #fff;background:#eceeef;font-size:13px}.dtab th{background:#343a40;color:#fff;text-align:center;border:2px solid #fff}
/* campo */
.search{display:flex;gap:10px;max-width:760px}.search input{flex:1;font-size:20px;padding:14px 16px;border-radius:8px}
.reslist .r{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px;cursor:pointer}
.reslist .r:hover{border-color:var(--blue)}
.wiz{max-width:900px}.wsteps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.wsteps span{padding:6px 12px;border-radius:16px;background:#e9ecef;font-size:13px}.wsteps span.on{background:var(--blue);color:#fff}.wsteps span.done{background:#d1e7dd;color:#0f5132}
.wcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
.qbtns{display:flex;gap:12px;margin-top:16px}
.chk li{list-style:none;margin:8px 0;font-size:17px}.chk{padding:0}.chk input{width:22px;height:22px;vertical-align:-4px;margin-right:10px}
/* configurazione */
.cfgt td{padding:4px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.cfgt input,.cfgt textarea{width:100%;font-size:13px;padding:4px 6px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}.tabs button{border:0;background:transparent;padding:9px 14px;font:inherit;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
/* report */
.rep{background:#fff;max-width:900px;margin:0 auto;padding:28px 34px;border:1px solid var(--line)}
.rep h1{font-size:22px}.rep h3{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #1d2328;padding-bottom:3px}
.rep table td,.rep table th{border-bottom:1px solid #ddd;font-size:13px;padding:4px 6px}
.sheet{border:1px solid #bbb;border-radius:6px;padding:14px 16px;margin-bottom:14px;break-inside:avoid}
.sheet .sh{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding-bottom:6px;margin-bottom:8px}
.box{display:inline-block;width:15px;height:15px;border:2px solid #555;border-radius:3px;vertical-align:-3px;margin-right:6px}
/* benessere, grafici, diagnosi massiva */
.sthead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.sthead h1{margin:0}
.health{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;margin-bottom:16px}@media(max-width:900px){.health{grid-template-columns:1fr}}
.ring{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.area{background:#fff;border:1px solid var(--line);border-top:5px solid var(--green);border-radius:8px;padding:10px 14px;cursor:pointer}.area:hover{border-color:var(--blue)}
.area.s-GUASTO{border-top-color:var(--red)}.area.s-ATTENZIONE{border-top-color:var(--amber)}
.area .at{font-weight:600;display:flex;gap:6px;align-items:center}.area .av{font-size:13px;color:var(--mute);margin-top:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.chart{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px}.chart .ct{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.chart svg{width:100%;height:auto;display:block}.ln{fill:none;stroke:var(--blue);stroke-width:2}.thr{stroke:var(--red);stroke-dasharray:5 4;stroke-width:1.2}.thl{font-size:10px;fill:var(--red)}
.axl{font-size:10px;fill:#8a939b}.gridl{stroke:#eef0f2}.vbad{color:var(--red)}
.spark{display:flex;gap:10px;align-items:center;justify-content:space-between}.spark svg{width:130px;height:36px}
.prog{height:22px;background:#e9ecef;border-radius:11px;overflow:hidden;display:flex}.prog i{display:block;height:100%;transition:width .1s}
.errbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px;cursor:pointer;font:inherit}
.errbtn:hover{border-color:var(--blue);background:#f5f9ff}.errcode{font-family:Consolas,monospace;font-size:12px;background:#212529;color:#ffc107;padding:2px 7px;border-radius:3px}
.crumbs{font-size:14px;color:var(--mute);margin-bottom:10px}.crumbs div{margin:3px 0}
.qbig{font-size:22px;font-weight:600;margin:6px 0 4px}
.esito{border:2px solid #9fd3b0;background:#f2fbf5;border-radius:10px;padding:16px 18px;margin-bottom:12px}
.toast{pointer-events:none;position:fixed;right:16px;bottom:16px;background:#212529;color:#fff;padding:10px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:30}.toast.on{opacity:.95}
@media print{#top,#side,.noprint,.toast{display:none!important}#main{padding:0}body{background:#fff}.rep{border:0;padding:0;max-width:none}.sheet{page-break-inside:avoid}}
@media(max-width:800px){#side{width:58px}#side a span,#side .sec{display:none}#clock{display:none}}

.spc-x{background:#f1f3f5;border-color:#ced4da;color:#495057;font-family:inherit;font-weight:600}
.b-grn{background:#1e9e45;color:#fff}.p-ND{background:#e9ecef;color:#6c757d}
.hero.h-ND{background:#6c757d}.blk.s-ND,.area.s-ND{border-color:#adb5bd}
tr.warn td{background:#fff8e1}details{border:1px solid var(--line);border-radius:6px;margin:8px 0;padding:6px 10px;background:#fff}details summary{cursor:pointer;padding:4px 0}
.cfgt input,.cfgt textarea{min-width:70px}
#ver{color:#ffffff66;font-size:12px;margin-left:10px}
</style>
</head>
<body>
<div id="top"><span class="brand">Manutenzione 2.1</span><span class="badge" style="background:#6c757d;color:#fff">SOLA LETTURA</span>
  <div class="modes noprint"><button data-mode="campo">🔧 Campo</button><button data-mode="mon">📊 Monitoraggio</button></div><span id="sshbadge" style="margin-left:10px"></span><span id="clock"></span><span id="ver">v0.4</span></div>
<div id="wrap"><nav id="side" class="noprint"></nav><main id="main"><div class="mute">⏳ caricamento…</div></main></div>
<div class="toast" id="toast"></div><datalist id="dl"></datalist>
<script>
/* ======================================================================================
   Manutenzione 2.1 · console v0.4
   Due modi d'uso: CAMPO (operatore) e MONITORAGGIO (control room).
   Dati veri dal programma locale (server.py): elenco colonnine, ultime letture, storico, regole,
   ricambi, base di conoscenza dei guasti. Sola lettura verso le colonnine.
   ====================================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("it-IT");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),3200)}
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
  const j=await r.json();if(!r.ok)throw new Error(j.errore||r.status);return j}
const LS={get(k,d){try{const v=localStorage.getItem("m21_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("m21_"+k,JSON.stringify(v))}catch(e){}}};
const DAY=864e5;
function giorni(d){return d==null?"":d>=1.5?Math.round(d)+" giorni":Math.max(1,Math.round(d*24))+" ore"}
function fstamp(g){return String(g||"").replace(/^(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)(\d\d)$/,"$3/$2/$1 $4:$5")}

/* ------------------------------------------------------------------ stato */
let S=null,RES={},DASH=null,PARCO=[],FULL={},TREND={},INIF=null,LOADING={};
let MODE=LS.get("mode","mon");
let R={page:"",id:null,q:"",flt:{reg:"",es:"",fid:"",q:""},pg:0,tab:"",view:"blocchi",tw:null,cf:{q:"",solo:false,pg:0}};
const UI=()=>Object.assign({foto:false,layout:null,orizzonte:3,scorta:15,regione_campo:""},(S&&S.config&&S.config.ui)||{});
async function saveUI(patch){const u={...UI(),...patch};S.config.ui=u;await api("/api/ui",{ui:u})}

async function loadAll(){S=await api("/api/stato");const u=await api("/api/ultimi");RES={};u.risultati.forEach(r=>RES[r.id]=r);DASH=u.cruscotto;FULL={};TREND={};INIF=null;build()}
async function refreshResults(){const u=await api("/api/ultimi");RES={};u.risultati.forEach(r=>RES[r.id]=r);DASH=u.cruscotto;FULL={};TREND={};INIF=null;build()}

/* ------------------------------------------------------------------ ricambi */
function partRow(comp){comp=String(comp||"").toUpperCase();return (S.ricambi||[]).find(r=>(r.componente||"").toUpperCase()===comp)}
function part(comp){const r=partRow(comp)||{};return {comp:String(comp||"").toUpperCase(),code:r.codice||"",desc:r.descrizione||nice(comp),foto:r.foto||"",lead:r.approvv_gg||"",key:r.codice||String(comp||"").toUpperCase()}}
function nice(x){x=String(x||"");return x.charAt(0)+x.slice(1).toLowerCase()}
const ICON={DISPLAY:"🖥","CAVO DISPLAY":"🔌","SCHEDA AUX TESTA":"🔲","VENTOLA TESTA":"🌀",MODEM:"📶","ANTENNA MODEM":"📡","LETTORE RFID":"🪪",ANTITAMPER:"🔒",SUPERCAP:"🔋","ALIMENTATORE 24V":"🔌","CAVO USB TESTA":"🔌"};
const iconOf=c=>ICON[c]||(/MAGNETO|DIFFEREN/.test(c)?"⚡":/CONTATT/.test(c)?"🔁":"📦");
function spc(comp){const p=part(comp);return p.code?`<span class="spc" title="${esc(p.desc)}">${esc(p.code)}</span>`:`<span class="spc spc-x" title="Codice ricambio da inserire in Configurazione → Ricambi">${esc(nice(p.comp))}</span>`}
function photo(comp,big){if(!UI().foto)return "";const p=part(comp);return `<div class="photo" ${big?'style="width:120px;height:90px"':""}>${p.foto?`<img src="${esc(p.foto)}" alt="">`:iconOf(p.comp)}</div>`}
function partCard(comp){const p=part(comp);return `<div class="partcard">${photo(comp,true)}<div><div class="code">${p.code?esc(p.code):'<span style="font-size:13px;font-weight:400">codice da inserire</span>'}</div><div>${esc(p.desc)}</div>${p.lead?`<small>approvvigionamento ${esc(p.lead)} gg</small>`:""}</div></div>`}
const manLink=u=>u?`<a class="man" target="_blank" rel="noopener" href="${esc(u)}">📖 Manuale</a>`:"";

/* ------------------------------------------------------------------ colonnine, anomalie, segnali */
const SIGCOMP={"SUPERCAP VOLTAGE":"SUPERCAP","MODEM SIGNAL QUALITY":"ANTENNA MODEM","CPU-TEMPERATURE":"VENTOLA TESTA","AUX TEMPERATURE":"VENTOLA TESTA","TEMPERATURE":"VENTOLA TESTA","AUX SUPPLY 12V":"ALIMENTATORE 24V","MAIN POWER VOLTAGE":"ALIMENTATORE 24V"};
function kbOf(g){return (S.kb&&S.kb[g])||{}}
function anomaliesOf(id,r){if(!r)return [];const per={};((DASH&&DASH.segnali&&DASH.segnali[id])||[]).filter(x=>x.tipo==="persistenza").forEach(x=>per[x.variabile]=x.giorni);
  return (r.anomalie||[]).filter(a=>a.gravita==="GUASTO"||a.gravita==="ATTENZIONE").map(a=>{const kb=kbOf(a.guasto),n=a.n===""||a.n==null?null:+a.n;
    const base=String(a.messaggio||"").replace(/^Presa \d: /,""),tit=kb.titolo||base;
    const comps=(kb.ricambi&&kb.ricambi.length?kb.ricambi:(a.componente?[a.componente.replace(/ PRESA [01]$/," PRESA {n}")]:[])).map(c=>c.replace("{n}",n??0).toUpperCase());
    return {err:a.guasto,sev:a.gravita,n,titolo:tit,label:(n!=null?(n?"Presa destra: ":"Presa sinistra: "):"")+tit,msg:a.messaggio,spiega:kb.spiega||a.messaggio,causa:kb.causa||"",
      passi:kb.passi||[],comps,albero:kb.albero||[],manuale:kb.manuale||a.manuale||"",var:a.variabile,val:a.valore,da:per[a.variabile]??null}})
   .sort((x,y)=>(y.sev==="GUASTO")-(x.sev==="GUASTO"))}
function signalsOf(id){return ((DASH&&DASH.segnali&&DASH.segnali[id])||[]).filter(x=>x.tipo!=="persistenza").map(x=>({tipo:x.tipo,txt:x.messaggio,eta:x.tipo==="trend"?x.giorni:null,
  giorni:x.giorni,var:x.variabile,comp:SIGCOMP[x.variabile]||"",n:x.tipo==="inattiva"?+(String(x.variabile).split(" ")[1]||0):null,grav:x.gravita}))}
function build(){PARCO=(S.colonnine||[]).map((c,i)=>{const r=RES[c.id];const s={i,id:c.id,nome:c.nome||c.ip,ip:c.ip,reg:c.regione||"",comune:c.comune||"",ind:c.indirizzo||"",
    inst:c.installata||"",cuid:(r&&r.cuid)||c.cuid_atteso||"",c,r};s.f=anomaliesOf(c.id,r);s.sig=signalsOf(c.id);
    s.es=!r?"ND":r.esito==="GUASTO"?"GUASTO":(r.esito==="ATTENZIONE"||s.sig.some(g=>g.tipo==="inattiva"))?"ATTENZIONE":"OK";return s})}
const byId=id=>PARCO.find(s=>s.id===id);
const where=s=>[s.comune,s.ind].filter(Boolean).join(", ")||s.ip;
const regs=()=>[...new Set(PARCO.map(s=>s.reg).filter(Boolean))].sort();
function prioScore(s){return (s.es==="GUASTO"?1000:s.es==="ATTENZIONE"?100:s.es==="ND"?50:0)+s.f.reduce((a,x)=>a+(x.n!=null?40:20)+Math.min(x.da||0,60),0)+(s.f.some(x=>x.err==="ALARM CONTACTOR FAILURE")?500:0)}
function stats(list){const c={GUASTO:0,ATTENZIONE:0,OK:0,ND:0};let socks=0,ko=0;list.forEach(s=>{c[s.es]++;if(s.es==="ND")return;socks+=2;
  ko+=s.f.some(x=>["ALARM PAGE UNREACHABLE","ALARM AC POWER","ALARM CP_MAIN STOPPED"].includes(x.err))?2:new Set(s.f.filter(x=>x.n!=null&&x.sev==="GUASTO").map(x=>x.n)).size});return {c,socks,av:socks-ko}}

/* ------------------------------------------------------------------ dati per colonnina (caricati quando servono) */
function need(kind,id){const k=kind+":"+id;const have=kind==="full"?FULL[id]:kind==="trend"?TREND[id]:INIF;if(have||LOADING[k])return have||null;LOADING[k]=1;
  const p=kind==="full"?api("/api/risultato",{id}).then(x=>FULL[id]=x):kind==="trend"?api("/api/andamento",{id}).then(x=>TREND[id]=x):api("/api/ini_flotta").then(x=>INIF=x);
  p.catch(e=>toast(e.message)).finally(()=>{delete LOADING[k];render()});return null}
const wait='<div class="card"><div class="bd mute">⏳ caricamento…</div></div>';
function series(tr,v){return (tr.punti||[]).map(p=>({t:+new Date(p.t),y:p.v[v]??null}))}
function daily(tr){/* energia al giorno per presa e disponibilità per giorno, ultimi 30 giorni */
  const pts=tr.punti||[],now=Date.now(),days=Array.from({length:30},(_,i)=>new Date(now-(29-i)*DAY).toISOString().slice(0,10));
  const last={};pts.forEach(p=>{const d=p.t.slice(0,10);last[d]=p});const en=[0,1].map(n=>{const k=`METER ${n} TOTAL ACTIVE ENERGY`;let prev=null;
    const firstBefore=pts.filter(p=>p.t.slice(0,10)<days[0]&&p.v[k]!=null).pop();prev=firstBefore?firstBefore.v[k]:null;
    return days.map(d=>{const p=last[d];if(!p||p.v[k]==null)return null;const v=prev==null?0:Math.max(0,(p.v[k]-prev)/1000);prev=p.v[k];return +v.toFixed(1)})});
  const disp=days.map(d=>{const l=pts.filter(p=>p.t.slice(0,10)===d);if(!l.length)return null;return l.filter(p=>p.esito!=="GUASTO").length/l.length});
  return {days,en,disp}}

/* ------------------------------------------------------------------ grafici */
function lineChart(title,pts,lim,unit){const W=360,H=150,L=40,Rr=10,T=12,B=22,ok=pts.filter(p=>p.y!=null);
  if(ok.length<2)return `<div class="chart"><div class="ct"><span>${esc(title)}</span><b class="mute">—</b></div><div class="mute" style="padding:40px 0;text-align:center">storico insufficiente</div></div>`;
  let lo=Math.min(...ok.map(p=>p.y)),hi=Math.max(...ok.map(p=>p.y));const[l0,h0]=lim||[];[l0,h0].forEach(x=>{if(x!=null&&Math.abs(x-(lo+hi)/2)<(hi-lo+1)*3){lo=Math.min(lo,x);hi=Math.max(hi,x)}});
  if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;const t0=pts[0].t,t1=pts[pts.length-1].t;
  const X=t=>L+(W-L-Rr)*(t-t0)/((t1-t0)||1),Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));let path="",pen=false;
  pts.forEach(p=>{if(p.y==null){pen=false;return}path+=(pen?"L":"M")+X(p.t).toFixed(1)+","+Y(p.y).toFixed(1);pen=true});
  const thr=[[l0,"min"],[h0,"max"]].filter(([x])=>x!=null&&x>=lo&&x<=hi).map(([x,n])=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(x)}" y2="${Y(x)}" class="thr"/><text x="${W-Rr-2}" y="${Y(x)-3}" text-anchor="end" class="thl">${n} ${x}</text>`).join("");
  const ticks=[lo+pad,(lo+hi)/2,hi-pad].map(v=>`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end" class="axl">${+v.toFixed(1)}</text><line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" class="gridl"/>`).join("");
  const last=ok[ok.length-1],out=(l0!=null&&last.y<l0)||(h0!=null&&last.y>h0);
  const dots=ok.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="5" fill="transparent"><title>${new Date(p.t).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}: ${p.y} ${unit||""}</title></circle>`).join("");
  return `<div class="chart"><div class="ct"><span>${esc(title)}</span><b class="${out?"vbad":""}">${last.y} ${unit||""}</b></div><svg viewBox="0 0 ${W} ${H}">${ticks}${thr}<path d="${path}" class="ln"/>${dots}
   <text x="${L}" y="${H-5}" class="axl">${new Date(t0).toLocaleDateString("it-IT")}</text><text x="${W-Rr}" y="${H-5}" text-anchor="end" class="axl">${new Date(t1).toLocaleDateString("it-IT")}</text></svg></div>`}
function bars(vals,color,unit,lbl){const W=360,H=80,mx=Math.max(1,...vals.map(v=>v||0)),bw=(W-10)/vals.length;
  return `<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;height:auto">${vals.map((v,i)=>v==null?`<rect x="${5+i*bw+1}" y="${H-2}" width="${bw-2}" height="2" fill="#ddd"><title>nessuna lettura</title></rect>`
     :`<rect x="${5+i*bw+1}" y="${H-H*v/mx}" width="${bw-2}" height="${Math.max(v?2:0,H*v/mx)}" rx="2" fill="${color}"><title>${29-i?(29-i)+" giorni fa":"oggi"}: ${v} ${unit}</title></rect>${v?"":`<rect x="${5+i*bw+1}" y="${H-3}" width="${bw-2}" height="3" fill="var(--red)"/>`}`).join("")}
   <text x="5" y="${H+13}" class="axl">30 giorni fa</text><text x="${W-5}" y="${H+13}" text-anchor="end" class="axl">oggi</text></svg>${lbl?`<small>${lbl}</small>`:""}`}
function spark(pts){const ok=pts.filter(p=>p.y!=null);if(ok.length<2)return "<svg></svg>";let lo=Math.min(...ok.map(p=>p.y)),hi=Math.max(...ok.map(p=>p.y));if(hi-lo<1e-6){hi+=1;lo-=1}
  const X=i=>2+126*i/(pts.length-1),Y=y=>32-28*(y-lo)/(hi-lo);let d="",pen=false;pts.forEach((p,i)=>{if(p.y==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+","+Y(p.y).toFixed(1);pen=true});
  return `<svg viewBox="0 0 130 36"><path d="${d}" fill="none" stroke="var(--blue)" stroke-width="1.6"/></svg>`}

function render(){if(!S)return;if(!R.page)R.page=MODE==="campo"?"cerca":"parco";if(ST_PAGES.includes(R.page)&&!byId(R.id))R.page=MODE==="campo"?"cerca":"parco";side();

function parco(){if(!PARCO.length)return `<h1>Parco installato</h1><div class="note">Nessuna colonnina nell'elenco. Aggiungile in <a href="#" data-p2="cfg" data-cfgtab="col">Configurazione → Colonnine e accesso SSH</a> (anche da PoleDesk), poi lancia una <a href="#" data-p2="diag">diagnosi</a>.</div>`;
  const st=stats(PARCO),k=(DASH&&DASH.kpi)||{},read=PARCO.length-st.c.ND,sig=PARCO.reduce((a,s)=>a+s.sig.length,0),need=kitNow(PARCO).need.reduce((a,x)=>a+x.qty,0);
  const rg=regs(),rows=(rg.length?rg:[""]).concat(rg.length&&PARCO.some(s=>!s.reg)?[""]:[]).map(r=>{const l=PARCO.filter(s=>s.reg===r),x=stats(l);return {r,n:l.length,...x,sig:l.reduce((a,s)=>a+s.sig.length,0)}});

function prio(){const l=filtered().filter(s=>R.flt.es||s.es!=="OK").sort((a,b)=>prioScore(b)-prioScore(a));const per=50,pages=Math.max(1,Math.ceil(l.length/per));R.pg=Math.min(R.pg,pages-1);

   <input type="text" id="f-q" placeholder="cerca nome, CUID, IP, comune, indirizzo" value="${esc(R.flt.q)}" style="flex:1;min-width:220px"><button class="btn btn-o" id="f-clr">Azzera</button>
   <button class="btn btn-o" data-rep="schede">🖨 Schede intervento</button><button class="btn btn-p" id="f-run" title="Rilegge le colonnine di questa lista">▶ Rileggi queste ${fmt(l.length)}</button></div>
  <div class="card"><div class="bd" style="padding:0"><table class="lines"><tr><th>#</th><th>Colonnina</th><th>Dove</th><th>Stato</th><th>Problema</th><th>Ricambio</th><th class="num">Aperto da</th></tr>
  ${rows.map((s,i)=>{const a=s.f[0],g=s.sig[0];return `<tr class="clk" data-col="${esc(s.id)}"><td class="mute">${R.pg*per+i+1}</td><td><b>${esc(s.nome)}</b><br><small>${esc(s.cuid||s.ip)}</small></td><td>${esc(where(s))}<br><small>${esc(s.reg)}</small></td>
   <td>${pillS(s.es)}</td><td>${a?esc(a.label)+(s.f.length>1?` <small>+${s.f.length-1}</small>`:""):g?"🔮 "+esc(g.txt):s.es==="ND"?'<span class="mute">mai letta</span>':""}</td><td>${a&&a.comps.length?spc(a.comps[a.comps.length-1]):""}</td><td class="num">${a?giorni(a.da):""}</td></tr>`}).join("")||`<tr><td colspan="7" class="mute" style="padding:20px">Nessuna colonnina con questi filtri.</td></tr>`}</table></div></div>
  <div class="pager"><small>${fmt(l.length)} colonnine · pagina ${R.pg+1} di ${pages}</small><button class="btn btn-o btn-sm" id="pg-p" ${R.pg?"":"disabled"}>‹</button><button class="btn btn-o btn-sm" id="pg-n" ${R.pg<pages-1?"":"disabled"}>›</button></div>`}

function segnali(){const l=PARCO.flatMap(s=>s.sig.map(g=>({s,g}))).sort((a,b)=>(a.g.eta??999)-(b.g.eta??999));const by={};l.forEach(o=>{const k={trend:"Valori verso la soglia",inattiva:"Prese senza energia",flotta:"Fuori dalla flotta"}[o.g.tipo]||o.g.tipo;by[k]=(by[k]||0)+1});
  return `<h1>Segnali predittivi</h1><div class="sub">Problemi che non sono ancora guasti: valori che vanno verso la soglia, valori molto diversi dalle altre colonnine, prese che non erogano mentre le altre lavorano. Servono diagnosi ripetute nel tempo (almeno una al giorno).</div>
  ${l.length?`<div class="kpis">${Object.entries(by).map(([t,n])=>kpi(t,n,"segnali","warn")).join("")}</div>
  <div class="card"><div class="bd" style="padding:0"><table class="lines"><tr><th>Colonnina</th><th>Dove</th><th>Segnale</th><th>Ricambio da preparare</th></tr>
  ${l.slice(0,300).map(({s,g})=>`<tr class="clk" data-col="${esc(s.id)}"><td><b>${esc(s.nome)}</b></td><td>${esc(where(s))}</td><td>${{trend:"📉",inattiva:"💤",flotta:"↔"}[g.tipo]||"🔮"} ${esc(g.txt)}</td><td>${g.comp?spc(g.comp):""}</td></tr>`).join("")}</table></div></div>`
  :'<div class="note">Nessun segnale. Con più diagnosi nel tempo compaiono qui gli andamenti verso la soglia e le prese che non erogano.</div>'}`}

/* ------------------------------------------------------------------ ricambi: subito e piano pluriennale */
function kitNow(list){const need={},spare={};list.forEach(s=>s.f.forEach(a=>{if(!a.comps.length)return;const main=a.comps[a.comps.length-1];
    const tgt=a.sev==="GUASTO"?need:spare;const add=(t,c,why)=>{const p=part(c),o=t[p.key]=t[p.key]||{comp:c,qty:0,per:new Set()};o.qty++;o.per.add(why)};
    add(tgt,main,a.titolo);a.comps.slice(0,-1).forEach(c=>add(spare,c,a.titolo+" (eventuale)"))}));
  Object.keys(need).forEach(k=>delete spare[k]);const srt=o=>Object.values(o).sort((a,b)=>b.qty-a.qty);return {need:srt(need),spare:srt(spare)}}
const numv=x=>{const n=parseFloat(String(x??"").replace(",","."));return isFinite(n)?n:0};
function plan(list){const Y=+UI().orizzonte||3,sc=(+UI().scorta||0)/100,now=new Date().getFullYear(),open=kitNow(list).need,groups={};
  (S.ricambi||[]).forEach(r=>{if(!numv(r.tasso_annuo)&&!numv(r.preventivo_anni))return;const p=part(r.componente),g=groups[p.key]=groups[p.key]||{p,comps:[],pezzi:0,tasso:numv(r.tasso_annuo),prev:numv(r.preventivo_anni),costo:numv(r.costo)};
    g.comps.push(r.componente);g.pezzi+=numv(r.pezzi)||1});
  return Object.values(groups).map(g=>{const per=[];for(let y=1;y<=Y;y++){let q=list.length*g.pezzi*g.tasso/100;
      if(g.prev>0)q+=list.filter(s=>{const iy=+String(s.inst).slice(0,4);if(!iy)return false;const age=now+y-1-iy;return age>0&&age%g.prev===0}).length*g.pezzi;
      if(y===1)q+=open.find(x=>part(x.comp).key===g.p.key)?.qty||0;per.push(Math.ceil(q*(1+sc)))}
    const tot=per.reduce((a,b)=>a+b,0);return {...g,per,tot,cost:tot*g.costo}}).sort((a,b)=>b.tot-a.tot)}
function ricambi(){const tab=R.tab||"subito",reg=R.flt.reg,list=reg?PARCO.filter(s=>s.reg===reg):PARCO,Y=+UI().orizzonte||3;
  const head=`<h1>Ricambi e ordini</h1><div class="sub">Cosa portare per i guasti aperti e cosa ordinare per i prossimi ${Y} anni.</div>
   ${regs().length?`<div class="filters noprint"><select id="r-reg"><option value="">Tutto il parco (${fmt(PARCO.length)})</option>${regs().map(r=>`<option ${reg===r?"selected":""}>${esc(r)}</option>`).join("")}</select></div>`:""}
   <div class="tabs noprint">${[["subito","Da portare ora"],["piano","Piano a "+Y+" anni"]].map(([k,t])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${t}</button>`).join("")}</div>`;
  const T=(rows,title,id)=>`<div class="card"><h5>${title}<span style="flex:1"></span>${id?`<button class="btn btn-o btn-sm" data-csv="${id}">CSV</button><button class="btn btn-o btn-sm" data-rep="ordine">🖨 Stampa</button>`:""}</h5><div class="bd">${rows.length?`<table class="lines"><tr><th></th><th>Codice</th><th>Descrizione</th><th class="num">Quantità</th><th>Per</th><th class="num">Approvv.</th></tr>
    ${rows.map(x=>{const p=part(x.comp);return `<tr><td style="width:60px">${UI().foto?photo(x.comp):iconOf(p.comp)}</td><td>${spc(x.comp)}</td><td>${esc(p.desc)}</td><td class="num"><b>${x.qty}</b></td><td><small>${[...x.per].map(esc).join(", ")}</small></td><td class="num">${p.lead?esc(p.lead)+" gg":"-"}</td></tr>`}).join("")}</table>`:'<span class="mute">nessuno</span>'}</div></div>`;
  if(tab==="subito"){const k=kitNow(list);return head+T(k.need,"📦 Da portare per i guasti aperti","subito")+T(k.spare,"🧰 Di scorta (attenzioni e alternative)","")}
  const pl=plan(list),tc=pl.reduce((a,x)=>a+x.cost,0),noinst=list.filter(s=>!s.inst).length;
  return head+`<div class="card"><h5>📈 Piano di approvvigionamento<span style="flex:1"></span>
   <label class="noprint" style="font-weight:400;font-size:14px">Anni <input type="number" id="pl-y" min="1" max="5" value="${Y}" style="width:60px"></label>
   <label class="noprint" style="font-weight:400;font-size:14px">Scorta di sicurezza <input type="number" id="pl-s" min="0" max="100" value="${UI().scorta}" style="width:64px"> %</label>
   <button class="btn btn-o btn-sm noprint" data-csv="piano">Excel (CSV)</button><button class="btn btn-o btn-sm noprint" data-rep="piano">🖨 Stampa</button></h5><div class="bd">
   <div class="note">Quantità = colonnine (${fmt(list.length)}) × pezzi per colonnina × tasso di guasto annuo + sostituzioni preventive (in base alla data di installazione) + guasti già aperti (anno 1), più la scorta. Non usa dati di operations.
    <b>Tassi, cicli e costi sono valori di partenza</b>: si cambiano in <a href="#" data-p2="cfg" data-cfgtab="parti">Configurazione → Ricambi</a>.${noinst?` <b>${noinst} colonnine senza data di installazione</b>: per loro niente sostituzioni preventive.`:""}</div>
   <table class="lines"><tr><th></th><th>Codice</th><th>Descrizione</th><th class="num">Tasso/anno</th><th class="num">Preventivo</th>${Array.from({length:Y},(_,i)=>`<th class="num">Anno ${i+1}</th>`).join("")}<th class="num">Totale</th><th class="num">Costo stimato</th></tr>
   ${pl.map(x=>`<tr><td style="width:44px">${iconOf(x.p.comp)}</td><td>${spc(x.comps[0])}</td><td>${esc(x.p.desc)}${x.comps.length>1?` <small class="mute">(${x.comps.length} posizioni)</small>`:""}</td><td class="num">${x.tasso}%</td><td class="num">${x.prev?"ogni "+x.prev+" anni":"-"}</td>${x.per.map(q=>`<td class="num">${fmt(q)}</td>`).join("")}<td class="num"><b>${fmt(x.tot)}</b></td><td class="num">${x.costo?fmt(Math.round(x.cost))+" €":"-"}</td></tr>`).join("")}
   <tr><td colspan="${5+Y}"></td><td class="num"><b>Totale</b></td><td class="num"><b>${tc?fmt(Math.round(tc))+" €":"-"}</b></td></tr></table></div></div>`}

/* ------------------------------------------------------------------ report */
function report(){const t=R.tab||"";if(!t)return `<h1>Report</h1><div class="sub">Pronti da stampare o salvare in PDF (A4).</div><div class="grid3">
  ${[["sintesi","📊","Sintesi per il responsabile","Una pagina: stato del parco, regioni, problemi principali, ricambi."],["schede","🧰","Schede intervento per i tecnici","Una scheda per colonnina: cosa non va in parole semplici, cosa fare, ricambi. Usa i filtri di «Priorità»."],
    ["ordine","📦","Ordine ricambi","Ricambi per i guasti aperti, con quantità e codici, per il magazzino."],["piano","📈","Piano ricambi a "+(UI().orizzonte||3)+" anni","Quantità per anno e costi, per budget e ordini quadro."]]
   .map(([k,ic,ti,d])=>`<div class="card"><div class="bd"><div style="font-size:32px">${ic}</div><h2>${ti}</h2><p class="mute">${d}</p><button class="btn btn-p" data-rep="${k}">Apri</button></div></div>`).join("")}</div>`;
  return `<div class="noprint filters"><button class="btn btn-o" data-p2="report">‹ Report</button><span style="flex:1"></span><button class="btn btn-p" onclick="window.print()">🖨 Stampa / PDF</button></div><div class="rep">${repBody(t)}</div>`}
function repHead(t){return `<div style="display:flex;justify-content:space-between;align-items:flex-end"><div><h1>${t}</h1><div class="mute">Colonnine 2.1 · ${new Date().toLocaleString("it-IT")}${R.flt.reg?" · "+esc(R.flt.reg):""}</div></div><div class="mute">Manutenzione 2.1</div></div>`}
function repBody(t){const list=R.flt.reg?PARCO.filter(s=>s.reg===R.flt.reg):PARCO;
  if(t==="sintesi"){const st=stats(list),read=list.length-st.c.ND,cl={};list.forEach(s=>s.f.forEach(a=>{(cl[a.err]=cl[a.err]||{a,n:0}).n++}));
    return repHead("Sintesi del parco installato")+`<h3>In breve</h3><p style="font-size:16px">Su <b>${fmt(list.length)}</b> colonnine (${fmt(read)} lette), <b>${fmt(st.c.OK+st.c.ATTENZIONE)}</b> funzionano e <b>${fmt(st.c.GUASTO)}</b> sono da riparare.
     Prese disponibili: <b>${st.socks?Math.round(100*st.av/st.socks):"—"}%</b>. Segnali di problemi in arrivo: <b>${list.reduce((a,s)=>a+s.sig.length,0)}</b>.</p>
     <h3>Problemi aperti per tipo</h3><table><tr><th>Problema</th><th class="num">Colonnine</th><th>Ricambio principale</th></tr>${Object.values(cl).sort((a,b)=>b.n-a.n).map(x=>`<tr><td>${esc(x.a.titolo)}</td><td class="num">${x.n}</td><td>${x.a.comps.map(c=>{const p=part(c);return esc((p.code?p.code+" ":"")+p.desc)}).join(", ")||"-"}</td></tr>`).join("")}</table>
     ${regs().length?`<h3>Regioni con più guasti (in percentuale)</h3><table><tr><th>Regione</th><th class="num">Colonnine</th><th class="num">Da riparare</th><th class="num">%</th></tr>${regs().map(r=>{const l=PARCO.filter(s=>s.reg===r);return {r,n:l.length,g:l.filter(s=>s.es==="GUASTO").length}}).sort((a,b)=>b.g/b.n-a.g/a.n).slice(0,10).map(x=>`<tr><td>${esc(x.r)}</td><td class="num">${x.n}</td><td class="num">${x.g}</td><td class="num">${(100*x.g/x.n).toFixed(1)}%</td></tr>`).join("")}</table>`:""}
     <h3>Ricambi da portare per i guasti aperti</h3><table><tr><th>Codice</th><th>Descrizione</th><th class="num">Quantità</th></tr>${kitNow(list).need.map(x=>{const p=part(x.comp);return `<tr><td><b>${esc(p.code||"-")}</b></td><td>${esc(p.desc)}</td><td class="num">${x.qty}</td></tr>`}).join("")}</table>`}
  if(t==="schede"){const l=filtered().filter(s=>s.es==="GUASTO"||s.es==="ATTENZIONE").sort((a,b)=>prioScore(b)-prioScore(a)).slice(0,60);
    return repHead("Schede intervento")+`<p class="mute">${l.length} colonnine (prime 60 per priorità con i filtri di «Priorità»). Spunta le caselle durante l'intervento.</p>`+l.map(s=>`<div class="sheet"><div class="sh"><div><b style="font-size:17px">${esc(s.nome)}</b> · ${esc(where(s))}<br><small>${s.cuid?"CUID "+esc(s.cuid)+" · ":""}IP ${esc(s.ip)}${s.reg?" · "+esc(s.reg):""}</small></div><div>${pillS(s.es)}</div></div>
     ${s.f.map(a=>`<div style="margin-bottom:8px"><b>${esc(a.label)}</b> <small>(${esc(a.err)}${a.da!=null?", aperto da "+giorni(a.da):""})</small><div>${esc(a.spiega)}</div>${a.passi.length?`<ol class="steps">${a.passi.map(p=>`<li><span class="box"></span>${esc(p)}</li>`).join("")}</ol>`:""}
     ${a.comps.length?`<div>Ricambi: ${a.comps.map(c=>{const p=part(c);return `<b>${esc(p.code||"(codice da inserire)")}</b> ${esc(p.desc)}`}).join(" · ")}</div>`:""}${a.manuale?`<div><small>Manuale: ${esc(a.manuale)}</small></div>`:""}</div>`).join("")}
     ${s.sig.map(g=>`<div>🔮 ${esc(g.txt)}${g.comp?" · da preparare "+esc(part(g.comp).code||part(g.comp).desc):""}</div>`).join("")}
     <div style="margin-top:8px;display:flex;gap:30px"><span><span class="box"></span>Risolto</span><span><span class="box"></span>Serve 2° livello</span><span>Tecnico ______________ Data ________</span></div></div>`).join("")}
  if(t==="ordine"){const k=kitNow(list);const tb=(rows,ti)=>`<h3>${ti}</h3><table><tr><th>Codice</th><th>Descrizione</th><th class="num">Quantità</th><th class="num">Approvv.</th><th>Preso</th></tr>${rows.map(x=>{const p=part(x.comp);return `<tr><td><b>${esc(p.code||"-")}</b></td><td>${esc(p.desc)}</td><td class="num"><b>${x.qty}</b></td><td class="num">${p.lead?esc(p.lead)+" gg":"-"}</td><td><span class="box"></span></td></tr>`}).join("")}</table>`;
    return repHead("Ordine ricambi per i guasti aperti")+tb(k.need,"Da portare")+tb(k.spare,"Di scorta")}
  if(t==="piano"){const pl=plan(list),Y=+UI().orizzonte||3;return repHead(`Piano ricambi a ${Y} anni`)+`<p>Scorta di sicurezza ${UI().scorta}%. Tassi e costi da Configurazione → Ricambi (valori di partenza da validare).</p><table><tr><th>Codice</th><th>Descrizione</th>${Array.from({length:Y},(_,i)=>`<th class="num">Anno ${i+1}</th>`).join("")}<th class="num">Totale</th><th class="num">Costo</th></tr>
    ${pl.map(x=>`<tr><td><b>${esc(x.p.code||"-")}</b></td><td>${esc(x.p.desc)}</td>${x.per.map(q=>`<td class="num">${fmt(q)}</td>`).join("")}<td class="num"><b>${fmt(x.tot)}</b></td><td class="num">${x.costo?fmt(Math.round(x.cost))+" €":"-"}</td></tr>`).join("")}</table>`}
  return ""}

let RUN={scope:"tutte",reg:"",lista:"",job:null,tgt:[],pg:0};
function runTargets(){if(RUN.scope==="tutte")return PARCO;if(RUN.scope==="reg")return PARCO.filter(s=>s.reg===RUN.reg);if(RUN.scope==="guaste")return PARCO.filter(s=>s.es!=="OK");
  if(RUN.scope==="prio")return filtered().filter(s=>R.flt.es||s.es!=="OK");
  const ks=RUN.lista.toLowerCase().split(/[\s,;]+/).filter(Boolean);return PARCO.filter(s=>ks.some(k=>s.nome.toLowerCase()===k||(s.cuid||"").toLowerCase()===k||s.ip.toLowerCase()===k||s.nome.toLowerCase().includes(k)))}
function runBox(){const j=RUN.job;if(!j)return "";const n=j.totale,c={OK:0,ATTENZIONE:0,GUASTO:0,NR:0};(j.risultati||[]).forEach(r=>r.valori&&r.valori._PAGINA!=="OK"?c.NR++:c[r.esito]=(c[r.esito]||0)+1);const w=k=>n?100*c[k]/n:0;
  return `<div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>${j.fine?"Diagnosi completata":"Lettura in corso…"} ${fmt(j.fatti)} / ${fmt(n)}</b><small>${S.impostazioni.parallelo||20} letture in parallelo${j.durata?" · durata "+j.durata+" s":""}</small></div>
   <div class="prog"><i class="bg-g" style="width:${w("OK")}%"></i><i class="bg-a" style="width:${w("ATTENZIONE")}%"></i><i class="bg-r" style="width:${w("GUASTO")}%"></i><i style="width:${w("NR")}%;background:#6c757d"></i></div>
   <div class="kpis" style="margin-top:12px">${kpi("Funzionano",fmt(c.OK),"","ok")}${kpi("Da controllare",fmt(c.ATTENZIONE),"","warn")}${kpi("Da riparare",fmt(c.GUASTO),"","bad")}${kpi("Non raggiungibili",fmt(c.NR),"")}</div>`}
function diagN(){const n=runTargets().length,busy=RUN.job&&!RUN.job.fine;
  const form=`<div class="card"><h5>▶ Nuova diagnosi</h5><div class="bd"><div class="filters">
    <label><input type="radio" name="sc" value="tutte" ${RUN.scope==="tutte"?"checked":""}> Tutte (${fmt(PARCO.length)})</label>
    ${regs().length?`<label><input type="radio" name="sc" value="reg" ${RUN.scope==="reg"?"checked":""}> Regione</label><select id="rn-reg">${regs().map(r=>`<option ${RUN.reg===r?"selected":""}>${esc(r)}</option>`).join("")}</select>`:""}
    <label><input type="radio" name="sc" value="guaste" ${RUN.scope==="guaste"?"checked":""}> Solo con problemi o mai lette</label>
    <label><input type="radio" name="sc" value="prio" ${RUN.scope==="prio"?"checked":""}> Lista di «Priorità» con i suoi filtri</label>
    <label><input type="radio" name="sc" value="lista" ${RUN.scope==="lista"?"checked":""}> Lista di nomi, CUID o IP</label></div>
    ${RUN.scope==="lista"?`<textarea id="rn-lista" rows="3" style="width:100%" placeholder="Incolla nomi, CUID o IP separati da spazio, virgola o a capo">${esc(RUN.lista)}</textarea>`:""}
    <div class="filters" style="margin-top:8px"><small>${S.impostazioni.ssh_attivo?"Con controlli SSH di sola lettura":"Senza SSH (solo pagina di stato)"} · ${S.impostazioni.parallelo||20} in parallelo · si cambia in Configurazione</small><span style="flex:1"></span>
    <b>${fmt(n)} colonnine</b><button class="btn btn-g" id="rn-go" ${n&&!busy?"":"disabled"}>▶ Avvia diagnosi</button></div>
    <small>Sola lettura: legge la pagina di stato di ogni colonnina e applica le regole. Non invia comandi.</small></div></div>`;

function todoCard(a){return `<div class="todo ${a.sev==="GUASTO"?"":"w"}"><div class="th">${pillS(a.sev)}<b style="font-size:17px">${esc(a.label)}</b><span class="errcode">${esc(a.err)}</span>${a.da!=null?`<small>aperto da ${giorni(a.da)}</small>`:""}<span style="flex:1"></span>${manLink(a.manuale)}</div>

      return `<div class="chart spark"><div><div style="font-size:13px" class="mute">${t}</div><b style="font-size:18px">${b==null?"—":b+" "+u}</b> <small>${b==null||l.length<2?"":Math.abs(dd)<.02*Math.abs(a||1)?"stabile":dd>0?"▲ in aumento":"▼ in calo"}</small></div>${spark(p)}</div>`}).join("")}
  return heroOf(s)+`<div class="health"><div class="ring"><svg viewBox="0 0 120 120" width="150"><circle cx="60" cy="60" r="52" fill="none" stroke="#eef0f2" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*sc/100} ${C}" transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" font-size="30" font-weight="700" fill="#1d2328">${sc}</text></svg><div style="font-weight:600">Indice di benessere</div><small>100 = nessun problema</small></div><div>${areas}</div></div>
   <div class="kpis">${k30}${kpi("Problemi aperti",s.f.length,"",s.f.length?"bad":"ok")}${kpi("Segnali predittivi",s.sig.length,"",s.sig.length?"warn":"ok")}</div>

function allarmi(){const s=byId(R.id),tr=need("trend",s.id);let hist='<div class="mute">⏳</div>';

function confPage(){const s=byId(R.id),f=need("full",s.id);if(!f)return stHead(s,"Configurazione")+wait;const v=f.valori||{};
  const pageKeys=Object.keys(v).filter(k=>!k.startsWith("_")&&/PHASE|MAX CURRENT|CHARGE CURRENT|SOCKET TYPE|BOOKING|LANGUAGE|ACTIVE FLAG/.test(k));

  const all=need("ini","*")||{},others=Object.entries(all).filter(([k])=>k!==s.id).map(([,x])=>x),maj={};
  others.forEach(o=>Object.entries(o).forEach(([fl,rows])=>{const fn=fl.split("/").pop();rows.forEach(([sec,k,val])=>{const key=fn+"|"+sec+"|"+k;(maj[key]=maj[key]||{})[val]=(maj[key][val]||0)+1})}));
  const majOf=key=>{const m=maj[key];if(!m)return null;const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return {v:e[0],n:e[1],tot:Object.values(m).reduce((a,b)=>a+b,0)}};
  const q=CONFQ.toLowerCase();let nd=0;const main=[];
  const files=Object.entries(f.ini).map(([fl,rows])=>{const fn=fl.split("/").pop();const trs=rows.map(([sec,k,val])=>{const m=majOf(fn+"|"+sec+"|"+k),diff=m&&m.v!==val;if(diff)nd++;if(KEYCONF.test(k))main.push([fn,sec,k,val,diff,m]);
      if(q&&!(fn+" "+sec+" "+k+" "+val).toLowerCase().includes(q))return "";if(CONFDIFF&&!diff)return "";
      return `<tr class="${diff?"warn":""}"><td><small class="mute">${esc(sec)}</small></td><td>${esc(k)}</td><td><b>${esc(val)}</b></td><td><small>${m?(diff?`altre: <b>${esc(m.v)}</b> (${m.n} su ${m.tot})`:`uguale alle altre (${m.tot})`):""}</small></td></tr>`}).join("");
    return trs?`<details ${q||CONFDIFF?"open":""}><summary><b>${esc(fn)}</b> <small class="mute">${esc(fl)} · ${rows.length} voci</small></summary><table class="lines">${trs}</table></details>`:""}).join("");
  const mainT=main.length?`<table class="lines">${main.map(([fn,sec,k,val,diff,m])=>`<tr class="${diff?"warn":""}"><td><small class="mute">${esc(fn)} · ${esc(sec)}</small></td><td>${esc(k)}</td><td><b>${esc(val)}</b></td><td><small>${diff?"altre: <b>"+esc(m.v)+"</b>":""}</small></td></tr>`).join("")}</table>`:'<span class="mute">nessuna voce riconosciuta</span>';
  return stHead(s,"Configurazione")+`<div class="grid2">${top}<div class="card"><h5>⭐ Voci principali dai file .ini</h5><div class="bd">${mainT}</div></div></div>
   <div class="card"><h5>🧾 File di configurazione <small class="mute">${Object.keys(f.ini).length} file · ${others.length?nd+" voci diverse dalle altre "+others.length+" colonnine":"nessun'altra colonnina letta con SSH per il confronto"}</small></h5><div class="bd">
   <div class="filters noprint"><input type="text" id="confq" placeholder="cerca file, sezione, chiave o valore" value="${esc(CONFQ)}" style="flex:1"><label><input type="checkbox" id="confdiff" ${CONFDIFF?"checked":""}> solo le differenze</label></div>${files||'<span class="mute">nessuna voce con questi filtri</span>'}
   <small>Letti via SSH in sola lettura. Password, chiavi e certificati sono nascosti (••••).</small></div></div>`}

/* ================================================================== TROVA IL GUASTO (dagli errori interni) */
const SINTOMI=[["Schermo nero o bloccato","ALARM DISPLAY COMMUNICATION",null],["La tessera non viene letta","ALARM RFID COMMUNICATION",null],["La presa sinistra non eroga","ALARM BREAKER OPEN",0],
  ["La presa destra non eroga","ALARM BREAKER OPEN",1],["Luci della testa spente","ALARM AUX FAULT",null],["Non si avvia da app","WARNING MODEM",null]];
function faultFor(s,err,n){const a=s.f.find(x=>x.err===err&&(n==null||x.n===n));if(a)return a;const kb=kbOf(err);
  return {err,n,sev:"ATTENZIONE",titolo:kb.titolo||err,label:(n!=null?(n?"Presa destra: ":"Presa sinistra: "):"")+(kb.titolo||err),spiega:kb.spiega||"",causa:kb.causa||"",passi:kb.passi||[],
    comps:(kb.ricambi||[]).map(c=>c.replace("{n}",n??0).toUpperCase()),albero:kb.albero||[],manuale:kb.manuale||"",var:"",val:""}}
function treeComps(r,n){return (r||[]).map(c=>c.replace("{n}",n??0).toUpperCase())}
function trova(){const s=byId(R.id),campo=MODE==="campo";
  if(!R.tw||R.tw.id!==s.id)R.tw={id:s.id,step:campo?0:1,err:null,n:null,node:0,path:[],es:null,sost:{},note:"",fixed:null,check:""};const W=R.tw;
  const names=["Colonnina","Errore interno","Domande","Causa e ricambio","Prova finale","Chiusura"];
  const head=`<div class="wsteps">${names.map((n,i)=>(!campo&&!i)?"":`<span class="${i===W.step?"on":i<W.step?"done":""}">${i+(campo?1:0)}. ${n}</span>`).join("")}</div>`;
  const a=W.err&&faultFor(s,W.err,W.n),crumbs=a?`<div class="crumbs"><span class="errcode">${esc(a.err)}</span> ${esc(a.label)}${W.path.map(p=>`<div>✔ ${esc(p.q)} <b>${p.a?"Sì":"No"}</b></div>`).join("")}</div>`:"";let body="";
  if(W.step===0)body=`<h2>Sei davanti alla colonnina giusta?</h2><p style="font-size:18px"><b>${esc(s.nome)}</b><br>${esc(where(s))}${s.cuid?`<br>CUID <b>${esc(s.cuid)}</b>`:""}</p><p class="mute">Confronta con l'etichetta sulla colonnina.</p>
    <div class="qbtns"><button class="btn btn-g btn-xl" data-t="next">Sì, è questa</button><button class="btn btn-o btn-xl" data-p2="cerca">No, cerca un'altra</button></div>`;
  if(W.step===1){const v=(s.r&&s.r.valori)||{};body=`<h2>${s.f.length?"La colonnina segnala questi errori":"La colonnina non segnala errori"}</h2><p class="mute">${s.f.length?"Scegli l'errore da cui partire: il più grave è in alto.":"Se il cliente segnala un problema, scegli il sintomo."}${s.r?" Ultima lettura "+esc(fstamp(s.r.giro))+".":""}</p>
    ${s.f.map(x=>`<button class="errbtn" data-err="${esc(x.err)}" data-n="${x.n??""}"><span style="font-size:28px">${x.sev==="GUASTO"?"⛔":"⚠️"}</span><span style="flex:1"><span class="errcode">${esc(x.err)}</span>${x.da!=null?` <small>da ${giorni(x.da)}</small>`:""}<br><b style="font-size:17px">${esc(x.label)}</b><br><small>la colonnina legge ${esc(x.var)} = <b>${esc(v[x.var]??x.val??"—")}</b></small></span><span style="font-size:22px">›</span></button>`).join("")}
    <h3 style="margin:18px 0 8px;font-size:15px">${s.f.length?"Oppure parti da un sintomo":"Sintomi segnalati"}</h3><div style="display:flex;flex-wrap:wrap;gap:8px">${SINTOMI.map(([t,e,n])=>`<button class="btn btn-o" data-err="${esc(e)}" data-n="${n??""}">${esc(t)}</button>`).join("")}</div>
    ${campo?`<div class="qbtns"><button class="btn btn-o btn-xl" data-t="back">‹ Indietro</button></div>`:""}`}
  if(W.step===2){const nd=a.albero[W.node];body=crumbs+`<div class="qbig">${esc(nd.q)}</div><p class="mute">Domanda ${W.path.length+1}</p>
    <div class="qbtns"><button class="btn btn-g btn-xl" data-ans="1">Sì</button><button class="btn btn-r btn-xl" data-ans="0">No</button><span style="flex:1"></span><button class="btn btn-o" data-t="back">‹ Indietro</button></div>`}
  if(W.step===3){const e=W.es,cs=treeComps(e.r,W.n);body=crumbs+`<div class="esito"><div class="mute">${a.albero.length?"Causa trovata":"Cosa fare"}</div><div class="qbig" style="margin-top:0">${esc(e.c)}</div><div style="font-size:17px"><b>Cosa fare:</b> ${esc(e.a)}</div></div>
    ${cs.length?`<b>Ricambio da montare</b>${cs.map(c=>`<label style="display:flex;gap:12px;align-items:center;cursor:pointer"><input type="checkbox" data-sost="${esc(c)}" ${W.sost[c]?"checked":""} style="width:24px;height:24px">${partCard(c)}</label>`).join("")}<small>Spunta il ricambio quando l'hai montato.</small>`:'<div class="note">Nessun ricambio necessario.</div>'}
    <div style="margin-top:8px">${manLink(a.manuale)}</div>
    <div class="qbtns"><button class="btn btn-o btn-xl" data-t="back">‹ Indietro</button><button class="btn btn-p btn-xl" data-t="next">Fatto: prova finale ›</button><button class="btn btn-o btn-xl" data-t="lv2">Serve secondo livello</button></div>`}
  if(W.step===4)body=`<h2>Prova finale</h2><p style="font-size:17px">Rileggo adesso la colonnina e controllo l'errore <span class="errcode">${esc(a.err)}</span>.</p><div id="wtest" class="note">${W.check||"⏳ lettura in corso…"}</div>
    <div class="qbtns" id="wbt" style="display:${W.fixed==null?"none":"flex"}"><button class="btn btn-o btn-xl" data-t="back">‹ Indietro</button><button class="btn btn-o btn-xl" data-t="retest">↻ Rileggi</button><button class="btn btn-p btn-xl" data-t="next">Avanti ›</button></div>`;
  if(W.step===5)body=`<h2>${W.fixed?"✅ Colonnina ripristinata":"⚠️ Problema non risolto"}</h2><p>${W.fixed?"L'errore interno è rientrato.":"L'intervento sarà registrato come «da completare»."}</p>
    <label>Note (facoltative)<br><textarea id="wnote" rows="3" style="width:100%">${esc(W.note)}</textarea></label><div class="qbtns"><button class="btn btn-g btn-xl" data-t="close">Registra e chiudi</button></div>`;
  if(W.step===4&&W.fixed==null&&!W.testing){W.testing=1;finalCheck()}
  return `<div class="wiz">${stHead(s,"Trova il guasto")}${head}<div class="wcard">${body}</div></div>`}
async function finalCheck(){const W=R.tw,id=W.id;try{const r=await api("/api/diagnosi_una",{id});await refreshResults();const still=(r.anomalie||[]).some(x=>x.guasto===W.err&&(W.n==null||String(x.n)===String(W.n)));
    W.fixed=r.valori&&r.valori._PAGINA==="OK"&&!still;W.check=W.fixed?`✅ Stato regolare: l'errore ${esc(W.err)} non è più presente (esito colonnina: ${esc(r.esito)}).`:r.valori&&r.valori._PAGINA!=="OK"?`⛔ Colonnina non raggiungibile: ${esc(r.errore||"")}`:`⛔ L'errore ${esc(W.err)} è ancora presente.`}

  on("#o-imp","onchange",async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(j.ui)await saveUI(j.ui);if(j.kb){const r=await api("/api/kb",{kb:j.kb});S.kb=r.kb}build();render();toast("Importato")}catch(err){toast("File non valido")}});
  on("#o-html","onchange",async e=>{const f=e.target.files[0];if(!f)return;try{const r=await api("/api/analizza_html",{html:await f.text(),nome:f.name});
    $("#o-res").innerHTML=`<div class="card" style="margin-top:10px"><h5>${esc(f.name)} ${pillS(r.esito)} <small>CUID ${esc(r.cuid||"-")}</small></h5><div class="bd">${(r.anomalie||[]).map(a=>`<div>${pillS(a.gravita)} <span class="errcode">${esc(a.guasto)}</span> ${esc(a.messaggio)}</div>`).join("")||"nessuna anomalia"}</div></div>`}catch(err){toast(err.message)}})}

/* ------------------------------------------------------------------ avvio */
$$(".modes button").forEach(b=>b.onclick=()=>{MODE=b.dataset.mode;LS.set("mode",MODE);R.page="";render()});
setInterval(()=>{const c=$("#clock");if(c)c.textContent=new Date().toLocaleString("it-IT")},1000);
(async()=>{try{await loadAll();const[p,id]=location.hash.slice(1).split("/");if(p)R.page=p;if(id)R.id=decodeURIComponent(id);render()}
  catch(e){$("#main").innerHTML=`<div class="note">Il programma locale non risponde: ${esc(e.message)}. Avvialo con avvia.bat.</div>`}})();

</script>
</body>
</html>
